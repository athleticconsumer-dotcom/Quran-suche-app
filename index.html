     de:{gram:"„Fluss“. Im Quran selten im Singular.", pair:"Plural: أَنْهَار (nächstes Wort).", tip:"Bekannt: Talut prüfte sein Heer mit einem Fluss (2:249).", ex:"Die Gottesfürchtigen werden in Gärten und an einem Fluss sein."},
     en:{gram:"“river”. Rare in the singular in the Quran.", pair:"Plural: أَنْهَار (next word).", tip:"Well known: Talut tested his army with a river (2:249).", ex:"Indeed, the righteous will be among gardens and a river."},
     ru:{gram:"«река». В Коране редко в ед. ч.", pair:"Мн. ч.: أَنْهَار (следующее слово).", tip:"Известно: Талут испытал своё войско рекой (2:249).", ex:"Воистину, богобоязненные окажутся среди садов и рек."} } },
  { id:"anhar", ar:"أَنْهَار", q:"أنهار", ex:{ref:"47:15", ar:"فِيهَآ أَنْهَٰرٌ مِّن مَّآءٍ غَيْرِ ءَاسِنٍ"},
    m:{de:"Flüsse", en:"rivers", ru:"реки"},
    info:{
     de:{gram:"Plural von نَهَر: „Flüsse“. Muster أَفْعَال.", pair:"Singular: نَهَر.", tip:"Sehr häufig in der Beschreibung des Paradieses: جَنَّاتٍ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَارُ.", ex:"darin sind Flüsse von Wasser, das nicht schal wird"},
     en:{gram:"Plural of نَهَر: “rivers”. Pattern أَفْعَال.", pair:"Singular: نَهَر.", tip:"Very common in descriptions of Paradise: جَنَّاتٍ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَارُ.", ex:"in it are rivers of water that never goes stale"},
     ru:{gram:"Мн. ч. от نَهَر: «реки». Модель أَفْعَال.", pair:"Ед. ч.: نَهَر.", tip:"Очень часто в описании Рая: جَنَّاتٍ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَارُ.", ex:"там текут реки из воды, которая никогда не портится"} } },
  { id:"shams", ar:"شَمْس", q:"شمس", ex:{ref:"91:1", ar:"وَٱلشَّمْسِ وَضُحَىٰهَا"},
    m:{de:"Sonne", en:"sun", ru:"солнце"},
    info:{
     de:{gram:"„Sonne“, im Arabischen feminin.", pair:"Oft zusammen mit ٱلْقَمَر (Mond). Sura 91 heißt ٱلشَّمْس.", tip:"Mit Artikel wird das ل nicht gesprochen (Sonnenbuchstabe): asch-schams. Daher kommt der Begriff „Sonnenbuchstaben“.", ex:"Bei der Sonne und ihrer Morgenhelle"},
     en:{gram:"“sun”, feminine in Arabic.", pair:"Often together with ٱلْقَمَر (moon). Surah 91 is called ٱلشَّمْس.", tip:"With the article the ل is not pronounced (sun letter): ash-shams. That's where the term “sun letters” comes from.", ex:"By the sun and its morning brightness"},
     ru:{gram:"«солнце», в арабском женского рода.", pair:"Часто вместе с ٱلْقَمَر (луна). Сура 91 называется ٱلشَّمْس.", tip:"С артиклем ل не произносится (солнечная буква): аш-шамс. Отсюда и термин «солнечные буквы».", ex:"Клянусь солнцем и его сиянием"} } },
  { id:"qamar", ar:"قَمَر", q:"قمر", ex:{ref:"54:1", ar:"ٱقْتَرَبَتِ ٱلسَّاعَةُ وَٱنشَقَّ ٱلْقَمَرُ"},
    m:{de:"Mond", en:"moon", ru:"луна"},
    info:{
     de:{gram:"„Mond“, im Arabischen maskulin.", pair:"Oft zusammen mit ٱلشَّمْس. Sura 54 heißt ٱلْقَمَر.", tip:"Mit Artikel wird das ل gesprochen (Mondbuchstabe): al-qamar. Daher kommt der Begriff „Mondbuchstaben“.", ex:"Die Stunde ist nahegerückt, und der Mond hat sich gespalten."},
     en:{gram:"“moon”, masculine in Arabic.", pair:"Often together with ٱلشَّمْس. Surah 54 is called ٱلْقَمَر.", tip:"With the article the ل is pronounced (moon letter): al-qamar. That's where the term “moon letters” comes from.", ex:"The Hour has come near, and the moon has split."},
     ru:{gram:"«луна», в арабском мужского рода.", pair:"Часто вместе с ٱلشَّمْس. Сура 54 называется ٱلْقَمَر.", tip:"С артиклем ل произносится (лунная буква): аль-камар. Отсюда и термин «лунные буквы».", ex:"Приблизился Час, и раскололся месяц."} } },
  { id:"layl", ar:"لَيْل", q:"ليل|ليلا", ex:{ref:"92:1", ar:"وَٱلَّيْلِ إِذَا يَغْشَىٰ"},
    m:{de:"Nacht", en:"night", ru:"ночь"},
    info:{
     de:{gram:"„Nacht“ (als Zeitraum).", pair:"Gegenteil: نَهَار (Tag). Eine einzelne Nacht: لَيْلَة, z. B. لَيْلَةُ ٱلْقَدْرِ.", tip:"Sehr häufig: ٱخْتِلَافِ ٱللَّيْلِ وَٱلنَّهَارِ (der Wechsel von Nacht und Tag). Sura 92 heißt ٱللَّيْل.", ex:"Bei der Nacht, wenn sie bedeckt"},
     en:{gram:"“night” (as a time period).", pair:"Opposite: نَهَار (day). A single night: لَيْلَة, e.g. لَيْلَةُ ٱلْقَدْرِ.", tip:"Very common: ٱخْتِلَافِ ٱللَّيْلِ وَٱلنَّهَارِ (the alternation of night and day). Surah 92 is called ٱللَّيْل.", ex:"By the night when it covers"},
     ru:{gram:"«ночь» (как время суток).", pair:"Противоположность: نَهَار (день). Одна ночь: لَيْلَة, напр. لَيْلَةُ ٱلْقَدْرِ.", tip:"Очень часто: ٱخْتِلَافِ ٱللَّيْلِ وَٱلنَّهَارِ (смена ночи и дня). Сура 92 называется ٱللَّيْل.", ex:"Клянусь ночью, когда она покрывает"} } },
  { id:"nahar", ar:"نَهَار", q:"نهار|نهارا", ex:{ref:"92:2", ar:"وَٱلنَّهَارِ إِذَا تَجَلَّىٰ"},
    m:{de:"Tag (Tageslicht)", en:"daytime", ru:"день (светлое время)"},
    info:{
     de:{gram:"„Tag“ im Sinn von Tageslicht (von Sonnenaufgang bis Sonnenuntergang).", pair:"Gegenteil: لَيْل (Nacht). Der Tag als Datum: يَوْم.", tip:"Nicht verwechseln mit نَهَر (Fluss): gleiche Wurzel, andere Bedeutung.", ex:"und beim Tag, wenn er hell erscheint"},
     en:{gram:"“day” in the sense of daylight (from sunrise to sunset).", pair:"Opposite: لَيْل (night). Day as a date: يَوْم.", tip:"Don't confuse it with نَهَر (river): same root, different meaning.", ex:"and by the day when it shines"},
     ru:{gram:"«день» в смысле светлого времени суток (от восхода до заката).", pair:"Противоположность: لَيْل (ночь). День как дата: يَوْم.", tip:"Не путай с نَهَر (река): тот же корень, другое значение.", ex:"клянусь днём, когда он становится светлым"} } },
  { id:"ard", ar:"أَرْض", q:"أرض|أرضا|أرضكم|أرضهم|أرضي|أرضنا", ex:{ref:"2:22", ar:"ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًا وَٱلسَّمَآءَ بِنَآءً"},
    m:{de:"Erde, Land", en:"earth, land", ru:"земля"},
    info:{
     de:{gram:"„Erde, Land, Boden“, feminin.", pair:"Fast immer gepaart mit ٱلسَّمَاء / ٱلسَّمَاوَات: ٱلسَّمَاوَاتِ وَٱلْأَرْضِ (die Himmel und die Erde).", tip:"Eines der häufigsten Nomen im Quran. Formen mit Endung (أَرْضِي, أَرْضِهِمْ …) sind mitgesucht.", ex:"der euch die Erde zu einem Teppich und den Himmel zu einem Gebäude gemacht hat"},
     en:{gram:"“earth, land, ground”, feminine.", pair:"Almost always paired with ٱلسَّمَاء / ٱلسَّمَاوَات: ٱلسَّمَاوَاتِ وَٱلْأَرْضِ (the heavens and the earth).", tip:"One of the most frequent nouns in the Quran. Forms with endings (أَرْضِي, أَرْضِهِمْ …) are included.", ex:"who made the earth a bed for you and the sky a ceiling"},
     ru:{gram:"«земля, страна, почва», женского рода.", pair:"Почти всегда в паре с ٱلسَّمَاء / ٱلسَّمَاوَات: ٱلسَّمَاوَاتِ وَٱلْأَرْضِ (небеса и земля).", tip:"Одно из самых частых имён в Коране. Формы с окончаниями (أَرْضِي, أَرْضِهِمْ …) включены.", ex:"Который сделал для вас землю ложем, а небо — сводом"} } },
  { id:"sama", ar:"سَمَاء (سَمَاوَات)", q:"سماء|سماوات", ex:{ref:"67:5", ar:"وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ"},
    m:{de:"Himmel (Pl. سَمَاوَات)", en:"heaven(s), sky", ru:"небо (мн. небеса)"},
    info:{
     de:{gram:"„Himmel“. Plural: سَمَاوَات (die Himmel). Allah schuf sieben Himmel (67:3).", pair:"Gegenstück: أَرْض (Erde).", tip:"Die Suche zählt سَمَاء und سَمَاوَات. Die Wendung ٱلسَّمَاوَاتِ وَٱلْأَرْضِ kommt besonders oft vor.", ex:"Und Wir haben ja den untersten Himmel mit Lampen geschmückt."},
     en:{gram:"“sky, heaven”. Plural: سَمَاوَات (the heavens). Allah created seven heavens (67:3).", pair:"Counterpart: أَرْض (earth).", tip:"The search counts سَمَاء and سَمَاوَات. The phrase ٱلسَّمَاوَاتِ وَٱلْأَرْضِ is especially frequent.", ex:"And We have certainly adorned the nearest heaven with lamps."},
     ru:{gram:"«небо». Мн. ч.: سَمَاوَات (небеса). Аллах сотворил семь небес (67:3).", pair:"Пара: أَرْض (земля).", tip:"Поиск учитывает سَمَاء и سَمَاوَات. Оборот ٱلسَّمَاوَاتِ وَٱلْأَرْضِ встречается особенно часто.", ex:"Мы украсили ближайшее небо светильниками."} } },
  { id:"alaa2", ar:"آلَاء", q:"آلاء", ex:{ref:"55:13", ar:"فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ"},
    m:{de:"Wohltaten (Pl.)", en:"favours, blessings", ru:"милости, блага"},
    info:{
     de:{gram:"„Wohltaten, Gaben“ (Plural). Fast nur in Sura ar-Rahman.", pair:"Ähnlich: نِعْمَة (Gnade), فَضْل (Huld).", tip:"Der Refrain فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ kommt in Sura 55 31-mal vor.", ex:"Welche der Wohltaten eures Herrn wollt ihr beide denn leugnen?"},
     en:{gram:"“favours, blessings” (plural). Almost only in Surah ar-Rahman.", pair:"Similar: نِعْمَة (favour), فَضْل (bounty).", tip:"The refrain فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ occurs 31 times in Surah 55.", ex:"So which of the favours of your Lord would you both deny?"},
     ru:{gram:"«милости, блага» (мн. ч.). Почти только в суре ар-Рахман.", pair:"Похоже: نِعْمَة (милость), فَضْل (щедрость).", tip:"Рефрен فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ встречается в суре 55 31 раз.", ex:"Какую же из милостей вашего Господа вы оба считаете ложью?"} } },
  { id:"nimah", ar:"نِعْمَة", q:"نعمة|نعمت|نعمته|نعمتي|نعمتك|نعمتكم|نعمتنا", vstart:"نِعْمَ", ex:{ref:"14:34", ar:"وَإِن تَعُدُّوا۟ نِعْمَتَ ٱللَّهِ لَا تُحْصُوهَآ"},
    m:{de:"Gnade, Wohltat", en:"favour, blessing", ru:"милость, благо"},
    info:{
     de:{gram:"„Gnade, Wohltat, Segen“. Plural: نِعَم / أَنْعُم.", pair:"Gleiche Wurzel: أَنْعَمَ (Gunst erweisen), نَعِيم (Wonne), أَنْعَام (Vieh).", tip:"Im Uthmani-Text manchmal mit offenem ت geschrieben (نِعْمَتَ). Beide Schreibweisen und Formen mit Endung (نِعْمَتِي …) sind mitgesucht. Nicht verwechseln mit نِعْمَ (wie vortrefflich, 50 % Liste 7).", ex:"Und wenn ihr die Gunst Allahs aufzählen wolltet, könntet ihr sie nicht erfassen."},
     en:{gram:"“favour, blessing, grace”. Plural: نِعَم / أَنْعُم.", pair:"Same root: أَنْعَمَ (to bestow favour), نَعِيم (bliss), أَنْعَام (livestock).", tip:"The Uthmani text sometimes writes it with an open ت (نِعْمَتَ). Both spellings and forms with endings (نِعْمَتِي …) are included. Don't confuse it with نِعْمَ (how excellent, 50% List 7).", ex:"And if you should count the favour of Allah, you could not enumerate it."},
     ru:{gram:"«милость, благо, благодеяние». Мн. ч.: نِعَم / أَنْعُم.", pair:"Тот же корень: أَنْعَمَ (облагодетельствовать), نَعِيم (блаженство), أَنْعَام (скот).", tip:"В османском письме иногда пишется с открытой ت (نِعْمَتَ). Оба написания и формы с окончаниями (نِعْمَتِي …) включены. Не путай с نِعْمَ (как прекрасен, 50 %, список 7).", ex:"Если вы станете считать милости Аллаха, то не сочтёте их."} } },
  { id:"fadl", ar:"فَضْل", q:"فضل|فضله|فضلا|فضلكم", vstart:"فَضْل", art:true, ex:{ref:"62:4", ar:"ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ"},
    m:{de:"Huld, Gunst", en:"grace, bounty", ru:"щедрость, благосклонность"},
    info:{
     de:{gram:"„Huld, Gunst, Überfluss“: Gutes, das Allah über das Verdiente hinaus gibt.", pair:"Wurzel ف ض ل: فَضَّلَ (bevorzugen). Ähnlich: نِعْمَة.", tip:"Typisch: ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَاءُ. Das Verb فَضَّلَ (bevorzugen) wird nicht mitgezählt.", ex:"Das ist Allahs Huld. Er gewährt sie, wem Er will."},
     en:{gram:"“grace, bounty, favour”: good that Allah gives beyond what is deserved.", pair:"Root ف ض ل: فَضَّلَ (to prefer). Similar: نِعْمَة.", tip:"Typical: ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَاءُ. The verb فَضَّلَ (to prefer) is not counted.", ex:"That is the bounty of Allah, which He gives to whom He wills."},
     ru:{gram:"«щедрость, милость, избыток»: благо, которое Аллах даёт сверх заслуженного.", pair:"Корень ف ض ل: فَضَّلَ (предпочесть). Похоже: نِعْمَة.", tip:"Типично: ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَاءُ. Глагол فَضَّلَ (предпочесть) не учитывается.", ex:"Такова милость Аллаха, которую Он дарует, кому пожелает."} } },
  { id:"maa2", ar:"مَاء", q:"ماء|ماءكم|ماءها", ex:{ref:"21:30", ar:"وَجَعَلْنَا مِنَ ٱلْمَآءِ كُلَّ شَىْءٍ حَىٍّ"},
    m:{de:"Wasser", en:"water", ru:"вода"},
    info:{
     de:{gram:"„Wasser“. Im Quran ein Zeichen für Leben und Auferstehung.", pair:"Wurzel م و ه. Ähnlich: مَطَر (Regen).", tip:"Typisch: وَأَنزَلَ مِنَ ٱلسَّمَاءِ مَاءً (und Er sandte vom Himmel Wasser herab), damit die tote Erde wieder lebt.", ex:"Und Wir haben aus dem Wasser alles Lebendige gemacht."},
     en:{gram:"“water”. In the Quran a sign of life and resurrection.", pair:"Root م و ه. Similar: مَطَر (rain).", tip:"Typical: وَأَنزَلَ مِنَ ٱلسَّمَاءِ مَاءً (and He sent down water from the sky), so that the dead earth comes to life again.", ex:"And We made from water every living thing."},
     ru:{gram:"«вода». В Коране — знамение жизни и воскрешения.", pair:"Корень م و ه. Похоже: مَطَر (дождь).", tip:"Типично: وَأَنزَلَ مِنَ ٱلسَّمَاءِ مَاءً (и Он ниспослал с неба воду), чтобы мёртвая земля ожила.", ex:"Мы сотворили из воды всякую живую вещь."} } },
 ]},
 { id:5, sub:{de:"Religion (Din)", en:"Deen (religion)", ru:"Религия (дин)"}, words:[
  { id:"din", ar:"دِين", q:"دين|دينه|دينكم|دينهم|ديني|دينا", vstart:"دِين", art:true, ex:{ref:"109:6", ar:"لَكُمْ دِينُكُمْ وَلِىَ دِينِ"},
    m:{de:"Religion; Gericht", en:"religion; judgement", ru:"религия; воздаяние"},
    info:{
     de:{gram:"„Religion, Lebensweg“, auch „Vergeltung, Gericht“: يَوْمِ ٱلدِّينِ (der Tag des Gerichts).", pair:"Wurzel د ي ن. Nicht verwechseln mit دَيْن (Schuld) mit Fatha.", tip:"Bekannt: إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَامُ (3:19). Die Suche zählt beide Bedeutungen, die App zeigt nur دِين mit Kasra.", ex:"Euch eure Religion und mir meine Religion."},
     en:{gram:"“religion, way of life”, also “recompense, judgement”: يَوْمِ ٱلدِّينِ (the Day of Judgement).", pair:"Root د ي ن. Don't confuse it with دَيْن (debt) with a fatha.", tip:"Well known: إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَامُ (3:19). The search counts both meanings; the app only shows دِين with a kasra.", ex:"For you is your religion, and for me is my religion."},
     ru:{gram:"«религия, образ жизни», также «воздаяние, суд»: يَوْمِ ٱلدِّينِ (День воздаяния).", pair:"Корень د ي ن. Не путай с دَيْن (долг) с фатхой.", tip:"Известно: إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَامُ (3:19). Поиск учитывает оба значения, приложение показывает только دِين с кясрой.", ex:"У вас — ваша религия, а у меня — моя!"} } },
  { id:"amr", ar:"أَمْر", q:"أمر|أمره|أمرهم|أمركم|أمرنا|أمري|أمرها|أمرا", vstart:"أَمْر", art:true, ex:{ref:"36:82", ar:"إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ"},
    m:{de:"Angelegenheit; Befehl", en:"matter, affair; command", ru:"дело; повеление"},
    info:{
     de:{gram:"„Angelegenheit, Sache“ und „Befehl“.", pair:"Wurzel أ م ر: أَمَرَ (befehlen). Plural: أُمُور (Angelegenheiten).", tip:"Das Verb أَمَرَ (er befahl) wird nicht mitgezählt. Typisch: إِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ (zu Allah werden die Angelegenheiten zurückgebracht).", ex:"Sein Befehl, wenn Er eine Sache will, ist nur, dass Er zu ihr sagt: Sei!, und so ist sie."},
     en:{gram:"“matter, affair” and “command”.", pair:"Root أ م ر: أَمَرَ (to command). Plural: أُمُور (affairs).", tip:"The verb أَمَرَ (he commanded) is not counted. Typical: إِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ (to Allah all matters are returned).", ex:"His command, when He intends a thing, is only that He says to it: Be, and it is."},
     ru:{gram:"«дело» и «повеление».", pair:"Корень أ م ر: أَمَرَ (повелевать). Мн. ч.: أُمُور (дела).", tip:"Глагол أَمَرَ (он повелел) не учитывается. Типично: إِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ (к Аллаху возвращаются все дела).", ex:"Когда Он желает чего-либо, стоит Ему сказать: «Будь!» — как это сбывается."} } },
  { id:"amal", ar:"عَمَل (أَعْمَال)", q:"عمل|عمله|عملهم|عملكم|عملا|أعمال|أعمالهم|أعمالكم|أعمالنا|أعماله", vstart:["عَمَل","أَعْمَال"], art:true, ex:{ref:"18:110", ar:"فَلْيَعْمَلْ عَمَلًا صَٰلِحًا"},
    m:{de:"Tat (Pl. أَعْمَال)", en:"deed(s), action(s)", ru:"деяние (мн. أَعْمَال)"},
    info:{
     de:{gram:"„Tat, Handlung“. Plural: أَعْمَال.", pair:"Wurzel ع م ل: عَمِلَ (tun), يَعْمَلُونَ (sie tun).", tip:"Sehr häufig: عَمِلُوا ٱلصَّالِحَاتِ (sie taten gute Werke). Das Verb عَمِلَ wird nicht mitgezählt, nur das Nomen.", ex:"der soll rechtschaffen handeln"},
     en:{gram:"“deed, action”. Plural: أَعْمَال.", pair:"Root ع م ل: عَمِلَ (to do), يَعْمَلُونَ (they do).", tip:"Very common: عَمِلُوا ٱلصَّالِحَاتِ (they did righteous deeds). The verb عَمِلَ is not counted, only the noun.", ex:"let him do righteous work"},
     ru:{gram:"«деяние, поступок». Мн. ч.: أَعْمَال.", pair:"Корень ع م ل: عَمِلَ (делать), يَعْمَلُونَ (они делают).", tip:"Очень часто: عَمِلُوا ٱلصَّالِحَاتِ (они совершали праведные дела). Глагол عَمِلَ не учитывается, только имя.", ex:"пусть совершает праведные деяния"} } },
  { id:"salah", ar:"صَلَاة", q:"صلاة|صلاته|صلاتهم|صلاتك|صلاتي|صلوات|صلواتهم", ex:{ref:"20:14", ar:"وَأَقِمِ ٱلصَّلَوٰةَ لِذِكْرِىٓ"},
    m:{de:"Gebet", en:"prayer", ru:"молитва, намаз"},
    info:{
     de:{gram:"„Gebet“ (das rituelle Gebet). Plural: صَلَوَات.", pair:"Fast immer mit أَقِيمُوا (verrichtet): أَقِيمُوا ٱلصَّلَاةَ وَآتُوا ٱلزَّكَاةَ.", tip:"Im Uthmani-Text mit و geschrieben (ٱلصَّلَوٰة), gesprochen aṣ-ṣalāh. Die Suche findet beide Schreibweisen.", ex:"und verrichte das Gebet zu Meinem Gedenken"},
     en:{gram:"“prayer” (the ritual prayer). Plural: صَلَوَات.", pair:"Almost always with أَقِيمُوا (establish): أَقِيمُوا ٱلصَّلَاةَ وَآتُوا ٱلزَّكَاةَ.", tip:"The Uthmani text writes it with و (ٱلصَّلَوٰة), pronounced aṣ-ṣalāh. The search finds both spellings.", ex:"and establish prayer for My remembrance"},
     ru:{gram:"«молитва» (обрядовая, намаз). Мн. ч.: صَلَوَات.", pair:"Почти всегда с أَقِيمُوا (совершайте): أَقِيمُوا ٱلصَّلَاةَ وَآتُوا ٱلزَّكَاةَ.", tip:"В османском письме пишется с و (ٱلصَّلَوٰة), читается aṣ-ṣalāh. Поиск находит оба написания.", ex:"и совершай намаз, чтобы поминать Меня"} } },
  { id:"zakah", ar:"زَكَاة", q:"زكاة", ex:{ref:"2:43", ar:"وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ"},
    m:{de:"Zakat (Pflichtabgabe)", en:"zakat, charity", ru:"закят"},
    info:{
     de:{gram:"„Zakat“, die Pflichtabgabe für Bedürftige. Wörtlich: „Reinigung, Wachstum“.", pair:"Fast immer nach dem Gebet: وَآتُوا ٱلزَّكَاةَ (und entrichtet die Zakat). Freiwillige Spende: صَدَقَة.", tip:"Gleiche Wurzel: تَزَكَّىٰ (sich läutern). Auch im Uthmani-Text mit و geschrieben (ٱلزَّكَوٰة).", ex:"Und verrichtet das Gebet und entrichtet die Zakat."},
     en:{gram:"“zakat”, the obligatory charity for those in need. Literally “purification, growth”.", pair:"Almost always after prayer: وَآتُوا ٱلزَّكَاةَ (and give zakat). Voluntary charity: صَدَقَة.", tip:"Same root: تَزَكَّىٰ (to purify oneself). The Uthmani text also writes it with و (ٱلزَّكَوٰة).", ex:"And establish prayer and give zakat."},
     ru:{gram:"«закят», обязательная милостыня нуждающимся. Буквально «очищение, рост».", pair:"Почти всегда после намаза: وَآتُوا ٱلزَّكَاةَ (и выплачивайте закят). Добровольная милостыня: صَدَقَة.", tip:"Тот же корень: تَزَكَّىٰ (очиститься). В османском письме тоже с و (ٱلزَّكَوٰة).", ex:"Совершайте намаз, выплачивайте закят."} } },
  { id:"haqq", ar:"حَقّ", q:"حق|حقا|حقه", vstart:"حَقّ", art:true, ex:{ref:"17:81", ar:"وَقُلْ جَآءَ ٱلْحَقُّ وَزَهَقَ ٱلْبَٰطِلُ"},
    m:{de:"Wahrheit, Recht", en:"truth, right", ru:"истина, право"},
    info:{
     de:{gram:"„Wahrheit, das Richtige, ein Recht“. Als Name Allahs: ٱلْحَقّ.", pair:"Gegenteil: بَاطِل (das Falsche). Steigerung: أَحَقّ (65 % Liste 2).", tip:"حَقًّا heißt „wahrhaftig“: وَعْدَ ٱللَّهِ حَقًّا (Allahs wahres Versprechen).", ex:"Und sag: Die Wahrheit ist gekommen, und das Falsche ist vergangen."},
     en:{gram:"“truth, what is right, a right”. As a name of Allah: ٱلْحَقّ.", pair:"Opposite: بَاطِل (falsehood). Comparative: أَحَقّ (65% List 2).", tip:"حَقًّا means “truly”: وَعْدَ ٱللَّهِ حَقًّا (Allah's true promise).", ex:"And say: Truth has come, and falsehood has vanished."},
     ru:{gram:"«истина, правда, право». Как имя Аллаха: ٱلْحَقّ.", pair:"Противоположность: بَاطِل (ложь). Сравнительная степень: أَحَقّ (65 %, список 2).", tip:"حَقًّا значит «воистину»: وَعْدَ ٱللَّهِ حَقًّا (истинное обещание Аллаха).", ex:"Скажи: «Пришла истина, и сгинула ложь»."} } },
  { id:"batil", ar:"بَاطِل", q:"باطل|باطلا", ex:{ref:"2:42", ar:"وَلَا تَلْبِسُوا۟ ٱلْحَقَّ بِٱلْبَٰطِلِ"},
    m:{de:"das Falsche, Lüge", en:"falsehood", ru:"ложь"},
    info:{
     de:{gram:"„das Falsche, Nichtige, Lüge“.", pair:"Gegenteil: حَقّ (Wahrheit).", tip:"Bekannt: إِنَّ ٱلْبَاطِلَ كَانَ زَهُوقًا (das Falsche ist dazu bestimmt zu vergehen, 17:81). Auch بِٱلْبَاطِلِ (auf unrechte Weise), z. B. beim Verzehr fremden Besitzes.", ex:"Und vermengt nicht die Wahrheit mit dem Falschen."},
     en:{gram:"“falsehood, what is void, a lie”.", pair:"Opposite: حَقّ (truth).", tip:"Well known: إِنَّ ٱلْبَاطِلَ كَانَ زَهُوقًا (falsehood is bound to vanish, 17:81). Also بِٱلْبَاطِلِ (unjustly), e.g. consuming others' property.", ex:"And do not mix the truth with falsehood."},
     ru:{gram:"«ложь, тщетное, напрасное».", pair:"Противоположность: حَقّ (истина).", tip:"Известно: إِنَّ ٱلْبَاطِلَ كَانَ زَهُوقًا (ложь обречена исчезнуть, 17:81). Также بِٱلْبَاطِلِ (неправедно), напр. о поедании чужого имущества.", ex:"Не облекайте истину в ложь."} } },
  { id:"hamd", ar:"حَمْد", q:"حمد", vstart:"حَمْد", art:true, ex:{ref:"17:111", ar:"وَقُلِ ٱلْحَمْدُ لِلَّهِ ٱلَّذِى لَمْ يَتَّخِذْ وَلَدًا"},
    m:{de:"Lob", en:"praise", ru:"хвала"},
    info:{
     de:{gram:"„Lob, Dank“ für Allah.", pair:"Gleiche Wurzel: حَمِيد (lobenswürdig, 65 % Liste 1), مُحَمَّد, أَحْمَد.", tip:"Am bekanntesten: ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَالَمِينَ (1:2). Auch بِحَمْدِ رَبِّكَ (mit dem Lob deines Herrn) ist mitgezählt.", ex:"Und sag: Alles Lob gehört Allah, der Sich kein Kind genommen hat."},
     en:{gram:"“praise, thanks” for Allah.", pair:"Same root: حَمِيد (praiseworthy, 65% List 1), مُحَمَّد, أَحْمَد.", tip:"Best known: ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَالَمِينَ (1:2). بِحَمْدِ رَبِّكَ (with the praise of your Lord) is counted too.", ex:"And say: Praise be to Allah, who has not taken a son."},
     ru:{gram:"«хвала, благодарность» Аллаху.", pair:"Тот же корень: حَمِيد (достохвальный, 65 %, список 1), مُحَمَّد, أَحْمَد.", tip:"Самое известное: ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَالَمِينَ (1:2). بِحَمْدِ رَبِّكَ (с хвалой твоего Господа) тоже учитывается.", ex:"Скажи: «Хвала Аллаху, Который не взял Себе сына»."} } },
  { id:"hikma", ar:"حِكْمَة", q:"حكمة", ex:{ref:"2:269", ar:"يُؤْتِى ٱلْحِكْمَةَ مَن يَشَآءُ ۚ وَمَن يُؤْتَ ٱلْحِكْمَةَ فَقَدْ أُوتِىَ خَيْرًا كَثِيرًا"},
    m:{de:"Weisheit", en:"wisdom", ru:"мудрость"},
    info:{
     de:{gram:"„Weisheit“: richtiges Wissen und richtiges Handeln.", pair:"Gleiche Wurzel: حَكِيم (allweise, 65 % Liste 1), حُكْم (Urteil).", tip:"Oft zusammen: ٱلْكِتَابَ وَٱلْحِكْمَةَ (die Schrift und die Weisheit), das viele als Sunna erklären.", ex:"Er gibt Weisheit, wem Er will, und wem Weisheit gegeben wird, dem ist viel Gutes gegeben worden."},
     en:{gram:"“wisdom”: right knowledge and right action.", pair:"Same root: حَكِيم (all-wise, 65% List 1), حُكْم (judgement).", tip:"Often together: ٱلْكِتَابَ وَٱلْحِكْمَةَ (the Book and the wisdom), which many explain as the Sunnah.", ex:"He gives wisdom to whom He wills, and whoever is given wisdom has certainly been given much good."},
     ru:{gram:"«мудрость»: верное знание и верное действие.", pair:"Тот же корень: حَكِيم (мудрый, 65 %, список 1), حُكْم (решение).", tip:"Часто вместе: ٱلْكِتَابَ وَٱلْحِكْمَةَ (Писание и мудрость), что многие толкуют как Сунну.", ex:"Он дарует мудрость, кому пожелает, а тот, кому дарована мудрость, удостоился великого блага."} } },
  { id:"taqwa", ar:"تَقْوَىٰ", q:"تقوى|تقواها|تقواهم", ex:{ref:"2:197", ar:"وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ"},
    m:{de:"Gottesfurcht", en:"piety, fear of Allah", ru:"богобоязненность"},
    info:{
     de:{gram:"„Gottesfurcht, Frömmigkeit“: sich vor Allahs Missfallen schützen.", pair:"Wurzel و ق ي: ٱتَّقُوا (fürchtet Allah), مُتَّقِين (die Gottesfürchtigen).", tip:"Bekannt: إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَاكُمْ (der Edelste von euch bei Allah ist der Gottesfürchtigste, 49:13).", ex:"Und versorgt euch mit Proviant, doch der beste Proviant ist die Gottesfurcht."},
     en:{gram:"“piety, God-consciousness”: protecting oneself from Allah's displeasure.", pair:"Root و ق ي: ٱتَّقُوا (fear Allah), مُتَّقِين (the God-fearing).", tip:"Well known: إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَاكُمْ (the noblest of you with Allah is the most God-fearing, 49:13).", ex:"And take provisions, but the best provision is piety."},
     ru:{gram:"«богобоязненность, благочестие»: оберегать себя от неудовольствия Аллаха.", pair:"Корень و ق ي: ٱتَّقُوا (бойтесь Аллаха), مُتَّقِين (богобоязненные).", tip:"Известно: إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَاكُمْ (самый почитаемый из вас перед Аллахом — самый богобоязненный, 49:13).", ex:"Берите с собой припасы, но лучший из припасов — богобоязненность."} } },
  { id:"shahid", ar:"شَهِيد", q:"شهيد|شهيدا", ex:{ref:"4:79", ar:"وَكَفَىٰ بِٱللَّهِ شَهِيدًا"},
    m:{de:"Zeuge", en:"witness", ru:"свидетель"},
    info:{
     de:{gram:"„Zeuge“, Muster فَعِيل. Auch: „Märtyrer“.", pair:"Plural: شُهَدَاء (nächstes Wort). Wurzel ش ه د: شَهِدَ (bezeugen).", tip:"Allah ist عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ (über alles Zeuge). شَهِيدًا ist mitgesucht.", ex:"Und Allah genügt als Zeuge."},
     en:{gram:"“witness”, pattern فَعِيل. Also “martyr”.", pair:"Plural: شُهَدَاء (next word). Root ش ه د: شَهِدَ (to witness).", tip:"Allah is عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ (Witness over all things). شَهِيدًا is included.", ex:"And sufficient is Allah as Witness."},
     ru:{gram:"«свидетель», модель فَعِيل. Также «мученик».", pair:"Мн. ч.: شُهَدَاء (следующее слово). Корень ش ه د: شَهِدَ (свидетельствовать).", tip:"Аллах — عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ (Свидетель всякой вещи). شَهِيدًا включено.", ex:"Довольно того, что Аллах — Свидетель."} } },
  { id:"shuhada", ar:"شُهَدَاء", q:"شهداء", ex:{ref:"2:143", ar:"لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ"},
    m:{de:"Zeugen", en:"witnesses", ru:"свидетели"},
    info:{
     de:{gram:"Plural von شَهِيد: „Zeugen“, auch „Märtyrer“.", pair:"Singular: شَهِيد. Muster فُعَلَاء, wie عُلَمَاء (Gelehrte).", tip:"Die Gemeinschaft soll Zeugen über die Menschen sein (2:143).", ex:"damit ihr Zeugen über die Menschen seid"},
     en:{gram:"Plural of شَهِيد: “witnesses”, also “martyrs”.", pair:"Singular: شَهِيد. Pattern فُعَلَاء, like عُلَمَاء (scholars).", tip:"The community is to be witnesses over mankind (2:143).", ex:"so that you will be witnesses over the people"},
     ru:{gram:"Мн. ч. от شَهِيد: «свидетели», также «мученики».", pair:"Ед. ч.: شَهِيد. Модель فُعَلَاء, как عُلَمَاء (учёные).", tip:"Община должна быть свидетелями обо всех людях (2:143).", ex:"чтобы вы были свидетелями обо всём человечестве"} } },
  { id:"mubin", ar:"مُبِين", q:"مبين|مبينا", ex:{ref:"12:1", ar:"تِلْكَ ءَايَٰتُ ٱلْكِتَٰبِ ٱلْمُبِينِ"},
    m:{de:"deutlich, klar", en:"clear", ru:"ясный"},
    info:{
     de:{gram:"„deutlich, klar, offenkundig“.", pair:"Wurzel ب ي ن: بَيَّنَ (deutlich machen), بَيِّنَة (klarer Beweis).", tip:"Beschreibt oft das Buch (ٱلْكِتَابِ ٱلْمُبِينِ) oder einen Feind: عَدُوٌّ مُبِينٌ (ein offenkundiger Feind).", ex:"Dies sind die Verse des deutlichen Buches."},
     en:{gram:"“clear, manifest, evident”.", pair:"Root ب ي ن: بَيَّنَ (to make clear), بَيِّنَة (clear proof).", tip:"It often describes the Book (ٱلْكِتَابِ ٱلْمُبِينِ) or an enemy: عَدُوٌّ مُبِينٌ (a clear enemy).", ex:"These are the verses of the clear Book."},
     ru:{gram:"«ясный, явный, очевидный».", pair:"Корень ب ي ن: بَيَّنَ (разъяснять), بَيِّنَة (ясное доказательство).", tip:"Часто описывает Писание (ٱلْكِتَابِ ٱلْمُبِينِ) или врага: عَدُوٌّ مُبِينٌ (явный враг).", ex:"Это — аяты ясного Писания."} } },
  { id:"nur", ar:"نُور", q:"نور|نورا|نوره|نورهم|نورنا|نورك", vstart:"نُور", art:true, ex:{ref:"24:35", ar:"ٱللَّهُ نُورُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ"},
    m:{de:"Licht", en:"light", ru:"свет"},
    info:{
     de:{gram:"„Licht“. Bildlich: Rechtleitung und Glaube.", pair:"Gegenteil: ظُلُمَات (Finsternisse). Oft: مِنَ ٱلظُّلُمَاتِ إِلَى ٱلنُّورِ (aus den Finsternissen ins Licht).", tip:"Sura 24 heißt ٱلنُّور. Ihr Lichtvers (24:35) ist einer der bekanntesten des Quran.", ex:"Allah ist das Licht der Himmel und der Erde."},
     en:{gram:"“light”. Figuratively: guidance and faith.", pair:"Opposite: ظُلُمَات (darknesses). Often: مِنَ ٱلظُّلُمَاتِ إِلَى ٱلنُّورِ (out of darkness into light).", tip:"Surah 24 is called ٱلنُّور. Its Verse of Light (24:35) is one of the best known in the Quran.", ex:"Allah is the Light of the heavens and the earth."},
     ru:{gram:"«свет». Переносно: верное руководство и вера.", pair:"Противоположность: ظُلُمَات (мраки). Часто: مِنَ ٱلظُّلُمَاتِ إِلَى ٱلنُّورِ (из мраков к свету).", tip:"Сура 24 называется ٱلنُّور. Её аят о Свете (24:35) — один из самых известных в Коране.", ex:"Аллах — Свет небес и земли."} } },
  { id:"salam", ar:"سَلَام", q:"سلام|سلاما", ex:{ref:"36:58", ar:"سَلَٰمٌ قَوْلًا مِّن رَّبٍّ رَّحِيمٍ"},
    m:{de:"Frieden", en:"peace", ru:"мир"},
    info:{
     de:{gram:"„Frieden, Unversehrtheit, Friedensgruß“. Als Name Allahs: ٱلسَّلَام.", pair:"Wurzel س ل م: إِسْلَام (Hingabe), مُسْلِم, سَلِيم (heil).", tip:"Der Gruß des Paradieses: سَلَامٌ عَلَيْكُمْ. Auch: دَارُ ٱلسَّلَامِ (das Haus des Friedens, das Paradies).", ex:"Friede! als Wort von einem barmherzigen Herrn"},
     en:{gram:"“peace, safety, greeting of peace”. As a name of Allah: ٱلسَّلَام.", pair:"Root س ل م: إِسْلَام (submission), مُسْلِم, سَلِيم (sound).", tip:"The greeting of Paradise: سَلَامٌ عَلَيْكُمْ. Also: دَارُ ٱلسَّلَامِ (the Home of Peace, Paradise).", ex:"Peace, a word from a Merciful Lord"},
     ru:{gram:"«мир, благополучие, приветствие миром». Как имя Аллаха: ٱلسَّلَام.", pair:"Корень س ل م: إِسْلَام (покорность), مُسْلِم, سَلِيم (здоровый).", tip:"Приветствие Рая: سَلَامٌ عَلَيْكُمْ. Также: دَارُ ٱلسَّلَامِ (Обитель мира, Рай).", ex:"Мир! — таково слово Милосердного Господа"} } },
  { id:"mulk", ar:"مُلْك", q:"ملك|ملكه|ملكا|ملكهم", vstart:"مُلْك", art:true, ex:{ref:"3:26", ar:"قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ"},
    m:{de:"Herrschaft", en:"dominion, reign", ru:"власть, царство"},
    info:{
     de:{gram:"„Herrschaft, Königreich“ (mit Damma: mulk).", pair:"Gleiche Buchstaben: مَلِك (König), مَلَك (Engel, 65 % Liste 6), مَالِك (Besitzer). Die App zeigt nur مُلْك.", tip:"Sura 67 heißt ٱلْمُلْك: تَبَارَكَ ٱلَّذِي بِيَدِهِ ٱلْمُلْكُ.", ex:"Sag: O Allah, Herr der Herrschaft, Du gibst die Herrschaft, wem Du willst."},
     en:{gram:"“dominion, kingship” (with damma: mulk).", pair:"Same letters: مَلِك (king), مَلَك (angel, 65% List 6), مَالِك (owner). The app only shows مُلْك.", tip:"Surah 67 is called ٱلْمُلْك: تَبَارَكَ ٱلَّذِي بِيَدِهِ ٱلْمُلْكُ.", ex:"Say: O Allah, Owner of dominion, You give dominion to whom You will."},
     ru:{gram:"«власть, царство» (с даммой: mulk).", pair:"Те же буквы: مَلِك (царь), مَلَك (ангел, 65 %, список 6), مَالِك (владелец). Приложение показывает только مُلْك.", tip:"Сура 67 называется ٱلْمُلْك: تَبَارَكَ ٱلَّذِي بِيَدِهِ ٱلْمُلْكُ.", ex:"Скажи: «О Аллах, Владыка царства! Ты даруешь власть, кому пожелаешь»."} } },
  { id:"sultan", ar:"سُلْطَان", q:"سلطان|سلطانا|سلطانه", ex:{ref:"55:33", ar:"لَا تَنفُذُونَ إِلَّا بِسُلْطَٰنٍ"},
    m:{de:"Macht, Ermächtigung", en:"authority, warrant", ru:"власть, довод"},
    info:{
     de:{gram:"„Macht, Autorität“ und „Beweis, Ermächtigung“.", pair:"Wurzel س ل ط: سَلَّطَ (Gewalt geben über).", tip:"Oft verneint: مَا أَنزَلَ ٱللَّهُ بِهَا مِن سُلْطَانٍ (Allah hat dafür keine Ermächtigung herabgesandt). Auch: Satan hat keine Macht über die Gläubigen (16:99).", ex:"Ihr könnt es nur mit einer Ermächtigung."},
     en:{gram:"“power, authority” and “proof, warrant”.", pair:"Root س ل ط: سَلَّطَ (to give power over).", tip:"Often negated: مَا أَنزَلَ ٱللَّهُ بِهَا مِن سُلْطَانٍ (Allah has sent down no authority for it). Also: Satan has no power over the believers (16:99).", ex:"You will not pass except with authority."},
     ru:{gram:"«власть, сила» и «довод, полномочие».", pair:"Корень س ل ط: سَلَّطَ (дать власть над).", tip:"Часто с отрицанием: مَا أَنزَلَ ٱللَّهُ بِهَا مِن سُلْطَانٍ (Аллах не ниспослал об этом никакого довода). Также: у сатаны нет власти над верующими (16:99).", ex:"Но вы не сможете сделать это без власти."} } },
 ]},
 { id:6, sub:{de:"Glaube", en:"Faith", ru:"Вера"}, words:[
  { id:"ilah", ar:"إِلَٰه", q:"إله|إلها|إلهكم|إلهه|إلهك|إلهنا|إلهي", vstart:"إِلَه", ex:{ref:"2:163", ar:"وَإِلَٰهُكُمْ إِلَٰهٌ وَٰحِدٌ ۖ لَّآ إِلَٰهَ إِلَّا هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ"},
    m:{de:"Gott, Gottheit", en:"god, deity", ru:"бог, божество"},
    info:{
     de:{gram:"„Gott, Gottheit“: das, was angebetet wird. Plural: آلِهَة.", pair:"ٱللَّه ist der Eigenname, إِلَٰه der Gattungsbegriff. Kern der Schahada: لَا إِلَٰهَ إِلَّا ٱللَّهُ.", tip:"Das ā wird mit kleinem Alif geschrieben: ilāh. Nicht verwechseln mit آلِهَة (Götter), die App trennt beide über die Vokale.", ex:"Euer Gott ist ein Einziger Gott. Es gibt keinen Gott außer Ihm, dem Allerbarmer, dem Barmherzigen."},
     en:{gram:"“god, deity”: whatever is worshipped. Plural: آلِهَة.", pair:"ٱللَّه is the proper name, إِلَٰه the general term. Heart of the shahada: لَا إِلَٰهَ إِلَّا ٱللَّهُ.", tip:"The ā is written with a small alif: ilāh. Don't confuse it with آلِهَة (gods); the app separates them by their vowels.", ex:"And your god is one God. There is no deity except Him, the Most Compassionate, the Most Merciful."},
     ru:{gram:"«бог, божество»: то, чему поклоняются. Мн. ч.: آلِهَة.", pair:"ٱللَّه — имя собственное, إِلَٰه — общее понятие. Основа шахады: لَا إِلَٰهَ إِلَّا ٱللَّهُ.", tip:"ā пишется маленьким алифом: ilāh. Не путай с آلِهَة (боги), приложение различает их по огласовкам.", ex:"Ваш Бог — Бог Единственный. Нет божества, кроме Него, Милостивого, Милосердного."} } },
  { id:"aliha", ar:"آلِهَة", q:"آلهة|آلهتنا|آلهتكم|آلهتهم|آلهتي", vstart:"آلِهَ", ex:{ref:"21:22", ar:"لَوْ كَانَ فِيهِمَآ ءَالِهَةٌ إِلَّا ٱللَّهُ لَفَسَدَتَا"},
    m:{de:"Götter", en:"gods", ru:"боги"},
    info:{
     de:{gram:"Plural von إِلَٰه: „Götter“.", pair:"Singular: إِلَٰه. Muster أَفْعِلَة.", tip:"Im Quran meist über die Götzen, die neben Allah angebetet werden: أَتَّخِذُ أَصْنَامًا آلِهَةً (nimmst du Götzen als Götter?, 6:74).", ex:"Gäbe es in Himmel und Erde Götter außer Allah, wären beide gewiss zerrüttet."},
     en:{gram:"Plural of إِلَٰه: “gods”.", pair:"Singular: إِلَٰه. Pattern أَفْعِلَة.", tip:"In the Quran mostly about the idols worshipped besides Allah: أَتَّخِذُ أَصْنَامًا آلِهَةً (do you take idols as gods?, 6:74).", ex:"Had there been within them gods besides Allah, they both would have been ruined."},
     ru:{gram:"Мн. ч. от إِلَٰه: «боги».", pair:"Ед. ч.: إِلَٰه. Модель أَفْعِلَة.", tip:"В Коране в основном об идолах, которым поклоняются помимо Аллаха: أَتَّخِذُ أَصْنَامًا آلِهَةً (неужели ты считаешь идолов богами?, 6:74).", ex:"Если бы на небесах и на земле были другие боги, помимо Аллаха, то они пришли бы в негодность."} } },
  { id:"wahid", ar:"وَاحِد", q:"واحد|واحدا|واحدة", ex:{ref:"13:16", ar:"وَهُوَ ٱلْوَٰحِدُ ٱلْقَهَّٰرُ"},
    m:{de:"eins, einer (Zahl)", en:"one (number)", ru:"один (число)"},
    info:{
     de:{gram:"„eins, einer“, die Zahl. Als Name Allahs: ٱلْوَاحِد, der Eine. Feminin: وَاحِدَة.", pair:"Ähnlich: أَحَد (einer, der Einzige). Gegenteil: كَثِير (viele).", tip:"Typisch: إِلَٰهٌ وَاحِدٌ (ein einziger Gott). Auch نَفْسٍ وَاحِدَةٍ (eine einzige Seele, aus der die Menschen erschaffen wurden).", ex:"Und Er ist der Eine, der Allbezwingende."},
     en:{gram:"“one”, the number. As a name of Allah: ٱلْوَاحِد, the One. Feminine: وَاحِدَة.", pair:"Similar: أَحَد (one, the Unique). Opposite: كَثِير (many).", tip:"Typical: إِلَٰهٌ وَاحِدٌ (one God). Also نَفْسٍ وَاحِدَةٍ (a single soul, from which mankind was created).", ex:"And He is the One, the Prevailing."},
     ru:{gram:"«один», число. Как имя Аллаха: ٱلْوَاحِد, Единственный. Ж. р.: وَاحِدَة.", pair:"Похоже: أَحَد (один, Единый). Противоположность: كَثِير (много).", tip:"Типично: إِلَٰهٌ وَاحِدٌ (Бог Единственный). Также نَفْسٍ وَاحِدَةٍ (одна душа, из которой созданы люди).", ex:"Он — Единственный, Могущественный."} } },
  { id:"ahad", ar:"أَحَد", q:"أحد|أحدا|أحدكم|أحدهم|أحدهما", vstart:"أَحَد", art:true, ex:{ref:"112:1", ar:"قُلْ هُوَ ٱللَّهُ أَحَدٌ"},
    m:{de:"einer, irgendeiner; der Einzige", en:"one, anyone; the Unique", ru:"один, кто-либо; Единый"},
    info:{
     de:{gram:"„einer, irgendeiner“. Verneint: „niemand“. Als Name Allahs: ٱلْأَحَد, der Einzige.", pair:"Ähnlich: وَاحِد (eins, die Zahl). أَحَد betont die Einzigartigkeit.", tip:"Mit Verneinung: وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ (und niemand ist Ihm gleich, 112:4). أَحَدُكُمْ heißt „einer von euch“.", ex:"Sag: Er ist Allah, ein Einziger."},
     en:{gram:"“one, anyone”. With negation: “no one”. As a name of Allah: ٱلْأَحَد, the Unique.", pair:"Similar: وَاحِد (one, the number). أَحَد stresses uniqueness.", tip:"With negation: وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ (and there is none comparable to Him, 112:4). أَحَدُكُمْ means “one of you”.", ex:"Say: He is Allah, the One."},
     ru:{gram:"«один, кто-либо». С отрицанием: «никто». Как имя Аллаха: ٱلْأَحَد, Единый.", pair:"Похоже: وَاحِد (один, число). أَحَد подчёркивает единственность.", tip:"С отрицанием: وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ (и нет никого, равного Ему, 112:4). أَحَدُكُمْ значит «один из вас».", ex:"Скажи: «Он — Аллах Единый»."} } },
  { id:"sharik", ar:"شَرِيك", q:"شريك|شريكا", ex:{ref:"6:163", ar:"لَا شَرِيكَ لَهُۥ"},
    m:{de:"Teilhaber", en:"partner, associate", ru:"сотоварищ"},
    info:{
     de:{gram:"„Teilhaber, Partner“, Muster فَعِيل.", pair:"Plural: شُرَكَاء. Wurzel ش ر ك: شِرْك (Beigesellung), مُشْرِك (Götzendiener).", tip:"Bekannt: لَا شَرِيكَ لَهُ (Er hat keinen Teilhaber). شِرْك ist die schwerste Sünde (4:48).", ex:"Er hat keinen Teilhaber."},
     en:{gram:"“partner, associate”, pattern فَعِيل.", pair:"Plural: شُرَكَاء. Root ش ر ك: شِرْك (associating partners with Allah), مُشْرِك (polytheist).", tip:"Well known: لَا شَرِيكَ لَهُ (He has no partner). Shirk is the gravest sin (4:48).", ex:"He has no partner."},
     ru:{gram:"«сотоварищ, партнёр», модель فَعِيل.", pair:"Мн. ч.: شُرَكَاء. Корень ش ر ك: شِرْك (придание сотоварищей), مُشْرِك (многобожник).", tip:"Известно: لَا شَرِيكَ لَهُ (нет у Него сотоварища). Ширк — тягчайший грех (4:48).", ex:"Нет у Него сотоварища."} } },
  { id:"shuraka", ar:"شُرَكَاء", q:"شركاء|شركاءكم|شركاءهم|شركائي|شركائكم|شركائهم|شركاؤكم|شركاؤهم|شركاؤنا", ex:{ref:"6:22", ar:"أَيْنَ شُرَكَآؤُكُمُ ٱلَّذِينَ كُنتُمْ تَزْعُمُونَ"},
    m:{de:"Teilhaber (Pl.)", en:"partners, associates", ru:"сотоварищи"},
    info:{
     de:{gram:"Plural von شَرِيك: „Teilhaber“, meist die angeblichen Partner Allahs.", pair:"Singular: شَرِيك. Muster فُعَلَاء, wie شُهَدَاء.", tip:"Das Hamza wechselt seinen Träger je nach Fall: شُرَكَاؤُكُمْ, شُرَكَاءَهُمْ, شُرَكَائِي. Alle Formen sind mitgesucht.", ex:"Wo sind eure Teilhaber, die ihr behauptet habt?"},
     en:{gram:"Plural of شَرِيك: “partners”, mostly the alleged partners of Allah.", pair:"Singular: شَرِيك. Pattern فُعَلَاء, like شُهَدَاء.", tip:"The hamza changes its seat depending on the case: شُرَكَاؤُكُمْ, شُرَكَاءَهُمْ, شُرَكَائِي. All forms are included.", ex:"Where are your partners whom you used to claim?"},
     ru:{gram:"Мн. ч. от شَرِيك: «сотоварищи», обычно мнимые сотоварищи Аллаха.", pair:"Ед. ч.: شَرِيك. Модель فُعَلَاء, как شُهَدَاء.", tip:"Хамза меняет подставку по падежам: شُرَكَاؤُكُمْ, شُرَكَاءَهُمْ, شُرَكَائِي. Все формы включены.", ex:"Где же ваши сотоварищи, которых вы выдумывали?"} } },
  { id:"ghayb", ar:"غَيْب", q:"غيب", ex:{ref:"2:3", ar:"ٱلَّذِينَ يُؤْمِنُونَ بِٱلْغَيْبِ"},
    m:{de:"das Verborgene", en:"the unseen", ru:"сокровенное"},
    info:{
     de:{gram:"„das Verborgene, Unsichtbare“: was den Sinnen entzogen ist.", pair:"Gegenteil: شَهَادَة (das Sichtbare). Oft: عَالِمُ ٱلْغَيْبِ وَٱلشَّهَادَةِ.", tip:"Der Glaube an das Verborgene ist die erste Eigenschaft der Gottesfürchtigen (2:3).", ex:"die an das Verborgene glauben"},
     en:{gram:"“the unseen, the hidden”: what is beyond the senses.", pair:"Opposite: شَهَادَة (the witnessed). Often: عَالِمُ ٱلْغَيْبِ وَٱلشَّهَادَةِ.", tip:"Belief in the unseen is the first quality of the God-fearing (2:3).", ex:"who believe in the unseen"},
     ru:{gram:"«сокровенное, незримое»: то, что недоступно чувствам.", pair:"Противоположность: شَهَادَة (явное). Часто: عَالِمُ ٱلْغَيْبِ وَٱلشَّهَادَةِ.", tip:"Вера в сокровенное — первое качество богобоязненных (2:3).", ex:"которые веруют в сокровенное"} } },
  { id:"shahada", ar:"شَهَادَة", q:"شهادة|شهادتهم|شهادتنا", ex:{ref:"59:22", ar:"عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ"},
    m:{de:"das Sichtbare; Zeugnis", en:"the witnessed; testimony", ru:"явное; свидетельство"},
    info:{
     de:{gram:"„das Sichtbare, Offenbare“ und „Zeugnis, Zeugenaussage“.", pair:"Gegenteil: غَيْب (das Verborgene). Gleiche Wurzel: شَهِيد, شُهَدَاء.", tip:"In Rechtsversen heißt es „Zeugenaussage“: وَلَا تَكْتُمُوا ٱلشَّهَادَةَ (verbergt das Zeugnis nicht, 2:283).", ex:"der Kenner des Verborgenen und des Offenbaren"},
     en:{gram:"“the witnessed, the visible” and “testimony”.", pair:"Opposite: غَيْب (the unseen). Same root: شَهِيد, شُهَدَاء.", tip:"In legal verses it means “testimony”: وَلَا تَكْتُمُوا ٱلشَّهَادَةَ (do not conceal testimony, 2:283).", ex:"Knower of the unseen and the witnessed"},
     ru:{gram:"«явное, видимое» и «свидетельство».", pair:"Противоположность: غَيْب (сокровенное). Тот же корень: شَهِيد, شُهَدَاء.", tip:"В правовых аятах — «свидетельские показания»: وَلَا تَكْتُمُوا ٱلشَّهَادَةَ (не скрывайте свидетельства, 2:283).", ex:"Знающий сокровенное и явное"} } },
  { id:"arsh", ar:"عَرْش", q:"عرش|عرشه|عرشها", vstart:"عَرْش", art:true, ex:{ref:"9:129", ar:"وَهُوَ رَبُّ ٱلْعَرْشِ ٱلْعَظِيمِ"},
    m:{de:"Thron", en:"throne", ru:"трон"},
    info:{
     de:{gram:"„Thron“. Allahs Thron ist das größte Geschöpf.", pair:"Oft: ٱلرَّحْمَٰنُ عَلَى ٱلْعَرْشِ ٱسْتَوَىٰ (der Allerbarmer hat Sich über den Thron erhoben, 20:5). Ähnlich: كُرْسِيّ (Schemel, 2:255).", tip:"Auch der Thron der Königin von Saba heißt عَرْش (27:23).", ex:"und Er ist der Herr des gewaltigen Thrones"},
     en:{gram:"“throne”. Allah's Throne is the greatest creation.", pair:"Often: ٱلرَّحْمَٰنُ عَلَى ٱلْعَرْشِ ٱسْتَوَىٰ (the Most Compassionate rose over the Throne, 20:5). Similar: كُرْسِيّ (footstool, 2:255).", tip:"The throne of the Queen of Sheba is also called عَرْش (27:23).", ex:"and He is the Lord of the Great Throne"},
     ru:{gram:"«трон». Трон Аллаха — величайшее творение.", pair:"Часто: ٱلرَّحْمَٰنُ عَلَى ٱلْعَرْشِ ٱسْتَوَىٰ (Милостивый вознёсся на Трон, 20:5). Похоже: كُرْسِيّ (Престол, 2:255).", tip:"Трон царицы Сабы тоже назван عَرْش (27:23).", ex:"Он — Господь великого Трона"} } },
  { id:"kitab", ar:"كِتَاب (كُتُب)", q:"كتاب|كتابا|كتابه|كتابك|كتابهم|كتابي|كتابنا|كتب|كتبه", vstart:["كِتَاب","كُتُب"], art:true, ex:{ref:"2:285", ar:"كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ"},
    m:{de:"Buch, Schrift (Pl. كُتُب)", en:"book(s), scripture", ru:"книга, писание (мн. كُتُب)"},
    info:{
     de:{gram:"„Buch, Schrift“, auch „Vorschrift“. Plural: كُتُب.", pair:"Wurzel ك ت ب: كَتَبَ (schreiben, vorschreiben). أَهْلُ ٱلْكِتَابِ (die Leute der Schrift).", tip:"Das Verb كَتَبَ (er schrieb, schrieb vor) wird nicht mitgezählt, nur كِتَاب und كُتُب.", ex:"Alle glauben an Allah, Seine Engel, Seine Bücher und Seine Gesandten."},
     en:{gram:"“book, scripture”, also “decree”. Plural: كُتُب.", pair:"Root ك ت ب: كَتَبَ (to write, to prescribe). أَهْلُ ٱلْكِتَابِ (the People of the Book).", tip:"The verb كَتَبَ (he wrote, prescribed) is not counted, only كِتَاب and كُتُب.", ex:"All of them have believed in Allah and His angels and His books and His messengers."},
     ru:{gram:"«книга, писание», также «предписание». Мн. ч.: كُتُب.", pair:"Корень ك ت ب: كَتَبَ (писать, предписывать). أَهْلُ ٱلْكِتَابِ (люди Писания).", tip:"Глагол كَتَبَ (он написал, предписал) не учитывается, только كِتَاب и كُتُب.", ex:"Все они уверовали в Аллаха, Его ангелов, Его Писания и Его посланников."} } },
  { id:"kalima", ar:"كَلِمَة (كَلِمَات)", q:"كلمة|كلمت|كلمته|كلمات|كلماته|كلمتنا", vstart:"كَلِم", art:true, ex:{ref:"14:24", ar:"أَلَمْ تَرَ كَيْفَ ضَرَبَ ٱللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ"},
    m:{de:"Wort (Pl. كَلِمَات)", en:"word(s)", ru:"слово (мн. كَلِمَات)"},
    info:{

// ---------- Rubriken ----------
const SECTIONS = { fifty:{lists:LISTS, intro:"intro"}, s65:{lists:LISTS65, intro:"intro65"} };
for(const [sec,o] of Object.entries(SECTIONS)) o.lists.forEach(l=>{ l.sec = sec; l.key = sec==="fifty" ? l.id : sec+"-"+l.id; });
const ALL_LISTS = Object.values(SECTIONS).flatMap(o=>o.lists);
let curSec = "fifty";

const LEARN_KEY = "qws_learned";
let learned = new Set();
try{ learned = new Set(JSON.parse(localStorage.getItem(LEARN_KEY)||"[]")); }catch(e){}
function saveLearned(){ try{ localStorage.setItem(LEARN_KEY, JSON.stringify([...learned])); }catch(e){} }
function toggleLearned(id){ learned.has(id)?learned.delete(id):learned.add(id); saveLearned(); renderLists(); if(current) renderBack(); }

const countCache = {};
function wordCount(w){
  if(!AYAT.length || w.nosearch) return null;
  if(!countCache[w.id]){ const {res,fm}=findList(w); countCache[w.id]={ayat:res.length, occ:[...fm.values()].reduce((a,b)=>a+b,0)}; }
  return countCache[w.id];
}
const findWord = id => { for(const l of ALL_LISTS) for(const w of l.words) if(w.id===id) return {w,l}; };

function renderLists(){
  const box = document.getElementById("lists"); box.innerHTML="";
  document.getElementById("intro").textContent = t(SECTIONS[curSec].intro);
  SECTIONS[curSec].lists.forEach(l=>{
    const done = l.words.filter(w=>learned.has(w.id)).length;
    const c = document.createElement("div"); c.className="listcard";
    const best = getBest(l.key);
    c.innerHTML = `<div class="listhead"><div class="top"><div><h2>${t("list")(l.id)} · ${l.sub[lang]}</h2>
      <div class="sub">${t("learnedOf")(done, l.words.length)}</div>
      ${best!=null?`<div class="best">${t("best")(best)}</div>`:""}</div>
      <button class="quizbtn">${t("quiz")}</button></div>
      <div class="bar"><i style="width:${done/l.words.length*100}%"></i></div></div>`;
    c.querySelector(".quizbtn").onclick = ()=>startQuiz(l.key);
    l.words.forEach(w=>{
      const n = wordCount(w);
      const r = document.createElement("div"); r.className="row"+(learned.has(w.id)?" done":"");
      r.innerHTML = `<div class="chk" title="${t("learned")}">${learned.has(w.id)?"✓":""}</div>
        <div class="en"><b>${M(w)}</b></div>
        <div class="w">${w.ar}</div>
        <div class="cnt">${n?nf(n.occ)+"×":""}</div>
        <button class="info" title="Info">i</button>`;
      r.onclick = ()=> w.nosearch ? showInfo(w.id) : openWord(w.id);
      r.querySelector(".chk").onclick = e=>{ e.stopPropagation(); toggleLearned(w.id); };
      r.querySelector(".info").onclick = e=>{ e.stopPropagation(); showInfo(w.id); };
      c.appendChild(r);
    });
    box.appendChild(c);
  });
}

let current = null; // {w,l} wenn aus einer Liste geöffnet
function openWord(id, ref){
  if(!AYAT.length){ setStatus(t("stillLoading")); return; }
  current = findWord(id);
  setTab("search");
  document.querySelectorAll("#mode button").forEach(x=>x.classList.remove("on"));
  document.getElementById("q").value = current.w.ar;
  if(current.w.nosearch){
    const [s0,a0] = (ref||current.w.ex.ref).split(":").map(Number);
    const ay = AYAT.find(x=>x.s===s0 && x.a===a0);
    setResults(ay?[{ay,hits:[]}]:[], new Map());
  } else showList(current.w);
  renderBack();
  if(ref) jumpTo(ref); else window.scrollTo({top:0});
}
function renderBack(){
  const b = document.getElementById("backbar");
  if(!current){ b.classList.add("hidden"); return; }
  const {w,l} = current, isDone = learned.has(w.id);
  b.classList.remove("hidden");
  b.innerHTML = `<button id="bkBack">← ${t("list")(l.id)}</button><div class="w">${w.ar}</div>
    <button class="info" id="bkInfo">i</button>
    <button id="bkDone" class="${isDone?"done":""}">${isDone?t("learned"):t("learnedQ")}</button>`;
  b.querySelector("#bkBack").onclick = ()=>setTab(l.sec);
  b.querySelector("#bkInfo").onclick = ()=>showInfo(w.id);
  b.querySelector("#bkDone").onclick = ()=>toggleLearned(w.id);
}
function jumpTo(ref){
  const [s,a] = ref.split(":").map(Number);
  const vis = visible(), idx = vis.findIndex(r=>r.ay.s===s && r.ay.a===a);
  if(idx<0) return;
  while(shown<=idx) more();
  const el = document.getElementById("ay"+vis[idx].ay.n);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("playing"); setTimeout(()=>el.classList.remove("playing"),2200); }
}

function showInfo(id){
  const {w} = findWord(id), I = INF(w), n = wordCount(w), isDone = learned.has(id);
  const sh = document.getElementById("sheet"); sh.dataset.id = id;
  sh.innerHTML = `<div class="big">${w.ar}</div><h3 style="margin-bottom:12px">${M(w)}</h3>
    <dl>
      <dt>${t("iGram")}</dt><dd>${bidi(I.gram)}</dd>
      <dt>${t("iPair")}</dt><dd>${bidi(I.pair)}</dd>
      <dt>${t("iTip")}</dt><dd>${bidi(I.tip)}</dd>
      <dt>${t("iQuran")}</dt><dd>${n ? bidi(t("iCount")(nf(n.occ), nf(n.ayat))) : (w.nosearch ? t("iNoSearch") : t("iWait"))}</dd>
      <dt>${t("iEx")} · ${w.ex.ref}</dt><dd><span class="arx">${w.ex.ar}</span>${I.ex}</dd>
    </dl>
    <div class="actions">
      <button id="mDone" class="${isDone?"primary":""}">${isDone?t("learned"):t("markLearned")}</button>
      <button id="mEx">${t("openEx")}</button>
    </div>
    <div class="actions"><button id="mAll" class="primary ${w.nosearch?"hidden":""}">${t("showAll")}</button><button id="mClose">${t("close")}</button></div>`;
  sh.querySelector("#mDone").onclick = ()=>{ toggleLearned(id); showInfo(id); };
  sh.querySelector("#mEx").onclick = ()=>{ closeInfo(); openWord(id, w.ex.ref); };
  sh.querySelector("#mAll").onclick = ()=>{ closeInfo(); openWord(id); };
  sh.querySelector("#mClose").onclick = closeInfo;
  document.getElementById("modal").classList.remove("hidden");
}
function closeInfo(){ document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").onclick = e=>{ if(e.target.id==="modal") closeInfo(); };

function setTab(t){
  const isSec = !!SECTIONS[t];
  if(isSec) curSec = t;
  const hl = t==="quiz" ? (QZ ? QZ.list.sec : curSec) : t;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===hl));
  document.getElementById("viewFifty").classList.toggle("hidden", !isSec);
  document.getElementById("viewQuiz").classList.toggle("hidden", t!=="quiz");
  document.getElementById("viewSearch").classList.toggle("hidden", t!=="search");
  document.getElementById("searchBar").classList.toggle("hidden", t!=="search");
  if(isSec){ renderLists(); window.scrollTo({top:0}); }
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));

// ---------- Quiz ----------
const BEST_KEY = "qws_best";
function getBest(id){ try{ return JSON.parse(localStorage.getItem(BEST_KEY)||"{}")[id] ?? null; }catch(e){ return null; } }
function setBest(id, pct){ try{ const o=JSON.parse(localStorage.getItem(BEST_KEY)||"{}"); if(o[id]==null||pct>o[id]){ o[id]=pct; localStorage.setItem(BEST_KEY, JSON.stringify(o)); } }catch(e){} }
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const meaning = w => `<b>${M(w)}</b>`;
const dupKey = w => w.q || w.id;  // gleiche Schreibweise = gleiche Antwort (z. B. هذه)

let QZ = null; // {list, qs[], i, score, answers[]}

function buildQuestion(w, words){
  // Ablenker: andere Wörter mit anderer Schreibweise (هذه kommt 2× vor)
  // keine Ablenker mit gleicher Schreibweise oder gleicher Bedeutung
  const others = shuffle(words.filter(x=>dupKey(x)!==dupKey(w) && M(x)!==M(w)));
  const uniq = []; for(const o of others){ if(!uniq.some(u=>dupKey(u)===dupKey(o) || M(u)===M(o))) uniq.push(o); if(uniq.length===3) break; }
  const options = shuffle([w, ...uniq]);
  const types = ["ar2m","m2ar"]; if(AYAT.length && !w.combo) types.push("gap","gap");
  const type = pick(types);
  if(type==="gap"){
    const res = findList(w).res.filter(r=>r.hits.some(h=>h.len===1));
    if(res.length){
      const r = pick(res), h = pick(r.hits.filter(h=>h.len===1));
      return {type, w, options, ay:r.ay, hi:h.i};
    }
  }
  return {type: type==="gap" ? "ar2m" : type, w, options};
}

function startQuiz(listId, onlyWords){
  const l = ALL_LISTS.find(x=>x.key===listId);
  const pool = onlyWords || l.words;
  // 10 Fragen; nicht gelernte Wörter kommen öfter dran
  const target = onlyWords ? Math.min(10, Math.max(4, pool.length*2)) : 10;
  const weighted = pool.flatMap(w=>learned.has(w.id)?[w]:[w,w]);
  let seq = shuffle(pool);
  while(seq.length < target){ const w = pick(weighted); if(w!==seq[seq.length-1]) seq.push(w); }
  seq = seq.slice(0, target);
  QZ = { list:l, qs: seq.map(w=>buildQuestion(w, l.words)), i:0, score:0, answers:[] };
  setTab("quiz"); renderQuestion(); window.scrollTo({top:0});
}

function renderQuestion(){
  const box = document.getElementById("viewQuiz");
  const q = QZ.qs[QZ.i], n = QZ.qs.length;
  let prompt = "", label = "", arOpts = false;
  if(q.type==="ar2m"){ label=t("qAr2m"); prompt=`<div class="big">${q.w.ar}</div>`; }
  if(q.type==="m2ar"){ label=t("qM2ar"); prompt=`<div class="txt">${M(q.w)}</div>`; arOpts=true; }
  if(q.type==="gap"){
    label=t("qGap"); arOpts=true;
    const ws = q.ay.words.map((x,i)=> i===q.hi ? `<span class="gap" id="gap">؟</span>` : x).join(" ");
    prompt = `<div class="ayah">${ws}</div><div class="ref">${q.ay.sName} ${q.ay.s}:${q.ay.a}</div><div class="hint">${q.ay.tr}</div>`;
  }
  box.innerHTML = `<div class="qz">
    <div class="qtop"><span>${t("list")(QZ.list.id)} · ${t("qOf")(QZ.i+1, n)}</span><span>✓ ${QZ.score}</span></div>
    <div class="qbar"><i style="width:${QZ.i/n*100}%"></i></div>
    <div class="qtype">${label}</div>
    <div class="prompt">${prompt}</div>
    <div class="opts4">${q.options.map((o,k)=>`<button data-k="${k}" class="${arOpts?"arb":""}">${arOpts?o.ar:meaning(o)}</button>`).join("")}</div>
    <div class="qfb" id="qfb"></div>
    <div class="qfoot"><button id="qQuit">${t("quit")}</button>${q.type==="gap"?`<button id="qListen" class="hidden">▶ ${t("listen")}</button>`:""}<button id="qNext" class="primary hidden">${t("next")}</button></div>
  </div>`;
  box.querySelectorAll(".opts4 button").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  box.querySelector("#qQuit").onclick = ()=>{ stop(); setTab(QZ.list.sec); };
  box.querySelector("#qNext").onclick = next;
}

function answer(k){
  const q = QZ.qs[QZ.i], chosen = q.options[k], ok = dupKey(chosen)===dupKey(q.w);
  if(ok) QZ.score++;
  QZ.answers.push({w:q.w, ok});
  const box = document.getElementById("viewQuiz");
  box.querySelectorAll(".opts4 button").forEach((b,i)=>{
    b.disabled = true;
    if(dupKey(q.options[i])===dupKey(q.w)) b.classList.add("right");
    else if(i===k) b.classList.add("wrong");
  });
  const fb = box.querySelector("#qfb");
  fb.innerHTML = ok ? `<span style="color:#1d8f4e">${t("right")}</span>` : `<span style="color:#c62f3b">${t("wrong")}</span> ${t("correctIs")} <span style="font-family:Amiri,serif;font-size:20px">${q.w.ar}</span> = ${M(q.w)}`;
  if(q.type==="gap"){
    const g = box.querySelector("#gap"); g.textContent = q.ay.words[q.hi]; g.classList.add("ok");
    const l = box.querySelector("#qListen"); l.classList.remove("hidden");
    l.onclick = ()=>{ queue=[q.ay]; qi=0; playCur(); };
  }
  box.querySelector("#qNext").classList.remove("hidden");
  box.querySelector("#qNext").textContent = QZ.i+1<QZ.qs.length ? t("next") : t("result");
}

function next(){
  stop();
  QZ.i++;
  if(QZ.i < QZ.qs.length){ renderQuestion(); window.scrollTo({top:0}); } else showResult();
}

function showResult(){
  const n = QZ.qs.length, pct = Math.round(QZ.score/n*100);
  if(!QZ.retry) setBest(QZ.list.key, pct);
  // Pro Wort zusammenfassen
  const per = new Map();
  QZ.answers.forEach(a=>{ const e = per.get(a.w.id)||{w:a.w,ok:0,bad:0}; a.ok?e.ok++:e.bad++; per.set(a.w.id,e); });
  const wrong = [...per.values()].filter(e=>e.bad).map(e=>e.w);
  const msg = t("msg")[pct===100 ? 0 : pct>=80 ? 1 : pct>=50 ? 2 : 3];
  const box = document.getElementById("viewQuiz");
  box.innerHTML = `<div class="qz res">
    <div class="qtype">${t("list")(QZ.list.id)} · ${t("result")}</div>
    <div class="score">${QZ.score}/${n}</div><div>${msg}</div>
    <div class="wl">${[...per.values()].map(e=>`<div><span>${e.bad?"✗":"✓"}</span><span class="a">${e.w.ar}</span><span class="m">${M(e.w)}</span><span style="color:var(--muted);font-size:12px">${e.ok}/${e.ok+e.bad}</span></div>`).join("")}</div>
    <div class="qfoot">${wrong.length?`<button id="rWrong" class="primary">${t("practice")(wrong.length)}</button>`:""}<button id="rNew" class="${wrong.length?"":"primary"}">${t("newQuiz")}</button></div>
    <div class="qfoot"><button id="rBack">${t("toList")}</button></div>
  </div>`;
  if(wrong.length) box.querySelector("#rWrong").onclick = ()=>{ const id=QZ.list.key; startQuiz(id, wrong); QZ.retry=true; };
  box.querySelector("#rNew").onclick = ()=>startQuiz(QZ.list.key);
  box.querySelector("#rBack").onclick = ()=>setTab(QZ.list.sec);
}
renderLists();

// ---------- UI ----------
function setStatus(t){ document.getElementById("status").textContent=t; }
function userSearch(){
  if(current) document.querySelector(`#mode button[data-m="${mode}"]`).classList.add("on");
  current = null; renderBack();
  if(AYAT.length) search(document.getElementById("q").value);
}
document.getElementById("form").onsubmit = e=>{ e.preventDefault(); userSearch(); };
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#mode button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  mode=b.dataset.m; if(document.getElementById("q").value) userSearch();
});
async function refreshTrans(){
  if(!AYAT.length) return;
  setStatus(t("transLoading")); await loadTrans();
  if(current) showList(current.w); else { const q=document.getElementById("q").value; if(q && results.length) search(q); else setStatus(t("readyShort")); }
}
document.getElementById("trans").onchange = refreshTrans;

function fillTrans(){
  const sel = document.getElementById("trans");
  let saved = null; try{ saved = localStorage.getItem("qws_trans_"+lang); }catch(e){}
  sel.innerHTML = t("trans").map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  if(saved && t("trans").some(x=>x[0]===saved)) sel.value = saved;
}
document.getElementById("trans").addEventListener("change", e=>{ try{ localStorage.setItem("qws_trans_"+lang, e.target.value); }catch(_){} });

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("lang").value = lang;
  document.title = t("title") + " · al-Husary";
  document.querySelectorAll("[data-i]").forEach(el=>{
    if(el.id==="status" && AYAT.length) return;
    const v = t(el.dataset.i); if(typeof v==="string") el.textContent = v;
  });
  fillTrans();
  renderLists();
  if(current) renderBack();
  const sh = document.getElementById("sheet");
  if(!document.getElementById("modal").classList.contains("hidden") && sh.dataset.id) showInfo(sh.dataset.id);
  if(QZ && !document.getElementById("viewQuiz").classList.contains("hidden")){
    if(QZ.i >= QZ.qs.length) showResult();
    else if(QZ.answers.length===QZ.i) renderQuestion();
  }
}
document.getElementById("lang").onchange = async e=>{
  lang = e.target.value; try{ localStorage.setItem("qws_lang", lang); }catch(_){}
  applyLang();
  await refreshTrans();
};
applyLang();
document.querySelectorAll(".ex").forEach(x=>x.onclick=()=>{ document.getElementById("q").value=x.textContent; if(AYAT.length) search(x.textContent); });

load().catch(e=>setStatus(t("loadFail")+" ("+e.message+")"));
</script>
