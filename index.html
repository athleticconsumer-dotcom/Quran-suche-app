     ru:{gram:"«Могущественный, Непобедимый», модель فَعِيل. Очень часто в паре с حَكِيم: ٱلْعَزِيزُ ٱلْحَكِيمُ.", pair:"Корень ع ز ز: عِزَّة (могущество, честь).", tip:"Может описывать и людей, например ٱمْرَأَتُ ٱلْعَزِيزِ (жена правителя) в суре Юсуф. Поиск показывает все места.", ex:"Воистину, Ты — Могущественный, Мудрый."} } },
  { id:"hakim", ar:"حَكِيم", q:"حكيم|حكيما", ex:{ref:"2:32", ar:"إِنَّكَ أَنتَ ٱلْعَلِيمُ ٱلْحَكِيمُ"},
    m:{de:"der Allweise", en:"the All-Wise", ru:"Мудрый"},
    info:{
     de:{gram:"„der Allweise“, Muster فَعِيل: Er tut alles mit Weisheit und Vollkommenheit.", pair:"Wurzel ح ك م: حِكْمَة (Weisheit), حُكْم (Urteil).", tip:"Typische Paare am Versende: عَلِيمٌ حَكِيمٌ, عَزِيزٌ حَكِيمٌ. Auch der Quran wird حَكِيم genannt: وَٱلْقُرْآنِ ٱلْحَكِيمِ (36:2).", ex:"Du bist ja der Allwissende, der Allweise."},
     en:{gram:"“the All-Wise”, pattern فَعِيل: He does everything with wisdom and perfection.", pair:"Root ح ك م: حِكْمَة (wisdom), حُكْم (judgement).", tip:"Typical pairs at verse endings: عَلِيمٌ حَكِيمٌ, عَزِيزٌ حَكِيمٌ. The Quran itself is also called حَكِيم: وَٱلْقُرْآنِ ٱلْحَكِيمِ (36:2).", ex:"Indeed, You are the All-Knowing, the All-Wise."},
     ru:{gram:"«Мудрый», модель فَعِيل: Он всё вершит мудро и совершенно.", pair:"Корень ح ك م: حِكْمَة (мудрость), حُكْم (решение).", tip:"Типичные пары в конце аятов: عَلِيمٌ حَكِيمٌ, عَزِيزٌ حَكِيمٌ. Сам Коран тоже назван حَكِيم: وَٱلْقُرْآنِ ٱلْحَكِيمِ (36:2).", ex:"Воистину, Ты — Знающий, Мудрый."} } },
  { id:"ghafur", ar:"غَفُور", q:"غفور|غفورا", ex:{ref:"39:53", ar:"إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ"},
    m:{de:"der Allvergebende", en:"the Most Forgiving", ru:"Прощающий"},
    info:{
     de:{gram:"„der Allvergebende“, Muster فَعُول: Er vergibt viel und immer wieder.", pair:"Wurzel غ ف ر: مَغْفِرَة (Vergebung), ٱسْتَغْفِرُوا (bittet um Vergebung). Ähnlich: تَوَّاب.", tip:"Sehr häufig: غَفُورٌ رَحِيمٌ. Die Form غَفُورًا mit Alif ist mitgesucht.", ex:"Allah vergibt die Sünden alle. Er ist ja der Allvergebende, der Barmherzige."},
     en:{gram:"“the Most Forgiving”, pattern فَعُول: He forgives much and again and again.", pair:"Root غ ف ر: مَغْفِرَة (forgiveness), ٱسْتَغْفِرُوا (ask forgiveness). Similar: تَوَّاب.", tip:"Very common: غَفُورٌ رَحِيمٌ. The form غَفُورًا with alif is included.", ex:"Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful."},
     ru:{gram:"«Прощающий», модель فَعُول: Он прощает много и снова и снова.", pair:"Корень غ ف ر: مَغْفِرَة (прощение), ٱسْتَغْفِرُوا (просите прощения). Похоже: تَوَّاب.", tip:"Очень часто: غَفُورٌ رَحِيمٌ. Форма غَفُورًا с алифом включена.", ex:"Воистину, Аллах прощает все грехи, ибо Он — Прощающий, Милосердный."} } },
  { id:"halim", ar:"حَلِيم", q:"حليم|حليما", ex:{ref:"2:263", ar:"وَٱللَّهُ غَنِىٌّ حَلِيمٌ"},
    m:{de:"der Nachsichtige", en:"the Forbearing", ru:"Выдержанный"},
    info:{
     de:{gram:"„der Nachsichtige“: Er straft nicht sofort, sondern gibt Zeit.", pair:"Oft gepaart mit غَفُور oder غَنِيّ: غَفُورٌ حَلِيمٌ.", tip:"Beschreibt auch Ibrahim und Ismail: إِنَّ إِبْرَاهِيمَ لَحَلِيمٌ (11:75), بِغُلَامٍ حَلِيمٍ (37:101).", ex:"Und Allah ist unbedürftig und nachsichtig."},
     en:{gram:"“the Forbearing”: He does not punish at once but gives time.", pair:"Often paired with غَفُور or غَنِيّ: غَفُورٌ حَلِيمٌ.", tip:"It also describes Abraham and Ishmael: إِنَّ إِبْرَاهِيمَ لَحَلِيمٌ (11:75), بِغُلَامٍ حَلِيمٍ (37:101).", ex:"And Allah is Free of need and Forbearing."},
     ru:{gram:"«Выдержанный, Кроткий»: Он не наказывает сразу, а даёт время.", pair:"Часто в паре с غَفُور или غَنِيّ: غَفُورٌ حَلِيمٌ.", tip:"Так описаны и Ибрахим, и Исмаил: إِنَّ إِبْرَاهِيمَ لَحَلِيمٌ (11:75), بِغُلَامٍ حَلِيمٍ (37:101).", ex:"Аллах — Богатый, Выдержанный."} } },
  { id:"azim", ar:"عَظِيم", q:"عظيم|عظيما", ex:{ref:"2:255", ar:"وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ"},
    m:{de:"der Gewaltige, Großartige", en:"the Magnificent", ru:"Великий"},
    info:{
     de:{gram:"„gewaltig, großartig“. Als Name Allahs: ٱلْعَظِيم, der Gewaltige.", pair:"Ähnlich: كَبِير (groß). Oft gepaart: ٱلْعَلِيُّ ٱلْعَظِيمُ.", tip:"Beschreibt sehr oft auch Dinge: عَذَابٌ عَظِيمٌ (gewaltige Strafe), فَضْلٌ عَظِيمٌ. Die Suche zeigt alle Stellen.", ex:"Und Er ist der Erhabene, der Gewaltige."},
     en:{gram:"“great, magnificent”. As a name of Allah: ٱلْعَظِيم, the Magnificent.", pair:"Similar: كَبِير (great). Often paired: ٱلْعَلِيُّ ٱلْعَظِيمُ.", tip:"It very often describes things too: عَذَابٌ عَظِيمٌ (a great punishment), فَضْلٌ عَظِيمٌ. The search shows all places.", ex:"And He is the Most High, the Magnificent."},
     ru:{gram:"«великий, грандиозный». Как имя Аллаха: ٱلْعَظِيم, Великий.", pair:"Похоже: كَبِير (большой). Часто в паре: ٱلْعَلِيُّ ٱلْعَظِيمُ.", tip:"Очень часто описывает и предметы: عَذَابٌ عَظِيمٌ (великое наказание), فَضْلٌ عَظِيمٌ. Поиск показывает все места.", ex:"Он — Возвышенный, Великий."} } },
  { id:"aliyy", ar:"عَلِيّ", q:"علي|عليا", vstart:"عَلِيّ", art:true, ex:{ref:"22:62", ar:"وَأَنَّ ٱللَّهَ هُوَ ٱلْعَلِىُّ ٱلْكَبِيرُ"},
    m:{de:"der Erhabene, Hohe", en:"the Most High", ru:"Возвышенный"},
    info:{
     de:{gram:"„der Erhabene, der Hohe“: über allem, an Rang und Macht.", pair:"Wurzel ع ل و: أَعْلَىٰ (der Höchste), عُلُوّ (Höhe).", tip:"Nicht verwechseln mit عَلَىٰ (auf, Liste 5). Die App zeigt nur عَلِيّ mit Kasra und Schadda.", ex:"und dass Allah der Erhabene, der Große ist"},
     en:{gram:"“the Most High, the Exalted”: above everything in rank and power.", pair:"Root ع ل و: أَعْلَىٰ (the Most High), عُلُوّ (height).", tip:"Don't confuse it with عَلَىٰ (on, List 5). The app only shows عَلِيّ with a kasra and shadda.", ex:"and that Allah is the Most High, the Grand"},
     ru:{gram:"«Возвышенный, Высокий»: превыше всего по положению и власти.", pair:"Корень ع ل و: أَعْلَىٰ (Всевышний), عُلُوّ (высота).", tip:"Не путай с عَلَىٰ (на, список 5). Приложение показывает только عَلِيّ с кясрой и шаддой.", ex:"и что Аллах — Возвышенный, Большой"} } },
  { id:"alim", ar:"عَلِيم", q:"عليم|عليما", ex:{ref:"2:29", ar:"وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ"},
    m:{de:"der Allwissende", en:"the All-Knowing", ru:"Знающий"},
    info:{
     de:{gram:"„der Allwissende“, Muster فَعِيل: Er weiß alles, Verborgenes und Offenes.", pair:"Wurzel ع ل م: عِلْم (Wissen), عَالِم (Gelehrter), يَعْلَمُ (er weiß).", tip:"Einer der häufigsten Namen im Quran, oft: بِكُلِّ شَيْءٍ عَلِيمٌ (über alles Bescheid wissend). عَلِيمًا ist mitgesucht.", ex:"Und Er weiß über alles Bescheid."},
     en:{gram:"“the All-Knowing”, pattern فَعِيل: He knows everything, hidden and open.", pair:"Root ع ل م: عِلْم (knowledge), عَالِم (scholar), يَعْلَمُ (he knows).", tip:"One of the most frequent names in the Quran, often: بِكُلِّ شَيْءٍ عَلِيمٌ (Knowing of all things). عَلِيمًا is included.", ex:"And He is Knowing of all things."},
     ru:{gram:"«Знающий», модель فَعِيل: Он знает всё, тайное и явное.", pair:"Корень ع ل م: عِلْم (знание), عَالِم (учёный), يَعْلَمُ (он знает).", tip:"Одно из самых частых имён в Коране, часто: بِكُلِّ شَيْءٍ عَلِيمٌ (знающий о всякой вещи). عَلِيمًا включено.", ex:"Он ведает о всякой вещи."} } },
  { id:"khabir", ar:"خَبِير", q:"خبير|خبيرا", ex:{ref:"59:18", ar:"إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ"},
    m:{de:"der Kundige", en:"the All-Aware", ru:"Ведающий"},
    info:{
     de:{gram:"„der Kundige“: Er kennt auch das Innerste und die feinsten Einzelheiten.", pair:"Ähnlich: عَلِيم. Wurzel خ ب ر: خَبَر (Nachricht).", tip:"Typisch: إِنَّ ٱللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ (Allah ist kundig dessen, was ihr tut).", ex:"Allah ist ja kundig dessen, was ihr tut."},
     en:{gram:"“the All-Aware”: He knows even the innermost and the finest details.", pair:"Similar: عَلِيم. Root خ ب ر: خَبَر (news).", tip:"Typical: إِنَّ ٱللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ (Allah is aware of what you do).", ex:"Indeed, Allah is aware of what you do."},
     ru:{gram:"«Ведающий»: Он знает и самое сокровенное, и мельчайшие подробности.", pair:"Похоже: عَلِيم. Корень خ ب ر: خَبَر (весть).", tip:"Типично: إِنَّ ٱللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ (Аллах ведает о том, что вы совершаете).", ex:"Воистину, Аллах ведает о том, что вы совершаете."} } },
  { id:"sami", ar:"سَمِيع", q:"سميع|سميعا", ex:{ref:"2:127", ar:"إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ"},
    m:{de:"der Allhörende", en:"the All-Hearing", ru:"Слышащий"},
    info:{
     de:{gram:"„der Allhörende“: Er hört jedes Wort und jedes Bittgebet.", pair:"Fast immer gepaart: سَمِيعٌ عَلِيمٌ oder سَمِيعٌ بَصِيرٌ.", tip:"Wurzel س م ع: سَمِعَ (hören), سَمْع (Gehör).", ex:"Du bist ja der Allhörende, der Allwissende."},
     en:{gram:"“the All-Hearing”: He hears every word and every supplication.", pair:"Almost always paired: سَمِيعٌ عَلِيمٌ or سَمِيعٌ بَصِيرٌ.", tip:"Root س م ع: سَمِعَ (to hear), سَمْع (hearing).", ex:"Indeed, You are the All-Hearing, the All-Knowing."},
     ru:{gram:"«Слышащий»: Он слышит каждое слово и каждую мольбу.", pair:"Почти всегда в паре: سَمِيعٌ عَلِيمٌ или سَمِيعٌ بَصِيرٌ.", tip:"Корень س م ع: سَمِعَ (слышать), سَمْع (слух).", ex:"Воистину, Ты — Слышащий, Знающий."} } },
  { id:"basir", ar:"بَصِير", q:"بصير|بصيرا", ex:{ref:"42:11", ar:"وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ"},
    m:{de:"der Allsehende", en:"the All-Seeing", ru:"Видящий"},
    info:{
     de:{gram:"„der Allsehende“: Ihm entgeht nichts.", pair:"Oft gepaart mit سَمِيع: وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ.", tip:"Typisch: وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ (Allah sieht, was ihr tut). Wurzel ب ص ر: بَصَر (Sehkraft).", ex:"Und Er ist der Allhörende, der Allsehende."},
     en:{gram:"“the All-Seeing”: nothing escapes Him.", pair:"Often paired with سَمِيع: وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ.", tip:"Typical: وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ (Allah sees what you do). Root ب ص ر: بَصَر (sight).", ex:"And He is the All-Hearing, the All-Seeing."},
     ru:{gram:"«Видящий»: от Него ничто не скрыто.", pair:"Часто в паре с سَمِيع: وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ.", tip:"Типично: وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ (Аллах видит то, что вы совершаете). Корень ب ص ر: بَصَر (зрение).", ex:"Он — Слышащий, Видящий."} } },
  { id:"shakur", ar:"شَكُور", q:"شكور|شكورا", ex:{ref:"35:30", ar:"إِنَّهُۥ غَفُورٌ شَكُورٌ"},
    m:{de:"der Dankbare, Anerkennende", en:"the Appreciative", ru:"Благодарный"},
    info:{
     de:{gram:"„der Dankbare, der Anerkennende“, Muster فَعُول: Er belohnt auch kleine gute Taten reichlich.", pair:"Wurzel ش ك ر: شُكْر (Dank), شَاكِر (dankbar).", tip:"Beschreibt auch Menschen: عَبْدًا شَكُورًا (ein dankbarer Diener, über Nuh, 17:3). Typisch für Allah: غَفُورٌ شَكُورٌ.", ex:"Er ist ja allvergebend und stets zu Dank bereit."},
     en:{gram:"“the Appreciative, the Grateful”, pattern فَعُول: He rewards even small good deeds richly.", pair:"Root ش ك ر: شُكْر (thanks), شَاكِر (grateful).", tip:"It also describes people: عَبْدًا شَكُورًا (a grateful servant, about Noah, 17:3). Typical for Allah: غَفُورٌ شَكُورٌ.", ex:"Indeed, He is Forgiving and Appreciative."},
     ru:{gram:"«Благодарный, Ценящий», модель فَعُول: Он щедро вознаграждает даже за малые добрые дела.", pair:"Корень ش ك ر: شُكْر (благодарность), شَاكِر (благодарный).", tip:"Описывает и людей: عَبْدًا شَكُورًا (благодарный раб, о Нухе, 17:3). Типично для Аллаха: غَفُورٌ شَكُورٌ.", ex:"Воистину, Он — Прощающий, Благодарный."} } },
  { id:"qadir", ar:"قَدِير", q:"قدير|قديرا", ex:{ref:"2:20", ar:"إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ"},
    m:{de:"der zu allem Fähige", en:"the All-Powerful", ru:"Всемогущий"},
    info:{
     de:{gram:"„der zu allem Fähige“: Seine Macht hat keine Grenzen.", pair:"Wurzel ق د ر: قُدْرَة (Macht), قَدَر (Vorherbestimmung). Ähnlich: عَزِيز.", tip:"Fast immer in der Wendung عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (zu allem fähig).", ex:"Allah hat ja zu allem die Macht."},
     en:{gram:"“the All-Powerful”: His power has no limits.", pair:"Root ق د ر: قُدْرَة (power), قَدَر (divine decree). Similar: عَزِيز.", tip:"Almost always in the phrase عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (able to do all things).", ex:"Indeed, Allah has power over all things."},
     ru:{gram:"«Всемогущий»: Его могуществу нет предела.", pair:"Корень ق د ر: قُدْرَة (могущество), قَدَر (предопределение). Похоже: عَزِيز.", tip:"Почти всегда в обороте عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (способен на всякую вещь).", ex:"Воистину, Аллах способен на всякую вещь."} } },
  { id:"wakil", ar:"وَكِيل", q:"وكيل|وكيلا", ex:{ref:"3:173", ar:"حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ"},
    m:{de:"der Sachwalter, Beschützer", en:"the Guardian, Trustee", ru:"Попечитель"},
    info:{
     de:{gram:"„der Sachwalter, der Beschützer“: dem man seine Angelegenheiten anvertraut.", pair:"Wurzel و ك ل: تَوَكَّلَ (vertrauen), تَوَكُّل (Gottvertrauen).", tip:"Bekanntes Dhikr: حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ. Oft auch verneint: وَمَا أَنتَ عَلَيْهِمْ بِوَكِيلٍ (du bist nicht ihr Hüter).", ex:"Allah genügt uns, und welch vortrefflicher Sachwalter ist Er!"},
     en:{gram:"“the Guardian, the Trustee”: the one to whom you entrust your affairs.", pair:"Root و ك ل: تَوَكَّلَ (to rely on), تَوَكُّل (trust in Allah).", tip:"Well-known dhikr: حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ. Often negated too: وَمَا أَنتَ عَلَيْهِمْ بِوَكِيلٍ (you are not their guardian).", ex:"Sufficient for us is Allah, and He is the best Disposer of affairs."},
     ru:{gram:"«Попечитель, Хранитель»: Тот, кому вверяют свои дела.", pair:"Корень و ك ل: تَوَكَّلَ (уповать), تَوَكُّل (упование на Аллаха).", tip:"Известный зикр: حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ. Часто и с отрицанием: وَمَا أَنتَ عَلَيْهِمْ بِوَكِيلٍ (ты не их попечитель).", ex:"Нам достаточно Аллаха, и как прекрасен этот Попечитель!"} } },
  { id:"nasir", ar:"نَصِير", q:"نصير|نصيرا", ex:{ref:"8:40", ar:"نِعْمَ ٱلْمَوْلَىٰ وَنِعْمَ ٱلنَّصِيرُ"},
    m:{de:"der Helfer", en:"the Helper", ru:"Помощник"},
    info:{
     de:{gram:"„der Helfer“, Muster فَعِيل: Er verhilft zum Sieg.", pair:"Wurzel ن ص ر: نَصْر (Hilfe, Sieg), يَنصُرُ (er hilft). Oft mit وَلِيّ: وَلِيًّا وَنَصِيرًا.", tip:"Häufig verneint: مَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِيٍّ وَلَا نَصِيرٍ (ihr habt außer Allah weder Schutzherrn noch Helfer).", ex:"Welch vortrefflicher Schutzherr und welch vortrefflicher Helfer!"},
     en:{gram:"“the Helper”, pattern فَعِيل: He grants victory.", pair:"Root ن ص ر: نَصْر (help, victory), يَنصُرُ (he helps). Often with وَلِيّ: وَلِيًّا وَنَصِيرًا.", tip:"Often negated: مَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِيٍّ وَلَا نَصِيرٍ (you have no protector or helper besides Allah).", ex:"An excellent Protector and an excellent Helper!"},
     ru:{gram:"«Помощник», модель فَعِيل: Он дарует победу.", pair:"Корень ن ص ر: نَصْر (помощь, победа), يَنصُرُ (он помогает). Часто с وَلِيّ: وَلِيًّا وَنَصِيرًا.", tip:"Часто с отрицанием: مَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِيٍّ وَلَا نَصِيرٍ (нет у вас помимо Аллаха ни покровителя, ни помощника).", ex:"Как прекрасен этот Покровитель и как прекрасен этот Помощник!"} } },
  { id:"hamid", ar:"حَمِيد", q:"حميد|حميدا", ex:{ref:"2:267", ar:"وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ"},
    m:{de:"der Lobenswürdige", en:"the Praiseworthy", ru:"Достохвальный"},
    info:{
     de:{gram:"„der Lobenswürdige“: Er verdient alles Lob, ob man Ihn lobt oder nicht.", pair:"Wurzel ح م د: حَمْد (Lob), ٱلْحَمْدُ لِلَّهِ. Oft gepaart: غَنِيٌّ حَمِيدٌ.", tip:"Auch die Namen مُحَمَّد und أَحْمَد kommen von dieser Wurzel.", ex:"Und wisst, dass Allah unbedürftig und lobenswürdig ist."},
     en:{gram:"“the Praiseworthy”: He deserves all praise, whether people praise Him or not.", pair:"Root ح م د: حَمْد (praise), ٱلْحَمْدُ لِلَّهِ. Often paired: غَنِيٌّ حَمِيدٌ.", tip:"The names مُحَمَّد and أَحْمَد also come from this root.", ex:"And know that Allah is Free of need and Praiseworthy."},
     ru:{gram:"«Достохвальный»: Он достоин всякой хвалы, восхваляют Его или нет.", pair:"Корень ح م د: حَمْد (хвала), ٱلْحَمْدُ لِلَّهِ. Часто в паре: غَنِيٌّ حَمِيدٌ.", tip:"Имена مُحَمَّد и أَحْمَد тоже от этого корня.", ex:"Знайте, что Аллах — Богатый, Достохвальный."} } },
  { id:"tawwab", ar:"تَوَّاب", q:"تواب|توابا", ex:{ref:"2:37", ar:"إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ"},
    m:{de:"der die Reue Annehmende", en:"the Accepting of Repentance", ru:"Принимающий покаяние"},
    info:{
     de:{gram:"„der die Reue immer wieder annimmt“, Muster فَعَّال (Verstärkung): Er wendet Sich dem Reuigen immer wieder zu.", pair:"Wurzel ت و ب: تَوْبَة (Reue), تُوبُوا (bereut!). Ähnlich: غَفُور.", tip:"Fast immer gepaart: ٱلتَّوَّابُ ٱلرَّحِيمُ. Die Mehrzahl beschreibt auch Menschen: يُحِبُّ ٱلتَّوَّابِينَ (Er liebt die Reumütigen, 2:222).", ex:"Er ist ja der Reue-Annehmende, der Barmherzige."},
     en:{gram:"“the One who keeps accepting repentance”, pattern فَعَّال (intensive): He turns to the repentant again and again.", pair:"Root ت و ب: تَوْبَة (repentance), تُوبُوا (repent!). Similar: غَفُور.", tip:"Almost always paired: ٱلتَّوَّابُ ٱلرَّحِيمُ. The plural also describes people: يُحِبُّ ٱلتَّوَّابِينَ (He loves those who repent, 2:222).", ex:"Indeed, it is He who is the Accepting of repentance, the Merciful."},
     ru:{gram:"«Принимающий покаяние», модель فَعَّال (усиление): Он снова и снова обращается к кающимся.", pair:"Корень ت و ب: تَوْبَة (покаяние), تُوبُوا (кайтесь!). Похоже: غَفُور.", tip:"Почти всегда в паре: ٱلتَّوَّابُ ٱلرَّحِيمُ. Мн. ч. описывает и людей: يُحِبُّ ٱلتَّوَّابِينَ (Он любит кающихся, 2:222).", ex:"Воистину, Он — Принимающий покаяние, Милосердный."} } },
 ]},
 { id:2, sub:{de:"Adjektive und Steigerung", en:"Adjectives and comparatives", ru:"Прилагательные и степени сравнения"}, words:[
  { id:"awwal", ar:"أَوَّل", q:"أول|أولا|أولين|أولون", ex:{ref:"57:3", ar:"هُوَ ٱلْأَوَّلُ وَٱلْءَاخِرُ وَٱلظَّٰهِرُ وَٱلْبَاطِنُ"},
    m:{de:"erste(r)", en:"first", ru:"первый"},
    info:{
     de:{gram:"„erste(r)“. Als Name Allahs: ٱلْأَوَّل, der Erste ohne Anfang.", pair:"Gegenteil: آخِر (letzte). Feminin: أُولَىٰ, Plural: أَوَّلُونَ / أَوَّلِينَ (die Früheren).", tip:"Häufig: ٱلْأَوَّلِينَ (die früheren Generationen). Diese Form ist mitgesucht.", ex:"Er ist der Erste und der Letzte, der Offenbare und der Verborgene."},
     en:{gram:"“first”. As a name of Allah: ٱلْأَوَّل, the First without beginning.", pair:"Opposite: آخِر (last). Feminine: أُولَىٰ, plural: أَوَّلُونَ / أَوَّلِينَ (the former peoples).", tip:"Common: ٱلْأَوَّلِينَ (the earlier generations). This form is included.", ex:"He is the First and the Last, the Manifest and the Hidden."},
     ru:{gram:"«первый». Как имя Аллаха: ٱلْأَوَّل, Первый без начала.", pair:"Противоположность: آخِر (последний). Ж. р.: أُولَىٰ, мн. ч.: أَوَّلُونَ / أَوَّلِينَ (прежние народы).", tip:"Часто: ٱلْأَوَّلِينَ (прежние поколения). Эта форма включена.", ex:"Он — Первый и Последний, Явный и Скрытый."} } },
  { id:"akhir", ar:"آخِر", q:"آخر|آخرين|آخرون|آخره|آخرهم", vstart:"آخِر", art:true, ex:{ref:"10:10", ar:"وَءَاخِرُ دَعْوَىٰهُمْ أَنِ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ"},
    m:{de:"letzte(r)", en:"last", ru:"последний"},
    info:{
     de:{gram:"„letzte(r)“ (mit Kasra: āḫir). Als Name Allahs: ٱلْآخِر, der Letzte ohne Ende.", pair:"Gegenteil: أَوَّل. Nicht verwechseln mit آخَر (ein anderer) mit Fatha. Die App zeigt nur آخِر.", tip:"Gleiche Wurzel: ٱلْآخِرَة (das Jenseits) und ٱلْيَوْمِ ٱلْآخِرِ (der Jüngste Tag).", ex:"Und ihr letzter Ruf ist: Alles Lob gehört Allah, dem Herrn der Weltenbewohner."},
     en:{gram:"“last” (with kasra: āḫir). As a name of Allah: ٱلْآخِر, the Last without end.", pair:"Opposite: أَوَّل. Don't confuse it with آخَر (another) with a fatha; the app only shows آخِر.", tip:"Same root: ٱلْآخِرَة (the Hereafter) and ٱلْيَوْمِ ٱلْآخِرِ (the Last Day).", ex:"And the last of their call will be: Praise be to Allah, Lord of the worlds."},
     ru:{gram:"«последний» (с кясрой: āḫir). Как имя Аллаха: ٱلْآخِر, Последний без конца.", pair:"Противоположность: أَوَّل. Не путай с آخَر (другой) с фатхой, приложение показывает только آخِر.", tip:"Тот же корень: ٱلْآخِرَة (последняя жизнь) и ٱلْيَوْمِ ٱلْآخِرِ (Последний день).", ex:"А завершением их молитвы будут слова: «Хвала Аллаху, Господу миров!»"} } },
  { id:"qarib", ar:"قَرِيب", q:"قريب|قريبا", ex:{ref:"2:186", ar:"وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ"},
    m:{de:"nah", en:"near", ru:"близкий"},
    info:{
     de:{gram:"„nah“ (Ort, Zeit oder Beziehung), Muster فَعِيل.", pair:"Gegenteil: بَعِيد (fern). Steigerung: أَقْرَب (näher).", tip:"Tröstlich: فَإِنِّي قَرِيبٌ (Ich bin nahe, 2:186). Die Form قَرِيبًا ist mitgesucht.", ex:"Und wenn dich Meine Diener nach Mir fragen, so bin Ich nahe."},
     en:{gram:"“near” (in place, time or relation), pattern فَعِيل.", pair:"Opposite: بَعِيد (far). Comparative: أَقْرَب (nearer).", tip:"Comforting: فَإِنِّي قَرِيبٌ (I am near, 2:186). The form قَرِيبًا is included.", ex:"And when My servants ask you about Me, indeed I am near."},
     ru:{gram:"«близкий» (по месту, времени или отношению), модель فَعِيل.", pair:"Противоположность: بَعِيد (далёкий). Сравнительная степень: أَقْرَب (ближе).", tip:"Утешительно: فَإِنِّي قَرِيبٌ (Я близок, 2:186). Форма قَرِيبًا включена.", ex:"Если Мои рабы спросят тебя обо Мне, то ведь Я близок."} } },
  { id:"aqrab", ar:"أَقْرَب", q:"أقرب", ex:{ref:"50:16", ar:"وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ ٱلْوَرِيدِ"},
    m:{de:"näher", en:"nearer", ru:"ближе"},
    info:{
     de:{gram:"Steigerung von قَرِيب: „näher, am nächsten“. Muster أَفْعَل, die Form für „mehr …“ und „am meisten …“.", pair:"Grundform: قَرِيب. Gleiches Muster: أَكْبَر, أَكْثَر, أَحْسَن.", tip:"Merke das Muster: aus فَعِيل wird أَفْعَل (قَرِيب → أَقْرَب, كَبِير → أَكْبَر). ٱلْأَقْرَبُونَ (die nächsten Verwandten) wird hier nicht mitgezählt.", ex:"und Wir sind ihm näher als seine Halsschlagader"},
     en:{gram:"Comparative of قَرِيب: “nearer, nearest”. Pattern أَفْعَل, the form for “more …” and “most …”.", pair:"Base form: قَرِيب. Same pattern: أَكْبَر, أَكْثَر, أَحْسَن.", tip:"Remember the pattern: فَعِيل becomes أَفْعَل (قَرِيب → أَقْرَب, كَبِير → أَكْبَر). ٱلْأَقْرَبُونَ (the closest relatives) is not counted here.", ex:"and We are closer to him than his jugular vein"},
     ru:{gram:"Сравнительная степень от قَرِيب: «ближе, ближайший». Модель أَفْعَل — форма для «более …» и «самый …».", pair:"Основная форма: قَرِيب. Та же модель: أَكْبَر, أَكْثَر, أَحْسَن.", tip:"Запомни модель: из فَعِيل получается أَفْعَل (قَرِيب → أَقْرَب, كَبِير → أَكْبَر). ٱلْأَقْرَبُونَ (ближайшие родственники) здесь не учитывается.", ex:"Мы ближе к нему, чем его яремная вена"} } },
  { id:"baid", ar:"بَعِيد", q:"بعيد|بعيدا", ex:{ref:"4:116", ar:"فَقَدْ ضَلَّ ضَلَٰلًۢا بَعِيدًا"},
    m:{de:"fern, weit", en:"far", ru:"далёкий"},
    info:{
     de:{gram:"„fern, weit“, Muster فَعِيل.", pair:"Gegenteil: قَرِيب (nah).", tip:"Häufig: ضَلَالًا بَعِيدًا (weit in die Irre). بَعِيدًا ist mitgesucht. Nicht verwechseln mit بَعْد (nach, 50 % Liste 6).", ex:"der ist fürwahr weit abgeirrt"},
     en:{gram:"“far, distant”, pattern فَعِيل.", pair:"Opposite: قَرِيب (near).", tip:"Common: ضَلَالًا بَعِيدًا (far astray). بَعِيدًا is included. Don't confuse it with بَعْد (after, 50% List 6).", ex:"has certainly gone far astray"},
     ru:{gram:"«далёкий», модель فَعِيل.", pair:"Противоположность: قَرِيب (близкий).", tip:"Часто: ضَلَالًا بَعِيدًا (далёкое заблуждение). بَعِيدًا включено. Не путай с بَعْد (после, 50 %, список 6).", ex:"тот впал в глубокое заблуждение"} } },
  { id:"shadid", ar:"شَدِيد", q:"شديد|شديدا", ex:{ref:"2:196", ar:"وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ"},
    m:{de:"heftig, streng", en:"severe, strong", ru:"сильный, суровый"},
    info:{
     de:{gram:"„heftig, streng, stark“, Muster فَعِيل.", pair:"Steigerung: أَشَدّ (heftiger, stärker).", tip:"Sehr häufig über Strafe: عَذَابٌ شَدِيدٌ, شَدِيدُ ٱلْعِقَابِ (streng im Bestrafen).", ex:"und wisst, dass Allah streng im Bestrafen ist"},
     en:{gram:"“severe, intense, strong”, pattern فَعِيل.", pair:"Comparative: أَشَدّ (more severe, stronger).", tip:"Very often about punishment: عَذَابٌ شَدِيدٌ, شَدِيدُ ٱلْعِقَابِ (severe in penalty).", ex:"and know that Allah is severe in penalty"},
     ru:{gram:"«сильный, суровый, тяжкий», модель فَعِيل.", pair:"Сравнительная степень: أَشَدّ (сильнее, суровее).", tip:"Очень часто о наказании: عَذَابٌ شَدِيدٌ, شَدِيدُ ٱلْعِقَابِ (суров в наказании).", ex:"и знайте, что Аллах суров в наказании"} } },
  { id:"ashadd", ar:"أَشَدّ", q:"أشد", ex:{ref:"2:165", ar:"وَٱلَّذِينَ ءَامَنُوٓا۟ أَشَدُّ حُبًّا لِّلَّهِ"},
    m:{de:"heftiger, stärker", en:"more severe, stronger", ru:"сильнее, суровее"},
    info:{
     de:{gram:"Steigerung von شَدِيد: „heftiger, stärker“. Muster أَفْعَل, die zwei د verschmelzen: أَشَدّ.", pair:"Grundform: شَدِيد.", tip:"Oft mit einem Nomen danach: أَشَدُّ حُبًّا (stärker an Liebe), أَشَدُّ قُوَّةً (stärker an Kraft). Nicht verwechseln mit أَشُدَّهُ (seine volle Reife).", ex:"Doch die Gläubigen lieben Allah noch stärker."},
     en:{gram:"Comparative of شَدِيد: “more severe, stronger”. Pattern أَفْعَل; the two د merge: أَشَدّ.", pair:"Base form: شَدِيد.", tip:"Often followed by a noun: أَشَدُّ حُبًّا (stronger in love), أَشَدُّ قُوَّةً (greater in strength). Don't confuse it with أَشُدَّهُ (his full maturity).", ex:"But those who believe are stronger in love for Allah."},
     ru:{gram:"Сравнительная степень от شَدِيد: «сильнее, суровее». Модель أَفْعَل, две د сливаются: أَشَدّ.", pair:"Основная форма: شَدِيد.", tip:"Часто с именем после: أَشَدُّ حُبًّا (сильнее в любви), أَشَدُّ قُوَّةً (сильнее мощью). Не путай с أَشُدَّهُ (его зрелость).", ex:"Но верующие любят Аллаха сильнее."} } },
  { id:"akbar", ar:"أَكْبَر", q:"أكبر", ex:{ref:"29:45", ar:"وَلَذِكْرُ ٱللَّهِ أَكْبَرُ"},
    m:{de:"größer", en:"bigger, greater", ru:"больше, величайший"},
    info:{
     de:{gram:"Steigerung von كَبِير: „größer, am größten“.", pair:"Grundform: كَبِير. Gegenteil: أَصْغَر (kleiner).", tip:"Bekannt aus dem Gebetsruf: ٱللَّهُ أَكْبَرُ (Allah ist größer als alles). Im Quran z. B. وَلَذِكْرُ ٱللَّهِ أَكْبَرُ.", ex:"und das Gedenken Allahs ist gewiss größer"},
     en:{gram:"Comparative of كَبِير: “greater, greatest”.", pair:"Base form: كَبِير. Opposite: أَصْغَر (smaller).", tip:"Known from the call to prayer: ٱللَّهُ أَكْبَرُ (Allah is greater than everything). In the Quran e.g. وَلَذِكْرُ ٱللَّهِ أَكْبَرُ.", ex:"and the remembrance of Allah is greater"},
     ru:{gram:"Сравнительная степень от كَبِير: «больше, величайший».", pair:"Основная форма: كَبِير. Противоположность: أَصْغَر (меньше).", tip:"Знакомо по азану: ٱللَّهُ أَكْبَرُ (Аллах превыше всего). В Коране, напр., وَلَذِكْرُ ٱللَّهِ أَكْبَرُ.", ex:"но поминание Аллаха — важнее"} } },
  { id:"kabir", ar:"كَبِير", q:"كبير|كبيرا", ex:{ref:"13:9", ar:"عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ٱلْكَبِيرُ ٱلْمُتَعَالِ"},
    m:{de:"groß", en:"big, great", ru:"большой, великий"},
    info:{
     de:{gram:"„groß, bedeutend“, Muster فَعِيل. Auch „alt“ (an Jahren).", pair:"Steigerung: أَكْبَر. Gegenteil: صَغِير (klein).", tip:"Als Name Allahs: ٱلْكَبِير, der Große. Auch كَبَائِر (große Sünden) hat dieselbe Wurzel.", ex:"der Kenner des Verborgenen und des Offenbaren, der Große, der Hocherhabene"},
     en:{gram:"“big, great, important”, pattern فَعِيل. Also “old” (in years).", pair:"Comparative: أَكْبَر. Opposite: صَغِير (small).", tip:"As a name of Allah: ٱلْكَبِير, the Great. Major sins, كَبَائِر, come from the same root.", ex:"Knower of the unseen and the witnessed, the Great, the Most Exalted"},
     ru:{gram:"«большой, великий», модель فَعِيل. Также «старый» (по возрасту).", pair:"Сравнительная степень: أَكْبَر. Противоположность: صَغِير (маленький).", tip:"Как имя Аллаха: ٱلْكَبِير, Большой. Тяжкие грехи, كَبَائِر, — того же корня.", ex:"Знающий сокровенное и явное, Большой, Превознесённый"} } },
  { id:"kathir", ar:"كَثِير", q:"كثير|كثيرا", ex:{ref:"33:41", ar:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱذْكُرُوا۟ ٱللَّهَ ذِكْرًا كَثِيرًا"},
    m:{de:"viel", en:"much, many", ru:"много"},
    info:{
     de:{gram:"„viel, zahlreich“, Muster فَعِيل.", pair:"Gegenteil: قَلِيل (wenig). Steigerung: أَكْثَر (mehr).", tip:"Oft als Adverb mit Alif: ذِكْرًا كَثِيرًا (viel gedenken). كَثِيرًا ist mitgesucht.", ex:"O ihr, die ihr glaubt, gedenkt Allahs in häufigem Gedenken."},
     en:{gram:"“much, many, plentiful”, pattern فَعِيل.", pair:"Opposite: قَلِيل (little). Comparative: أَكْثَر (more).", tip:"Often as an adverb with alif: ذِكْرًا كَثِيرًا (much remembrance). كَثِيرًا is included.", ex:"O you who believe, remember Allah with much remembrance."},
     ru:{gram:"«много, многочисленный», модель فَعِيل.", pair:"Противоположность: قَلِيل (мало). Сравнительная степень: أَكْثَر (больше).", tip:"Часто как наречие с алифом: ذِكْرًا كَثِيرًا (частое поминание). كَثِيرًا включено.", ex:"О те, которые уверовали! Поминайте Аллаха частым поминанием."} } },
  { id:"akthar", ar:"أَكْثَر", q:"أكثر|أكثرهم|أكثركم|أكثرهن", ex:{ref:"12:21", ar:"وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ"},
    m:{de:"mehr, die meisten", en:"more, most", ru:"больше, большинство"},
    info:{
     de:{gram:"Steigerung von كَثِير: „mehr, die meisten“.", pair:"Grundform: كَثِير. Gegenteil: أَقَلّ (weniger).", tip:"Sehr häufig: أَكْثَرُهُمْ (die meisten von ihnen) und أَكْثَرَ ٱلنَّاسِ (die meisten Menschen). Die Formen mit Endung sind mitgesucht.", ex:"aber die meisten Menschen wissen nicht"},
     en:{gram:"Comparative of كَثِير: “more, most”.", pair:"Base form: كَثِير. Opposite: أَقَلّ (less).", tip:"Very common: أَكْثَرُهُمْ (most of them) and أَكْثَرَ ٱلنَّاسِ (most people). Forms with endings are included.", ex:"but most of the people do not know"},
     ru:{gram:"Сравнительная степень от كَثِير: «больше, большинство».", pair:"Основная форма: كَثِير. Противоположность: أَقَلّ (меньше).", tip:"Очень часто: أَكْثَرُهُمْ (большинство из них) и أَكْثَرَ ٱلنَّاسِ (большинство людей). Формы с окончаниями включены.", ex:"но большинство людей не знает"} } },
  { id:"sari", ar:"سَرِيع", q:"سريع", ex:{ref:"2:202", ar:"وَٱللَّهُ سَرِيعُ ٱلْحِسَابِ"},
    m:{de:"schnell", en:"quick, swift", ru:"быстрый"},
    info:{
     de:{gram:"„schnell“, Muster فَعِيل.", pair:"Steigerung: أَسْرَع (schneller).", tip:"Typisch: سَرِيعُ ٱلْحِسَابِ (schnell im Abrechnen) und سَرِيعُ ٱلْعِقَابِ (schnell im Bestrafen).", ex:"und Allah ist schnell im Abrechnen"},
     en:{gram:"“quick, swift”, pattern فَعِيل.", pair:"Comparative: أَسْرَع (quicker).", tip:"Typical: سَرِيعُ ٱلْحِسَابِ (swift in account) and سَرِيعُ ٱلْعِقَابِ (swift in penalty).", ex:"and Allah is swift in account"},
     ru:{gram:"«быстрый, скорый», модель فَعِيل.", pair:"Сравнительная степень: أَسْرَع (быстрее).", tip:"Типично: سَرِيعُ ٱلْحِسَابِ (скор в расчёте) и سَرِيعُ ٱلْعِقَابِ (скор в наказании).", ex:"Аллах скор в расчёте"} } },
  { id:"asra", ar:"أَسْرَع", q:"أسرع", ex:{ref:"6:62", ar:"أَلَا لَهُ ٱلْحُكْمُ وَهُوَ أَسْرَعُ ٱلْحَٰسِبِينَ"},
    m:{de:"schneller", en:"quicker", ru:"быстрее"},
    info:{
     de:{gram:"Steigerung von سَرِيع: „schneller, am schnellsten“.", pair:"Grundform: سَرِيع.", tip:"Selten im Quran, aber das Muster أَفْعَل ist dasselbe wie bei أَكْبَر und أَقْرَب: وَهُوَ أَسْرَعُ ٱلْحَاسِبِينَ.", ex:"Wahrlich, Ihm gehört das Urteil, und Er ist der Schnellste der Abrechnenden."},
     en:{gram:"Comparative of سَرِيع: “quicker, quickest”.", pair:"Base form: سَرِيع.", tip:"Rare in the Quran, but the pattern أَفْعَل is the same as in أَكْبَر and أَقْرَب: وَهُوَ أَسْرَعُ ٱلْحَاسِبِينَ.", ex:"Unquestionably, His is the judgement, and He is the swiftest of accountants."},
     ru:{gram:"Сравнительная степень от سَرِيع: «быстрее, самый быстрый».", pair:"Основная форма: سَرِيع.", tip:"В Коране редко, но модель أَفْعَل та же, что у أَكْبَر и أَقْرَب: وَهُوَ أَسْرَعُ ٱلْحَاسِبِينَ.", ex:"Воистину, Ему принадлежит решение, и Он — самый быстрый из счетоводов."} } },
  { id:"qalil", ar:"قَلِيل", q:"قليل|قليلا", ex:{ref:"7:3", ar:"قَلِيلًا مَّا تَذَكَّرُونَ"},
    m:{de:"wenig", en:"little, few", ru:"мало, немного"},
    info:{
     de:{gram:"„wenig, gering, wenige“, Muster فَعِيل.", pair:"Gegenteil: كَثِير (viel).", tip:"Typisch: قَلِيلًا مَّا تَشْكُرُونَ (wie wenig ihr dankt!). قَلِيلًا ist mitgesucht.", ex:"Wie wenig ihr bedenkt!"},
     en:{gram:"“little, few, small”, pattern فَعِيل.", pair:"Opposite: كَثِير (much).", tip:"Typical: قَلِيلًا مَّا تَشْكُرُونَ (little do you give thanks!). قَلِيلًا is included.", ex:"Little do you remember."},
     ru:{gram:"«мало, немногие, незначительный», модель فَعِيل.", pair:"Противоположность: كَثِير (много).", tip:"Типично: قَلِيلًا مَّا تَشْكُرُونَ (как мало вы благодарны!). قَلِيلًا включено.", ex:"Как же мало вы поминаете назидание!"} } },
  { id:"karim", ar:"كَرِيم", q:"كريم|كريما", ex:{ref:"82:6", ar:"يَٰٓأَيُّهَا ٱلْإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ"},
    m:{de:"edel, großzügig", en:"noble, generous", ru:"благородный, щедрый"},
    info:{
     de:{gram:"„edel, großzügig, ehrenvoll“, Muster فَعِيل.", pair:"Wurzel ك ر م: كَرَّمْنَا (Wir haben geehrt), أَكْرَم (der Edelste).", tip:"Beschreibt Allah (رَبِّكَ ٱلْكَرِيمِ), den Quran (قُرْآنٌ كَرِيمٌ) und auch Dinge wie رِزْقٌ كَرِيمٌ (edle Versorgung).", ex:"O Mensch, was hat dich gegen deinen edelmütigen Herrn betört?"},
     en:{gram:"“noble, generous, honourable”, pattern فَعِيل.", pair:"Root ك ر م: كَرَّمْنَا (We have honoured), أَكْرَم (most noble).", tip:"It describes Allah (رَبِّكَ ٱلْكَرِيمِ), the Quran (قُرْآنٌ كَرِيمٌ) and also things like رِزْقٌ كَرِيمٌ (noble provision).", ex:"O mankind, what has deceived you about your Lord, the Generous?"},
     ru:{gram:"«благородный, щедрый, почётный», модель فَعِيل.", pair:"Корень ك ر م: كَرَّمْنَا (Мы почтили), أَكْرَم (благороднейший).", tip:"Описывает Аллаха (رَبِّكَ ٱلْكَرِيمِ), Коран (قُرْآنٌ كَرِيمٌ) и вещи вроде رِزْقٌ كَرِيمٌ (щедрый удел).", ex:"О человек! Что обольстило тебя в отношении твоего Щедрого Господа?"} } },
  { id:"hafiz", ar:"حَفِيظ", q:"حفيظ|حفيظا", ex:{ref:"11:57", ar:"إِنَّ رَبِّى عَلَىٰ كُلِّ شَىْءٍ حَفِيظٌ"},
    m:{de:"Hüter, bewahrend", en:"guardian, preserver", ru:"хранитель"},
    info:{
     de:{gram:"„Hüter, bewahrend“, Muster فَعِيل.", pair:"Wurzel ح ف ظ: حِفْظ (Bewahren, Auswendiglernen), حَافِظ (Hüter, Hafiz).", tip:"Als Name Allahs: إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ. Von derselben Wurzel kommt حَافِظ, so nennt man jemanden, der den Quran auswendig kann.", ex:"Mein Herr ist ja Hüter über alle Dinge."},
     en:{gram:"“guardian, preserving”, pattern فَعِيل.", pair:"Root ح ف ظ: حِفْظ (preserving, memorising), حَافِظ (guardian, hafiz).", tip:"As a name of Allah: إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ. The word حَافِظ, used for someone who knows the Quran by heart, comes from the same root.", ex:"Indeed, my Lord is Guardian over all things."},
     ru:{gram:"«хранитель, оберегающий», модель فَعِيل.", pair:"Корень ح ف ظ: حِفْظ (сохранение, заучивание), حَافِظ (хранитель, хафиз).", tip:"Как имя Аллаха: إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ. От того же корня — حَافِظ, так называют знающего Коран наизусть.", ex:"Воистину, мой Господь оберегает всякую вещь."} } },
  { id:"ahsan", ar:"أَحْسَن", q:"أحسن", vstart:"أَحْسَن", ex:{ref:"95:4", ar:"لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍ"},
    m:{de:"besser, am schönsten", en:"better, best", ru:"лучше, наилучший"},
    info:{
     de:{gram:"„besser, am schönsten“. Muster أَفْعَل von حَسَن (gut, schön).", pair:"Grundform: حَسَن. Gegenteil: أَسْوَأ (schlechter).", tip:"Bekannt: فِي أَحْسَنِ تَقْوِيمٍ (in schönster Gestalt) und أَحْسَنَ ٱلْقَصَصِ (die schönste Erzählung). Gleich geschrieben ist das Verb أَحْسَنَ (er tat Gutes), die Suche zeigt beide.", ex:"Wir haben den Menschen ja in schönster Gestalt erschaffen."},
     en:{gram:"“better, best, most beautiful”. Pattern أَفْعَل from حَسَن (good, beautiful).", pair:"Base form: حَسَن. Opposite: أَسْوَأ (worse).", tip:"Well known: فِي أَحْسَنِ تَقْوِيمٍ (in the best form) and أَحْسَنَ ٱلْقَصَصِ (the best of stories). The verb أَحْسَنَ (he did good) is written the same; the search shows both.", ex:"We have certainly created man in the best of forms."},
     ru:{gram:"«лучше, наилучший, прекраснейший». Модель أَفْعَل от حَسَن (хороший, красивый).", pair:"Основная форма: حَسَن. Противоположность: أَسْوَأ (хуже).", tip:"Известно: فِي أَحْسَنِ تَقْوِيمٍ (в наилучшем облике) и أَحْسَنَ ٱلْقَصَصِ (лучший из рассказов). Так же пишется глагол أَحْسَنَ (он сделал добро), поиск показывает оба.", ex:"Мы сотворили человека в наилучшем облике."} } },
  { id:"azlam", ar:"أَظْلَم", q:"أظلم", ex:{ref:"2:114", ar:"وَمَنْ أَظْلَمُ مِمَّن مَّنَعَ مَسَٰجِدَ ٱللَّهِ أَن يُذْكَرَ فِيهَا ٱسْمُهُۥ"},
    m:{de:"ungerechter", en:"more unjust", ru:"несправедливее"},
    info:{
     de:{gram:"„ungerechter, am ungerechtesten“. Muster أَفْعَل von ظَالِم (ungerecht).", pair:"Wurzel ظ ل م: ظُلْم (Unrecht), ظَالِمُونَ (die Ungerechten).", tip:"Fast immer als rhetorische Frage: وَمَنْ أَظْلَمُ مِمَّنِ … (und wer ist ungerechter als der, der …?). Das Verb أَظْلَمَ (es wurde dunkel) wird gleich geschrieben.", ex:"Und wer ist ungerechter als derjenige, der verhindert, dass in Allahs Gebetsstätten Sein Name genannt wird?"},
     en:{gram:"“more unjust, most unjust”. Pattern أَفْعَل from ظَالِم (unjust).", pair:"Root ظ ل م: ظُلْم (injustice), ظَالِمُونَ (wrongdoers).", tip:"Almost always a rhetorical question: وَمَنْ أَظْلَمُ مِمَّنِ … (and who is more unjust than one who …?). The verb أَظْلَمَ (it grew dark) is written the same.", ex:"And who is more unjust than one who prevents the name of Allah from being mentioned in His mosques?"},
     ru:{gram:"«несправедливее, самый несправедливый». Модель أَفْعَل от ظَالِم (несправедливый).", pair:"Корень ظ ل م: ظُلْم (несправедливость), ظَالِمُونَ (беззаконники).", tip:"Почти всегда риторический вопрос: وَمَنْ أَظْلَمُ مِمَّنِ … (кто несправедливее того, кто …?). Так же пишется глагол أَظْلَمَ (стемнело).", ex:"Кто может быть несправедливее того, кто препятствует поминать имя Аллаха в Его мечетях?"} } },
  { id:"ahaqq", ar:"أَحَقّ", q:"أحق", ex:{ref:"9:13", ar:"فَٱللَّهُ أَحَقُّ أَن تَخْشَوْهُ إِن كُنتُم مُّؤْمِنِينَ"},
    m:{de:"mehr berechtigt, würdiger", en:"more worthy", ru:"более достойный"},
    info:{
     de:{gram:"„mehr berechtigt, würdiger“. Muster أَفْعَل von حَقّ (Recht, Wahrheit).", pair:"Wurzel ح ق ق: حَقّ (Wahrheit, Recht), حَقًّا (wahrhaftig).", tip:"Typisch: فَٱللَّهُ أَحَقُّ أَن تَخْشَوْهُ (Allah hat mehr Anrecht darauf, dass ihr Ihn fürchtet).", ex:"Allah hat mehr Anrecht darauf, dass ihr Ihn fürchtet, wenn ihr gläubig seid."},
     en:{gram:"“more worthy, more entitled”. Pattern أَفْعَل from حَقّ (right, truth).", pair:"Root ح ق ق: حَقّ (truth, right), حَقًّا (truly).", tip:"Typical: فَٱللَّهُ أَحَقُّ أَن تَخْشَوْهُ (Allah has more right that you should fear Him).", ex:"Allah has more right that you should fear Him, if you are believers."},
     ru:{gram:"«более достойный, имеющий больше права». Модель أَفْعَل от حَقّ (истина, право).", pair:"Корень ح ق ق: حَقّ (истина, право), حَقًّا (воистину).", tip:"Типично: فَٱللَّهُ أَحَقُّ أَن تَخْشَوْهُ (Аллах более достоин того, чтобы вы Его боялись).", ex:"Аллах более достоин того, чтобы вы боялись Его, если вы верующие."} } },
  { id:"adna", ar:"أَدْنَىٰ", q:"أدنى", ex:{ref:"32:21", ar:"وَلَنُذِيقَنَّهُم مِّنَ ٱلْعَذَابِ ٱلْأَدْنَىٰ دُونَ ٱلْعَذَابِ ٱلْأَكْبَرِ"},
    m:{de:"näher, niedriger; eher", en:"nearer, lower; more likely", ru:"ближе, ниже; вероятнее"},
    info:{
     de:{gram:"„näher, niedriger, geringer“, auch „eher, besser geeignet“. Muster أَفْعَل.", pair:"Wurzel د ن و: دُنْيَا (das diesseitige Leben, wörtl. das Nähere). Gegenteil: أَكْبَر / أَعْلَىٰ.", tip:"Typisch: ٱلْعَذَابِ ٱلْأَدْنَىٰ دُونَ ٱلْعَذَابِ ٱلْأَكْبَرِ (die nähere Strafe vor der größeren). Auch: ذَٰلِكَ أَدْنَىٰ (das ist eher geeignet …).", ex:"Und Wir werden sie ganz gewiss von der näheren Strafe kosten lassen vor der größeren Strafe."},
     en:{gram:"“nearer, lower, lesser”, also “more likely, more suitable”. Pattern أَفْعَل.", pair:"Root د ن و: دُنْيَا (this worldly life, lit. the nearer one). Opposite: أَكْبَر / أَعْلَىٰ.", tip:"Typical: ٱلْعَذَابِ ٱلْأَدْنَىٰ دُونَ ٱلْعَذَابِ ٱلْأَكْبَرِ (the nearer punishment before the greater one). Also: ذَٰلِكَ أَدْنَىٰ (that is more likely …).", ex:"And We will surely let them taste the nearer punishment before the greater punishment."},
     ru:{gram:"«ближе, ниже, меньше», а также «вероятнее, более подходящий». Модель أَفْعَل.", pair:"Корень د ن و: دُنْيَا (земная жизнь, букв. «ближайшая»). Противоположность: أَكْبَر / أَعْلَىٰ.", tip:"Типично: ٱلْعَذَابِ ٱلْأَدْنَىٰ دُونَ ٱلْعَذَابِ ٱلْأَكْبَرِ (ближнее наказание до величайшего). Также: ذَٰلِكَ أَدْنَىٰ (так вероятнее …).", ex:"Мы непременно дадим им вкусить ближнее наказание помимо величайшего наказания."} } },
 ]},
 { id:3, sub:{de:"Propheten und Gesandte", en:"Prophets and messengers", ru:"Пророки и посланники"}, words:[
  { id:"rasul", ar:"رَسُول (رُسُل)", q:"رسول|رسوله|رسولا|رسولنا|رسولهم|رسولكم|رسل|رسله|رسلنا|رسلهم|رسلكم", ex:{ref:"48:29", ar:"مُّحَمَّدٌ رَّسُولُ ٱللَّهِ"},
    m:{de:"Gesandter (Pl. رُسُل)", en:"messenger(s)", ru:"посланник(и)"},
    info:{
     de:{gram:"„Gesandter“: jemand, der mit einer Botschaft geschickt wird. Plural: رُسُل.", pair:"Wurzel ر س ل: أَرْسَلَ (senden), رِسَالَة (Botschaft). Vgl. نَبِيّ (Prophet).", tip:"Jeder Gesandte ist ein Prophet, aber nicht jeder Prophet ein Gesandter. Formen mit Endung (رَسُولُهُ, رُسُلُنَا …) sind mitgesucht.", ex:"Muhammad ist der Gesandte Allahs."},
     en:{gram:"“messenger”: someone sent with a message. Plural: رُسُل.", pair:"Root ر س ل: أَرْسَلَ (to send), رِسَالَة (message). Compare نَبِيّ (prophet).", tip:"Every messenger is a prophet, but not every prophet is a messenger. Forms with endings (رَسُولُهُ, رُسُلُنَا …) are included.", ex:"Muhammad is the Messenger of Allah."},
     ru:{gram:"«посланник»: тот, кого послали с вестью. Мн. ч.: رُسُل.", pair:"Корень ر س ل: أَرْسَلَ (послать), رِسَالَة (послание). Сравни: نَبِيّ (пророк).", tip:"Каждый посланник — пророк, но не каждый пророк — посланник. Формы с окончаниями (رَسُولُهُ, رُسُلُنَا …) включены.", ex:"Мухаммад — посланник Аллаха."} } },
  { id:"nabi", ar:"نَبِيّ", q:"نبي|نبيا|نبيهم", ex:{ref:"33:56", ar:"إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ"},
    m:{de:"Prophet", en:"prophet", ru:"пророк"},
    info:{
     de:{gram:"„Prophet“: jemand, dem Allah Offenbarung gibt.", pair:"Pluralformen: أَنْبِيَاء und نَبِيُّونَ / نَبِيِّينَ (nächste Wörter).", tip:"Mit Artikel meint ٱلنَّبِيّ fast immer den Propheten Muhammad ﷺ, z. B. يَا أَيُّهَا ٱلنَّبِيُّ.", ex:"Allah und Seine Engel sprechen Segen über den Propheten."},
     en:{gram:"“prophet”: someone to whom Allah gives revelation.", pair:"Plural forms: أَنْبِيَاء and نَبِيُّونَ / نَبِيِّينَ (next words).", tip:"With the article, ٱلنَّبِيّ almost always means the Prophet Muhammad ﷺ, e.g. يَا أَيُّهَا ٱلنَّبِيُّ.", ex:"Indeed, Allah and His angels send blessings upon the Prophet."},
     ru:{gram:"«пророк»: тот, кому Аллах даёт откровение.", pair:"Формы мн. ч.: أَنْبِيَاء и نَبِيُّونَ / نَبِيِّينَ (следующие слова).", tip:"С артиклем ٱلنَّبِيّ почти всегда означает пророка Мухаммада ﷺ, напр. يَا أَيُّهَا ٱلنَّبِيُّ.", ex:"Воистину, Аллах и Его ангелы благословляют Пророка."} } },
  { id:"anbiya", ar:"أَنْبِيَاء", q:"أنبياء", ex:{ref:"2:91", ar:"قُلْ فَلِمَ تَقْتُلُونَ أَنۢبِيَآءَ ٱللَّهِ مِن قَبْلُ"},
    m:{de:"Propheten (Pl. أَنْبِيَاء)", en:"prophets (pl. anbiyāʾ)", ru:"пророки (мн. анбийа)"},
    info:{
     de:{gram:"Gebrochener Plural von نَبِيّ: „Propheten“.", pair:"Anderer Plural: نَبِيُّونَ / نَبِيِّينَ (gesunder Plural).", tip:"Kommt oft dort vor, wo frühere Völker Propheten getötet haben: وَقَتْلَهُمُ ٱلْأَنْبِيَاءَ.", ex:"Sag: Warum habt ihr denn früher die Propheten Allahs getötet?"},
     en:{gram:"Broken plural of نَبِيّ: “prophets”.", pair:"Other plural: نَبِيُّونَ / نَبِيِّينَ (sound plural).", tip:"It often appears where earlier peoples killed prophets: وَقَتْلَهُمُ ٱلْأَنْبِيَاءَ.", ex:"Say: Then why did you kill the prophets of Allah before?"},
     ru:{gram:"Ломаное мн. ч. от نَبِيّ: «пророки».", pair:"Другое мн. ч.: نَبِيُّونَ / نَبِيِّينَ (правильное мн. ч.).", tip:"Часто там, где прежние народы убивали пророков: وَقَتْلَهُمُ ٱلْأَنْبِيَاءَ.", ex:"Скажи: «Почему же прежде вы убивали пророков Аллаха?»"} } },
  { id:"nabiyyun", ar:"نَبِيُّونَ", q:"نبيون", ex:{ref:"2:136", ar:"وَمَآ أُوتِىَ ٱلنَّبِيُّونَ مِن رَّبِّهِمْ"},
    m:{de:"Propheten (Pl., Nominativ)", en:"prophets (pl., nominative)", ru:"пророки (мн., им. п.)"},
    info:{
     de:{gram:"Gesunder Plural von نَبِيّ im Nominativ (Endung ـُونَ).", pair:"Akkusativ/Genitiv: نَبِيِّينَ. Gebrochener Plural: أَنْبِيَاء.", tip:"Das Muster gilt für viele Wörter: ـُونَ im Nominativ, ـِينَ sonst, z. B. مُؤْمِنُونَ / مُؤْمِنِينَ.", ex:"und was den Propheten von ihrem Herrn gegeben wurde"},
     en:{gram:"Sound plural of نَبِيّ in the nominative (ending ـُونَ).", pair:"Accusative/genitive: نَبِيِّينَ. Broken plural: أَنْبِيَاء.", tip:"The pattern applies to many words: ـُونَ in the nominative, ـِينَ otherwise, e.g. مُؤْمِنُونَ / مُؤْمِنِينَ.", ex:"and what was given to the prophets from their Lord"},
     ru:{gram:"Правильное мн. ч. от نَبِيّ в именительном падеже (окончание ـُونَ).", pair:"Вин./род. падеж: نَبِيِّينَ. Ломаное мн. ч.: أَنْبِيَاء.", tip:"Модель общая для многих слов: ـُونَ в именительном, ـِينَ в остальных, напр. مُؤْمِنُونَ / مُؤْمِنِينَ.", ex:"и что было даровано пророкам от их Господа"} } },
  { id:"nabiyyin", ar:"نَبِيِّينَ", q:"نبيين", ex:{ref:"33:40", ar:"وَلَٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّـۧنَ"},
    m:{de:"Propheten (Pl., Akk./Gen.)", en:"prophets (pl., acc./gen.)", ru:"пророки (мн., вин./род. п.)"},
    info:{
     de:{gram:"Gesunder Plural von نَبِيّ im Akkusativ und Genitiv (Endung ـِينَ).", pair:"Nominativ: نَبِيُّونَ.", tip:"Bekannt: خَاتَمَ ٱلنَّبِيِّينَ (das Siegel der Propheten, 33:40).", ex:"sondern der Gesandte Allahs und das Siegel der Propheten"},
     en:{gram:"Sound plural of نَبِيّ in the accusative and genitive (ending ـِينَ).", pair:"Nominative: نَبِيُّونَ.", tip:"Well known: خَاتَمَ ٱلنَّبِيِّينَ (the seal of the prophets, 33:40).", ex:"but he is the Messenger of Allah and the seal of the prophets"},
     ru:{gram:"Правильное мн. ч. от نَبِيّ в винительном и родительном падеже (окончание ـِينَ).", pair:"Именительный: نَبِيُّونَ.", tip:"Известно: خَاتَمَ ٱلنَّبِيِّينَ (печать пророков, 33:40).", ex:"но он — посланник Аллаха и печать пророков"} } },
  { id:"amin", ar:"أَمِين", q:"أمين|أمينا", ex:{ref:"26:107", ar:"إِنِّى لَكُمْ رَسُولٌ أَمِينٌ"},
    m:{de:"vertrauenswürdig", en:"trustworthy, honest", ru:"надёжный, верный"},
    info:{
     de:{gram:"„vertrauenswürdig, zuverlässig“, Muster فَعِيل.", pair:"Wurzel أ م ن: أَمَانَة (anvertrautes Gut), آمَنَ (glauben), أَمْن (Sicherheit).", tip:"Die Propheten sagen: إِنِّي لَكُمْ رَسُولٌ أَمِينٌ (ich bin euch ein vertrauenswürdiger Gesandter). Auch Jibril heißt ٱلرُّوحُ ٱلْأَمِينُ.", ex:"Ich bin euch ja ein vertrauenswürdiger Gesandter."},
     en:{gram:"“trustworthy, reliable”, pattern فَعِيل.", pair:"Root أ م ن: أَمَانَة (trust), آمَنَ (to believe), أَمْن (safety).", tip:"The prophets say: إِنِّي لَكُمْ رَسُولٌ أَمِينٌ (I am to you a trustworthy messenger). Jibril is also called ٱلرُّوحُ ٱلْأَمِينُ.", ex:"Indeed, I am to you a trustworthy messenger."},
     ru:{gram:"«надёжный, верный», модель فَعِيل.", pair:"Корень أ م ن: أَمَانَة (вверенное), آمَنَ (уверовать), أَمْن (безопасность).", tip:"Пророки говорят: إِنِّي لَكُمْ رَسُولٌ أَمِينٌ (я для вас — надёжный посланник). Джибриль тоже назван ٱلرُّوحُ ٱلْأَمِينُ.", ex:"Воистину, я для вас — надёжный посланник."} } },
  { id:"nadhir", ar:"نَذِير", q:"نذير|نذيرا", ex:{ref:"67:26", ar:"وَإِنَّمَآ أَنَا۠ نَذِيرٌ مُّبِينٌ"},
    m:{de:"Warner", en:"warner", ru:"увещеватель"},
    info:{
     de:{gram:"„Warner“, Muster فَعِيل: jemand, der vor der Strafe warnt.", pair:"Gegenstück: بَشِير (Überbringer froher Botschaft). Oft zusammen: بَشِيرًا وَنَذِيرًا.", tip:"Wurzel ن ذ ر: أَنذَرَ (warnen). نَذِيرًا ist mitgesucht.", ex:"und ich bin nur ein deutlicher Warner"},
     en:{gram:"“warner”, pattern فَعِيل: someone who warns of punishment.", pair:"Counterpart: بَشِير (bearer of good news). Often together: بَشِيرًا وَنَذِيرًا.", tip:"Root ن ذ ر: أَنذَرَ (to warn). نَذِيرًا is included.", ex:"and I am only a clear warner"},
     ru:{gram:"«увещеватель», модель فَعِيل: тот, кто предостерегает о наказании.", pair:"Пара: بَشِير (добрый вестник). Часто вместе: بَشِيرًا وَنَذِيرًا.", tip:"Корень ن ذ ر: أَنذَرَ (предостерегать). نَذِيرًا включено.", ex:"а я — всего лишь ясный увещеватель"} } },
  { id:"musa", ar:"مُوسَىٰ", q:"موسى", ex:{ref:"20:9", ar:"وَهَلْ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ"},
    m:{de:"Musa (Mose)", en:"Moses", ru:"Муса (Моисей)"},
    info:{
     de:{gram:"Der Prophet Musa (Mose). Der am häufigsten genannte Prophet im Quran.", pair:"Sein Bruder: هَارُون. Sein Gegner: فِرْعَوْن.", tip:"Das ى am Ende wird ā gesprochen: Mūsā. Seine Geschichte zieht sich durch viele Suren, z. B. Ta-Ha und al-Qasas.", ex:"Ist dir die Geschichte von Musa zugekommen?"},
     en:{gram:"The prophet Moses. The most frequently mentioned prophet in the Quran.", pair:"His brother: هَارُون. His opponent: فِرْعَوْن.", tip:"The final ى is pronounced ā: Mūsā. His story runs through many surahs, e.g. Ta-Ha and al-Qasas.", ex:"And has the story of Moses reached you?"},
     ru:{gram:"Пророк Муса (Моисей). Самый часто упоминаемый пророк в Коране.", pair:"Его брат: هَارُون. Его противник: فِرْعَوْن.", tip:"Конечная ى читается как ā: Mūsā. Его история проходит через многие суры, напр. Та Ха и аль-Касас.", ex:"Дошёл ли до тебя рассказ о Мусе?"} } },
  { id:"harun", ar:"هَارُون", q:"هارون", ex:{ref:"20:30", ar:"هَٰرُونَ أَخِى"},
    m:{de:"Harun (Aaron)", en:"Aaron", ru:"Харун (Аарон)"},
    info:{
     de:{gram:"Der Prophet Harun (Aaron), Bruder von Musa.", pair:"Oft zusammen: مُوسَىٰ وَهَارُونَ.", tip:"Musa bat Allah um ihn als Helfer: وَٱجْعَل لِّي وَزِيرًا مِّنْ أَهْلِي هَارُونَ أَخِي (20:29–30).", ex:"Harun, meinen Bruder"},
     en:{gram:"The prophet Aaron, brother of Moses.", pair:"Often together: مُوسَىٰ وَهَارُونَ.", tip:"Moses asked Allah for him as a helper: وَٱجْعَل لِّي وَزِيرًا مِّنْ أَهْلِي هَارُونَ أَخِي (20:29–30).", ex:"Aaron, my brother"},
     ru:{gram:"Пророк Харун (Аарон), брат Мусы.", pair:"Часто вместе: مُوسَىٰ وَهَارُونَ.", tip:"Муса просил Аллаха сделать его помощником: وَٱجْعَل لِّي وَزِيرًا مِّنْ أَهْلِي هَارُونَ أَخِي (20:29–30).", ex:"Харуна, моего брата"} } },
  { id:"firawn", ar:"فِرْعَوْن", q:"فرعون", ex:{ref:"79:17", ar:"ٱذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغَىٰ"},
    m:{de:"Pharao", en:"Pharaoh", ru:"Фараон"},
    info:{
     de:{gram:"„Pharao“, der Herrscher Ägyptens zur Zeit von Musa. Kein Prophet, sondern sein Gegner.", pair:"Seine Leute: آلُ فِرْعَوْنَ (50 % Liste 7).", tip:"Steht im Quran für Hochmut und Unterdrückung: إِنَّهُ طَغَىٰ (er überschritt das Maß).", ex:"Geh zu Pharao, denn er überschreitet das Maß."},
     en:{gram:"“Pharaoh”, the ruler of Egypt at the time of Moses. Not a prophet but his opponent.", pair:"His people: آلُ فِرْعَوْنَ (50% List 7).", tip:"In the Quran he stands for arrogance and oppression: إِنَّهُ طَغَىٰ (he transgressed).", ex:"Go to Pharaoh. Indeed, he has transgressed."},
     ru:{gram:"«Фараон», правитель Египта во времена Мусы. Не пророк, а его противник.", pair:"Его люди: آلُ فِرْعَوْنَ (50 %, список 7).", tip:"В Коране он — символ высокомерия и угнетения: إِنَّهُ طَغَىٰ (он преступил границы).", ex:"Ступай к Фараону, ибо он преступил границы."} } },
  { id:"ibrahim", ar:"إِبْرَاهِيم", q:"إبراهيم|إبراهم", ex:{ref:"4:125", ar:"وَٱتَّخَذَ ٱللَّهُ إِبْرَٰهِيمَ خَلِيلًا"},
    m:{de:"Ibrahim (Abraham)", en:"Abraham", ru:"Ибрахим (Авраам)"},
    info:{
     de:{gram:"Der Prophet Ibrahim (Abraham), خَلِيلُ ٱللَّه (Freund Allahs).", pair:"Seine Söhne: إِسْمَاعِيل und إِسْحَاق. Sein Enkel: يَعْقُوب.", tip:"In Sura al-Baqara wird der Name im Uthmani-Text oft ohne ي geschrieben (إِبْرَٰهِـۧمَ). Beide Schreibweisen sind mitgesucht.", ex:"Und Allah nahm Ibrahim zum Freund."},
     en:{gram:"The prophet Abraham, خَلِيلُ ٱللَّه (friend of Allah).", pair:"His sons: إِسْمَاعِيل and إِسْحَاق. His grandson: يَعْقُوب.", tip:"In Surah al-Baqara the Uthmani text often writes the name without ي (إِبْرَٰهِـۧمَ). Both spellings are included.", ex:"And Allah took Abraham as an intimate friend."},
     ru:{gram:"Пророк Ибрахим (Авраам), خَلِيلُ ٱللَّه (друг Аллаха).", pair:"Его сыновья: إِسْمَاعِيل и إِسْحَاق. Его внук: يَعْقُوب.", tip:"В суре аль-Бакара в османском письме имя часто пишется без ي (إِبْرَٰهِـۧمَ). Оба написания включены.", ex:"Аллах сделал Ибрахима Своим другом."} } },
  { id:"ismail", ar:"إِسْمَاعِيل", q:"إسماعيل", ex:{ref:"19:54", ar:"وَٱذْكُرْ فِى ٱلْكِتَٰبِ إِسْمَٰعِيلَ ۚ إِنَّهُۥ كَانَ صَادِقَ ٱلْوَعْدِ"},
    m:{de:"Ismail (Ismael)", en:"Ishmael", ru:"Исмаил (Измаил)"},
    info:{
     de:{gram:"Der Prophet Ismail, Sohn von Ibrahim.", pair:"Mit Ibrahim baute er die Kaaba: وَإِذْ يَرْفَعُ إِبْرَاهِيمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَاعِيلُ (2:127).", tip:"Er wird gelobt: إِنَّهُ كَانَ صَادِقَ ٱلْوَعْدِ (er hielt stets sein Versprechen).", ex:"Und gedenke in der Schrift Ismails. Er hielt stets sein Versprechen."},
     en:{gram:"The prophet Ishmael, son of Abraham.", pair:"With Abraham he built the Kaaba: وَإِذْ يَرْفَعُ إِبْرَاهِيمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَاعِيلُ (2:127).", tip:"He is praised: إِنَّهُ كَانَ صَادِقَ ٱلْوَعْدِ (he was true to his promise).", ex:"And mention in the Book Ishmael. Indeed, he was true to his promise."},
     ru:{gram:"Пророк Исмаил, сын Ибрахима.", pair:"Вместе с Ибрахимом он воздвиг Каабу: وَإِذْ يَرْفَعُ إِبْرَاهِيمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَاعِيلُ (2:127).", tip:"Он восхвалён: إِنَّهُ كَانَ صَادِقَ ٱلْوَعْدِ (он был верен обещанию).", ex:"Помяни в Писании Исмаила. Воистину, он был верен обещанию."} } },
  { id:"nuh", ar:"نُوح", q:"نوح|نوحا", ex:{ref:"71:1", ar:"إِنَّآ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِۦٓ"},
    m:{de:"Nuh (Noah)", en:"Noah", ru:"Нух (Ной)"},
    info:{
     de:{gram:"Der Prophet Nuh (Noah). Eine ganze Sura trägt seinen Namen (Sura 71).", pair:"Sein Volk: قَوْمُ نُوحٍ. Die Arche: ٱلْفُلْك.", tip:"Mit Tanwin-Fatha: نُوحًا (Alif am Ende). Beide Formen sind mitgesucht.", ex:"Wir haben Nuh zu seinem Volk gesandt."},
     en:{gram:"The prophet Noah. A whole surah carries his name (Surah 71).", pair:"His people: قَوْمُ نُوحٍ. The ark: ٱلْفُلْك.", tip:"With tanwin fatha: نُوحًا (alif at the end). Both forms are included.", ex:"Indeed, We sent Noah to his people."},
     ru:{gram:"Пророк Нух (Ной). Его именем названа целая сура (сура 71).", pair:"Его народ: قَوْمُ نُوحٍ. Ковчег: ٱلْفُلْك.", tip:"С танвином фатха: نُوحًا (алиф в конце). Обе формы включены.", ex:"Мы отправили Нуха к его народу."} } },
  { id:"yusuf", ar:"يُوسُف", q:"يوسف", ex:{ref:"12:4", ar:"إِذْ قَالَ يُوسُفُ لِأَبِيهِ يَٰٓأَبَتِ"},
    m:{de:"Yusuf (Josef)", en:"Joseph", ru:"Юсуф (Иосиф)"},
    info:{
     de:{gram:"Der Prophet Yusuf (Josef), Sohn von Yaqub. Sura 12 erzählt seine ganze Geschichte.", pair:"Sein Vater: يَعْقُوب. Seine Brüder: إِخْوَةُ يُوسُفَ.", tip:"Seine Geschichte heißt im Quran أَحْسَنَ ٱلْقَصَصِ (die schönste Erzählung, 12:3).", ex:"Als Yusuf zu seinem Vater sagte: O mein lieber Vater …"},
     en:{gram:"The prophet Joseph, son of Jacob. Surah 12 tells his whole story.", pair:"His father: يَعْقُوب. His brothers: إِخْوَةُ يُوسُفَ.", tip:"The Quran calls his story أَحْسَنَ ٱلْقَصَصِ (the best of stories, 12:3).", ex:"When Joseph said to his father: O my father …"},
     ru:{gram:"Пророк Юсуф (Иосиф), сын Якуба. Сура 12 рассказывает всю его историю.", pair:"Его отец: يَعْقُوب. Его братья: إِخْوَةُ يُوسُفَ.", tip:"Коран называет его историю أَحْسَنَ ٱلْقَصَصِ (лучший из рассказов, 12:3).", ex:"Вот Юсуф сказал своему отцу: «Отец мой! …»"} } },
  { id:"lut", ar:"لُوط", q:"لوط|لوطا", ex:{ref:"26:160", ar:"كَذَّبَتْ قَوْمُ لُوطٍ ٱلْمُرْسَلِينَ"},
    m:{de:"Lut (Lot)", en:"Lot", ru:"Лут (Лот)"},
    info:{
     de:{gram:"Der Prophet Lut (Lot), Neffe von Ibrahim.", pair:"Sein Volk: قَوْمُ لُوطٍ, das wegen seiner Schandtaten vernichtet wurde.", tip:"Mit Tanwin-Fatha: لُوطًا. Beide Formen sind mitgesucht.", ex:"Das Volk Luts erklärte die Gesandten für Lügner."},
     en:{gram:"The prophet Lot, nephew of Abraham.", pair:"His people: قَوْمُ لُوطٍ, who were destroyed for their misdeeds.", tip:"With tanwin fatha: لُوطًا. Both forms are included.", ex:"The people of Lot denied the messengers."},
     ru:{gram:"Пророк Лут (Лот), племянник Ибрахима.", pair:"Его народ: قَوْمُ لُوطٍ, уничтоженный за свои мерзости.", tip:"С танвином фатха: لُوطًا. Обе формы включены.", ex:"Народ Лута счёл лжецами посланников."} } },
  { id:"isa", ar:"عِيسَى ٱبْنُ مَرْيَمَ", q:"المسيح عيسى ابن مريم|عيسى ابن مريم|المسيح ابن مريم|عيسى|ابن مريم", ex:{ref:"3:45", ar:"ٱسْمُهُ ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ"},
    m:{de:"Isa, Sohn der Maryam (Jesus)", en:"Jesus, son of Mary", ru:"Иса, сын Марьям (Иисус)"},
    info:{
     de:{gram:"Der Prophet Isa (Jesus), Sohn der Maryam, ٱلْمَسِيح (der Messias).", pair:"Seine Mutter: مَرْيَم, nach der Sura 19 benannt ist.", tip:"Die Suche zählt عِيسَى und die Wendung ٱبْنُ مَرْيَمَ (Sohn der Maryam). ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ zählt als ein Treffer.", ex:"sein Name ist al-Masih Isa, der Sohn Maryams"},
     en:{gram:"The prophet Jesus, son of Mary, ٱلْمَسِيح (the Messiah).", pair:"His mother: مَرْيَم, after whom Surah 19 is named.", tip:"The search counts عِيسَى and the phrase ٱبْنُ مَرْيَمَ (son of Mary); ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ counts as one match.", ex:"his name will be the Messiah, Jesus, the son of Mary"},
     ru:{gram:"Пророк Иса (Иисус), сын Марьям, ٱلْمَسِيح (Мессия).", pair:"Его мать: مَرْيَم, в честь которой названа сура 19.", tip:"Поиск учитывает عِيسَى и оборот ٱبْنُ مَرْيَمَ (сын Марьям); ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ считается одним совпадением.", ex:"имя его — Мессия Иса, сын Марьям"} } },
  { id:"adam", ar:"آدَم", q:"آدم", ex:{ref:"2:31", ar:"وَعَلَّمَ ءَادَمَ ٱلْأَسْمَآءَ كُلَّهَا"},
    m:{de:"Adam", en:"Adam", ru:"Адам"},
    info:{
     de:{gram:"Adam, der erste Mensch und erste Prophet.", pair:"Häufig: بَنِي آدَمَ (Kinder Adams, also die Menschen).", tip:"Allah lehrte ihn die Namen aller Dinge: وَعَلَّمَ آدَمَ ٱلْأَسْمَاءَ كُلَّهَا (2:31).", ex:"Und Er lehrte Adam die Namen alle."},
     en:{gram:"Adam, the first human and the first prophet.", pair:"Common: بَنِي آدَمَ (children of Adam, i.e. mankind).", tip:"Allah taught him the names of all things: وَعَلَّمَ آدَمَ ٱلْأَسْمَاءَ كُلَّهَا (2:31).", ex:"And He taught Adam the names, all of them."},
     ru:{gram:"Адам, первый человек и первый пророк.", pair:"Часто: بَنِي آدَمَ (сыны Адама, то есть люди).", tip:"Аллах научил его именам всех вещей: وَعَلَّمَ آدَمَ ٱلْأَسْمَاءَ كُلَّهَا (2:31).", ex:"Он научил Адама всем именам."} } },
  { id:"sulayman", ar:"سُلَيْمَان", q:"سليمان", ex:{ref:"27:16", ar:"وَوَرِثَ سُلَيْمَٰنُ دَاوُۥدَ"},
    m:{de:"Sulaiman (Salomo)", en:"Solomon", ru:"Сулейман (Соломон)"},
    info:{
     de:{gram:"Der Prophet Sulaiman (Salomo), Sohn von Dawud, König und Prophet.", pair:"Sein Vater: دَاوُود. Bekannt: die Königin von Saba (Sura 27).", tip:"Ihm waren Wind und Dschinn dienstbar, und er verstand die Sprache der Vögel und Ameisen.", ex:"Und Sulaiman beerbte Dawud."},
     en:{gram:"The prophet Solomon, son of David, king and prophet.", pair:"His father: دَاوُود. Well known: the Queen of Sheba (Surah 27).", tip:"The wind and the jinn served him, and he understood the speech of birds and ants.", ex:"And Solomon inherited from David."},
     ru:{gram:"Пророк Сулейман (Соломон), сын Дауда, царь и пророк.", pair:"Его отец: دَاوُود. Известно: царица Сабы (сура 27).", tip:"Ему подчинялись ветер и джинны, и он понимал язык птиц и муравьёв.", ex:"Сулейман унаследовал Дауду."} } },
  { id:"ishaq", ar:"إِسْحَاق", q:"إسحاق", ex:{ref:"37:112", ar:"وَبَشَّرْنَٰهُ بِإِسْحَٰقَ نَبِيًّا مِّنَ ٱلصَّٰلِحِينَ"},
    m:{de:"Ishaq (Isaak)", en:"Isaac", ru:"Исхак (Исаак)"},
    info:{
     de:{gram:"Der Prophet Ishaq (Isaak), Sohn von Ibrahim.", pair:"Sein Sohn: يَعْقُوب. Sein Bruder: إِسْمَاعِيل.", tip:"Oft in der Reihe: إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ.", ex:"Und Wir verkündeten ihm Ishaq als Propheten von den Rechtschaffenen."},
     en:{gram:"The prophet Isaac, son of Abraham.", pair:"His son: يَعْقُوب. His brother: إِسْمَاعِيل.", tip:"Often in the sequence: إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ.", ex:"And We gave him good tidings of Isaac, a prophet from among the righteous."},
     ru:{gram:"Пророк Исхак (Исаак), сын Ибрахима.", pair:"Его сын: يَعْقُوب. Его брат: إِسْمَاعِيل.", tip:"Часто в ряду: إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ.", ex:"Мы обрадовали его вестью об Исхаке — пророке из числа праведников."} } },
  { id:"yaqub", ar:"يَعْقُوب (إِسْرَائِيل)", q:"يعقوب|إسرائيل", ex:{ref:"2:132", ar:"وَوَصَّىٰ بِهَآ إِبْرَٰهِـۧمُ بَنِيهِ وَيَعْقُوبُ"},
    m:{de:"Yaqub (Jakob), Israil", en:"Jacob (Israel)", ru:"Якуб (Иаков), Исраил"},
    info:{
     de:{gram:"Der Prophet Yaqub (Jakob), Sohn von Ishaq. Sein Beiname: إِسْرَائِيل.", pair:"Seine Nachkommen: بَنُو إِسْرَائِيلَ (die Kinder Israels). Sein Sohn: يُوسُف.", tip:"Die Suche zählt يَعْقُوب und إِسْرَائِيل, also auch alle Stellen mit بَنِي إِسْرَائِيلَ.", ex:"Und Ibrahim legte es seinen Söhnen ans Herz, und auch Yaqub."},
     en:{gram:"The prophet Jacob, son of Isaac. His other name: إِسْرَائِيل (Israel).", pair:"His descendants: بَنُو إِسْرَائِيلَ (the Children of Israel). His son: يُوسُف.", tip:"The search counts يَعْقُوب and إِسْرَائِيل, so every بَنِي إِسْرَائِيلَ is included too.", ex:"And Abraham instructed his sons to do so, and so did Jacob."},
     ru:{gram:"Пророк Якуб (Иаков), сын Исхака. Его другое имя: إِسْرَائِيل (Исраил).", pair:"Его потомки: بَنُو إِسْرَائِيلَ (сыны Исраила). Его сын: يُوسُف.", tip:"Поиск учитывает يَعْقُوب и إِسْرَائِيل, то есть и все места с بَنِي إِسْرَائِيلَ.", ex:"Ибрахим и Якуб заповедали это своим сыновьям."} } },
  { id:"dawud", ar:"دَاوُود", q:"داود|داوود", ex:{ref:"34:10", ar:"وَلَقَدْ ءَاتَيْنَا دَاوُۥدَ مِنَّا فَضْلًا"},
    m:{de:"Dawud (David)", en:"David", ru:"Дауд (Давид)"},
    info:{
     de:{gram:"Der Prophet Dawud (David), König und Prophet.", pair:"Sein Sohn: سُلَيْمَان. Seine Schrift: ٱلزَّبُور (die Psalmen).", tip:"Er besiegte جَالُوت (Goliath, 2:251). Im Uthmani-Text wird der Name mit einem و geschrieben (دَاوُۥدَ). Beide Schreibweisen sind mitgesucht.", ex:"Und Wir gaben Dawud ja Huld von Uns."},
     en:{gram:"The prophet David, king and prophet.", pair:"His son: سُلَيْمَان. His scripture: ٱلزَّبُور (the Psalms).", tip:"He defeated جَالُوت (Goliath, 2:251). The Uthmani text writes the name with one و (دَاوُۥدَ); both spellings are included.", ex:"And We certainly gave David bounty from Us."},
     ru:{gram:"Пророк Дауд (Давид), царь и пророк.", pair:"Его сын: سُلَيْمَان. Его писание: ٱلزَّبُور (Псалтирь).", tip:"Он победил جَالُوت (Голиафа, 2:251). В османском письме имя пишется с одной و (دَاوُۥدَ), оба написания включены.", ex:"Мы даровали Дауду милость от Нас."} } },
  { id:"shuayb", ar:"شُعَيْب (مَدْيَن)", q:"شعيب|شعيبا|مدين", ex:{ref:"7:85", ar:"وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا"},
    m:{de:"Schuaib (Madyan)", en:"Shu'aib (Midian)", ru:"Шуайб (Мадьян)"},
    info:{
     de:{gram:"Der Prophet Schuaib, gesandt zum Volk von مَدْيَن (Madyan).", pair:"Sein Volk betrog beim Messen und Wiegen.", tip:"Die Suche zählt شُعَيْب und مَدْيَن (den Ort, zu dem er gesandt wurde).", ex:"Und zu Madyan (sandten Wir) ihren Bruder Schuaib."},
     en:{gram:"The prophet Shu'aib, sent to the people of مَدْيَن (Midian).", pair:"His people cheated in measure and weight.", tip:"The search counts شُعَيْب and مَدْيَن (the place he was sent to).", ex:"And to Midian (We sent) their brother Shu'aib."},
     ru:{gram:"Пророк Шуайб, посланный к народу مَدْيَن (Мадьян).", pair:"Его народ обвешивал и обмеривал.", tip:"Поиск учитывает شُعَيْب и مَدْيَن (место, куда он был послан).", ex:"К мадьянитам Мы отправили их брата Шуайба."} } },
  { id:"salih", ar:"صَالِح (ثَمُود)", q:"أخاهم صالحا|يا صالح|قوم صالح|ثمود", ex:{ref:"7:73", ar:"وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَٰلِحًا"},
    m:{de:"Salih (Thamud)", en:"Salih (Thamud)", ru:"Салих (Самуд)"},
    info:{
     de:{gram:"Der Prophet Salih, gesandt zum Volk ثَمُود (Thamud).", pair:"Sein Zeichen: die Kamelstute (نَاقَةُ ٱللَّهِ, 50 % Liste 1).", tip:"صَالِح heißt auch „rechtschaffen“ (z. B. عَمَلًا صَالِحًا). Deshalb zählt die Suche nur eindeutige Stellen wie أَخَاهُمْ صَالِحًا, يَا صَالِحُ, قَوْمِ صَالِحٍ und ثَمُود.", ex:"Und zu Thamud (sandten Wir) ihren Bruder Salih."},
     en:{gram:"The prophet Salih, sent to the people of ثَمُود (Thamud).", pair:"His sign: the she-camel (نَاقَةُ ٱللَّهِ, 50% List 1).", tip:"صَالِح also means “righteous” (e.g. عَمَلًا صَالِحًا). So the search only counts clear places like أَخَاهُمْ صَالِحًا, يَا صَالِحُ, قَوْمِ صَالِحٍ and ثَمُود.", ex:"And to Thamud (We sent) their brother Salih."},
     ru:{gram:"Пророк Салих, посланный к народу ثَمُود (Самуд).", pair:"Его знамение — верблюдица (نَاقَةُ ٱللَّهِ, 50 %, список 1).", tip:"صَالِح значит также «праведный» (напр. عَمَلًا صَالِحًا). Поэтому поиск учитывает только однозначные места: أَخَاهُمْ صَالِحًا, يَا صَالِحُ, قَوْمِ صَالِحٍ и ثَمُود.", ex:"К самудянам Мы отправили их брата Салиха."} } },
  { id:"zakariya", ar:"زَكَرِيَّا", q:"زكريا", ex:{ref:"19:2", ar:"ذِكْرُ رَحْمَتِ رَبِّكَ عَبْدَهُۥ زَكَرِيَّآ"},
    m:{de:"Zakariya (Zacharias)", en:"Zechariah", ru:"Закария (Захария)"},
    info:{
     de:{gram:"Der Prophet Zakariya, Vater von Yahya und Hüter der Maryam.", pair:"Sein Sohn: يَحْيَىٰ.", tip:"Er betete im hohen Alter um einen Sohn (19:2–11). Endet auf ا: Zakariyyā.", ex:"Dies ist das Gedenken an die Barmherzigkeit deines Herrn gegenüber Seinem Diener Zakariya."},
     en:{gram:"The prophet Zechariah, father of John and guardian of Mary.", pair:"His son: يَحْيَىٰ.", tip:"In old age he prayed for a son (19:2–11). It ends in ا: Zakariyyā.", ex:"A mention of the mercy of your Lord to His servant Zechariah."},
     ru:{gram:"Пророк Закария, отец Яхьи и опекун Марьям.", pair:"Его сын: يَحْيَىٰ.", tip:"В старости он молил о сыне (19:2–11). Оканчивается на ا: Zakariyyā.", ex:"Это — напоминание о милости твоего Господа к Его рабу Закарии."} } },
  { id:"yahya", ar:"يَحْيَىٰ", q:"يحيى", v:"يَحْيَى", ex:{ref:"19:12", ar:"يَٰيَحْيَىٰ خُذِ ٱلْكِتَٰبَ بِقُوَّةٍ"},
    m:{de:"Yahya (Johannes)", en:"John", ru:"Яхья (Иоанн)"},
    info:{
     de:{gram:"Der Prophet Yahya (Johannes), Sohn von Zakariya.", pair:"Sein Vater: زَكَرِيَّا.", tip:"Fast gleich geschrieben ist das Verb يُحْيِي (Er macht lebendig). Die App zeigt nur den Namen يَحْيَىٰ.", ex:"O Yahya, nimm die Schrift mit Kraft!"},
     en:{gram:"The prophet John, son of Zechariah.", pair:"His father: زَكَرِيَّا.", tip:"The verb يُحْيِي (He gives life) looks almost the same. The app only shows the name يَحْيَىٰ.", ex:"O John, take the Scripture with determination."},
     ru:{gram:"Пророк Яхья (Иоанн), сын Закарии.", pair:"Его отец: زَكَرِيَّا.", tip:"Почти так же пишется глагол يُحْيِي (Он оживляет). Приложение показывает только имя يَحْيَىٰ.", ex:"О Яхья! Крепко держи Писание!"} } },
  { id:"hud", ar:"هُود (عَاد)", q:"أخاهم هودا|أخوهم هود|يا هود|قوم هود|عاد|عادا", ex:{ref:"7:65", ar:"وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا"},
    m:{de:"Hud (Ad)", en:"Hud ('Ad)", ru:"Худ (Ад)"},
    info:{
     de:{gram:"Der Prophet Hud, gesandt zum Volk عَاد (Ad). Sura 11 trägt seinen Namen.", pair:"Nach Ad kam Thamud mit Salih.", tip:"هُود heißt auch „Juden“ (z. B. 2:111). Deshalb zählt die Suche nur eindeutige Stellen wie أَخَاهُمْ هُودًا, يَا هُودُ, قَوْمِ هُودٍ und عَاد.", ex:"Und zu Ad (sandten Wir) ihren Bruder Hud."},
     en:{gram:"The prophet Hud, sent to the people of عَاد ('Ad). Surah 11 carries his name.", pair:"After 'Ad came Thamud with Salih.", tip:"هُود also means “Jews” (e.g. 2:111). So the search only counts clear places like أَخَاهُمْ هُودًا, يَا هُودُ, قَوْمِ هُودٍ and عَاد.", ex:"And to 'Ad (We sent) their brother Hud."},
     ru:{gram:"Пророк Худ, посланный к народу عَاد (Ад). Его именем названа сура 11.", pair:"После адитов были самудяне с Салихом.", tip:"هُود значит также «иудеи» (напр. 2:111). Поэтому поиск учитывает только однозначные места: أَخَاهُمْ هُودًا, يَا هُودُ, قَوْمِ هُودٍ и عَاد.", ex:"К адитам Мы отправили их брата Худа."} } },
  { id:"ayyub", ar:"أَيُّوب", q:"أيوب", ex:{ref:"21:83", ar:"وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُۥٓ أَنِّى مَسَّنِىَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ"},
    m:{de:"Ayyub (Hiob)", en:"Job", ru:"Айюб (Иов)"},
    info:{
     de:{gram:"Der Prophet Ayyub (Hiob), Vorbild für Geduld.", pair:"Allah sagt über ihn: إِنَّا وَجَدْنَاهُ صَابِرًا (Wir fanden ihn standhaft, 38:44).", tip:"Sein Bittgebet: أَنِّي مَسَّنِيَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّاحِمِينَ (21:83).", ex:"Und Ayyub, als er zu seinem Herrn rief: Mich hat Schaden getroffen, und Du bist der Barmherzigste der Barmherzigen."},
     en:{gram:"The prophet Job, a model of patience.", pair:"Allah says of him: إِنَّا وَجَدْنَاهُ صَابِرًا (We found him patient, 38:44).", tip:"His supplication: أَنِّي مَسَّنِيَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّاحِمِينَ (21:83).", ex:"And Job, when he called to his Lord: Adversity has touched me, and You are the Most Merciful of the merciful."},
     ru:{gram:"Пророк Айюб (Иов), образец терпения.", pair:"Аллах говорит о нём: إِنَّا وَجَدْنَاهُ صَابِرًا (Мы нашли его терпеливым, 38:44).", tip:"Его мольба: أَنِّي مَسَّنِيَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّاحِمِينَ (21:83).", ex:"Вспомни Айюба, когда он воззвал к своему Господу: «Меня постигло несчастье, а Ты — Милосерднейший из милосердных»."} } },
 ]},
 { id:4, sub:{de:"Zeichen und Gaben Allahs", en:"Allah’s signs and blessings", ru:"Знамения и милости Аллаха"}, words:[
  { id:"aya", ar:"آيَة", q:"آية|آيتين|آيته", ex:{ref:"26:8", ar:"إِنَّ فِى ذَٰلِكَ لَءَايَةً"},
    m:{de:"Zeichen, Vers", en:"sign, verse", ru:"знамение, аят"},
    info:{
     de:{gram:"„Zeichen“ und „Vers (Ayah)“: Jeder Vers des Quran ist ein Zeichen Allahs.", pair:"Plural: آيَات. Wurzel أ ي ي.", tip:"Häufig: إِنَّ فِي ذَٰلِكَ لَآيَةً (darin ist wahrlich ein Zeichen). Endet auf ة, im Dual آيَتَيْنِ.", ex:"Darin ist wahrlich ein Zeichen."},
     en:{gram:"“sign” and “verse (ayah)”: every verse of the Quran is a sign of Allah.", pair:"Plural: آيَات. Root أ ي ي.", tip:"Common: إِنَّ فِي ذَٰلِكَ لَآيَةً (indeed, in that is a sign). Ends in ة; dual آيَتَيْنِ.", ex:"Indeed, in that is a sign."},
     ru:{gram:"«знамение» и «аят»: каждый аят Корана — знамение Аллаха.", pair:"Мн. ч.: آيَات. Корень أ ي ي.", tip:"Часто: إِنَّ فِي ذَٰلِكَ لَآيَةً (воистину, в этом — знамение). Оканчивается на ة; двойств. ч. آيَتَيْنِ.", ex:"Воистину, в этом — знамение."} } },
  { id:"ayat", ar:"آيَات", q:"آيات|آياته|آياتنا|آياتي|آياتها|آياتك", ex:{ref:"3:190", ar:"إِنَّ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَءَايَٰتٍ لِّأُو۟لِى ٱلْأَلْبَٰبِ"},
    m:{de:"Zeichen, Verse (Pl.)", en:"signs, verses", ru:"знамения, аяты"},
    info:{
     de:{gram:"Plural von آيَة: „Zeichen, Verse“. Gesunder femininer Plural auf ـَات.", pair:"Singular: آيَة. Gleiches Muster: سَمَاوَات, صَالِحَات.", tip:"Die Zeichen sind im Quran oft die Natur selbst: Himmel, Erde, Nacht und Tag. Formen mit Endung (آيَاتِنَا, آيَاتِهِ …) sind mitgesucht.", ex:"In der Schöpfung der Himmel und der Erde und im Wechsel von Nacht und Tag liegen wahrlich Zeichen für diejenigen, die Verstand besitzen."},
     en:{gram:"Plural of آيَة: “signs, verses”. Sound feminine plural in ـَات.", pair:"Singular: آيَة. Same pattern: سَمَاوَات, صَالِحَات.", tip:"In the Quran the signs are often nature itself: heavens, earth, night and day. Forms with endings (آيَاتِنَا, آيَاتِهِ …) are included.", ex:"Indeed, in the creation of the heavens and the earth and the alternation of night and day are signs for people of understanding."},
     ru:{gram:"Мн. ч. от آيَة: «знамения, аяты». Правильное мн. ч. женского рода на ـَات.", pair:"Ед. ч.: آيَة. Та же модель: سَمَاوَات, صَالِحَات.", tip:"Знамения в Коране — часто сама природа: небеса, земля, ночь и день. Формы с окончаниями (آيَاتِنَا, آيَاتِهِ …) включены.", ex:"Воистину, в сотворении небес и земли, в смене ночи и дня — знамения для обладающих разумом."} } },
  { id:"quran", ar:"ٱلْقُرْآن", q:"قرآن|قرآنا|قرآنه", ex:{ref:"2:185", ar:"شَهْرُ رَمَضَانَ ٱلَّذِىٓ أُنزِلَ فِيهِ ٱلْقُرْءَانُ"},
    m:{de:"der Quran", en:"the Quran", ru:"Коран"},
    info:{
     de:{gram:"„die Lesung, das Rezitierte“, der Name der Offenbarung an Muhammad ﷺ.", pair:"Wurzel ق ر أ: قَرَأَ (lesen), ٱقْرَأْ (lies!, das erste offenbarte Wort).", tip:"Ohne Artikel heißt قُرْآنًا auch „eine Lesung“: قُرْآنًا عَرَبِيًّا (eine arabische Lesung). Alle Formen sind mitgesucht.", ex:"Der Monat Ramadan ist es, in dem der Quran herabgesandt wurde."},
     en:{gram:"“the recitation, what is read”, the name of the revelation to Muhammad ﷺ.", pair:"Root ق ر أ: قَرَأَ (to read), ٱقْرَأْ (read!, the first revealed word).", tip:"Without the article قُرْآنًا also means “a recitation”: قُرْآنًا عَرَبِيًّا (an Arabic recitation). All forms are included.", ex:"The month of Ramadan is the one in which the Quran was revealed."},
     ru:{gram:"«чтение, то, что читают», название откровения Мухаммаду ﷺ.", pair:"Корень ق ر أ: قَرَأَ (читать), ٱقْرَأْ (читай!, первое ниспосланное слово).", tip:"Без артикля قُرْآنًا значит также «чтение»: قُرْآنًا عَرَبِيًّا (арабское чтение). Все формы включены.", ex:"В месяц рамадан был ниспослан Коран."} } },
  { id:"injil", ar:"ٱلْإِنجِيل", q:"إنجيل", ex:{ref:"5:46", ar:"وَءَاتَيْنَٰهُ ٱلْإِنجِيلَ فِيهِ هُدًى وَنُورٌ"},
    m:{de:"das Evangelium (Indschil)", en:"the Gospel", ru:"Евангелие (Инджиль)"},
    info:{
     de:{gram:"Das Evangelium (Indschil), die Schrift, die Isa gegeben wurde.", pair:"Weitere Schriften: ٱلتَّوْرَاة (Musa), ٱلزَّبُور (Dawud), ٱلْقُرْآن (Muhammad ﷺ).", tip:"Oft zusammen: ٱلتَّوْرَاةَ وَٱلْإِنجِيلَ.", ex:"Und Wir gaben ihm das Evangelium, in dem Rechtleitung und Licht ist."},
     en:{gram:"The Gospel (Injil), the scripture given to Jesus.", pair:"Other scriptures: ٱلتَّوْرَاة (Moses), ٱلزَّبُور (David), ٱلْقُرْآن (Muhammad ﷺ).", tip:"Often together: ٱلتَّوْرَاةَ وَٱلْإِنجِيلَ.", ex:"And We gave him the Gospel, in which was guidance and light."},
     ru:{gram:"Евангелие (Инджиль), писание, дарованное Исе.", pair:"Другие писания: ٱلتَّوْرَاة (Муса), ٱلزَّبُور (Дауд), ٱلْقُرْآن (Мухаммад ﷺ).", tip:"Часто вместе: ٱلتَّوْرَاةَ وَٱلْإِنجِيلَ.", ex:"Мы даровали ему Инджиль, в котором — верное руководство и свет."} } },
  { id:"tawrat", ar:"ٱلتَّوْرَاة", q:"توراة", ex:{ref:"5:44", ar:"إِنَّآ أَنزَلْنَا ٱلتَّوْرَىٰةَ فِيهَا هُدًى وَنُورٌ"},
    m:{de:"die Tora", en:"the Torah", ru:"Таурат (Тора)"},
    info:{
     de:{gram:"Die Tora (Taurat), die Schrift, die Musa gegeben wurde.", pair:"Weitere Schriften: ٱلْإِنجِيل, ٱلزَّبُور, ٱلْقُرْآن.", tip:"Das ā wird mit kleinem Alif geschrieben, am Ende steht ة: at-tawrāh.", ex:"Wir haben die Tora hinabgesandt, in der Rechtleitung und Licht ist."},
     en:{gram:"The Torah (Tawrat), the scripture given to Moses.", pair:"Other scriptures: ٱلْإِنجِيل, ٱلزَّبُور, ٱلْقُرْآن.", tip:"The ā is written with a small alif and it ends in ة: at-tawrāh.", ex:"Indeed, We sent down the Torah, in which was guidance and light."},
     ru:{gram:"Тора (Таурат), писание, дарованное Мусе.", pair:"Другие писания: ٱلْإِنجِيل, ٱلزَّبُور, ٱلْقُرْآن.", tip:"ā пишется маленьким алифом, в конце ة: at-tawrāh.", ex:"Мы ниспослали Таурат, в котором — верное руководство и свет."} } },
  { id:"anam", ar:"أَنْعَام", q:"أنعام|أنعامكم|أنعامهم", ex:{ref:"16:5", ar:"وَٱلْأَنْعَٰمَ خَلَقَهَا ۗ لَكُمْ فِيهَا دِفْءٌ وَمَنَٰفِعُ"},
    m:{de:"Vieh", en:"cattle, livestock", ru:"скот"},
    info:{
     de:{gram:"„Vieh“: Kamele, Rinder, Schafe und Ziegen.", pair:"Sura 6 heißt ٱلْأَنْعَام. Nicht verwechseln mit أَنْعَمَ (Gunst erweisen), gleiche Wurzel ن ع م.", tip:"Im Quran oft als Gabe Allahs: Nahrung, Kleidung und Transport (16:5–8).", ex:"Und das Vieh hat Er erschaffen. An ihm habt ihr Wärme und Nutzen."},
     en:{gram:"“livestock”: camels, cattle, sheep and goats.", pair:"Surah 6 is called ٱلْأَنْعَام. Don't confuse it with أَنْعَمَ (to bestow favour), same root ن ع م.", tip:"In the Quran often a gift of Allah: food, clothing and transport (16:5–8).", ex:"And the livestock He created; in them is warmth for you and benefits."},
     ru:{gram:"«скот»: верблюды, коровы, овцы и козы.", pair:"Сура 6 называется ٱلْأَنْعَام. Не путай с أَنْعَمَ (облагодетельствовать), тот же корень ن ع م.", tip:"В Коране часто как дар Аллаха: пища, одежда и средство передвижения (16:5–8).", ex:"Он сотворил скот, который даёт вам тепло и другую пользу."} } },
  { id:"jabal", ar:"جَبَل", q:"جبل|جبلا", vstart:"جَبَل", art:true, ex:{ref:"7:143", ar:"وَلَٰكِنِ ٱنظُرْ إِلَى ٱلْجَبَلِ"},
    m:{de:"Berg", en:"mountain", ru:"гора"},
    info:{
     de:{gram:"„Berg“. Plural: جِبَال.", pair:"Plural: جِبَال (nächstes Wort).", tip:"Bekannt: Musa und der Berg, der zerfiel, als Allah sich ihm offenbarte (7:143). Nicht verwechseln mit جِبِلًّا (eine Menge, 36:62).", ex:"Aber schau auf den Berg."},
     en:{gram:"“mountain”. Plural: جِبَال.", pair:"Plural: جِبَال (next word).", tip:"Well known: Moses and the mountain that crumbled when Allah manifested Himself to it (7:143). Don't confuse it with جِبِلًّا (a multitude, 36:62).", ex:"But look at the mountain."},
     ru:{gram:"«гора». Мн. ч.: جِبَال.", pair:"Мн. ч.: جِبَال (следующее слово).", tip:"Известно: Муса и гора, рассыпавшаяся, когда Аллах явил Себя ей (7:143). Не путай с جِبِلًّا (множество, 36:62).", ex:"Но посмотри на гору."} } },
  { id:"jibal", ar:"جِبَال", q:"جبال", ex:{ref:"78:7", ar:"وَٱلْجِبَالَ أَوْتَادًا"},
    m:{de:"Berge", en:"mountains", ru:"горы"},
    info:{
     de:{gram:"Plural von جَبَل: „Berge“. Gebrochener Plural nach dem Muster فِعَال.", pair:"Singular: جَبَل.", tip:"Typisch: وَٱلْجِبَالَ أَوْتَادًا (und die Berge als Pflöcke). Am Jüngsten Tag werden sie wie zerzupfte Wolle (101:5).", ex:"und die Berge als Pflöcke"},
     en:{gram:"Plural of جَبَل: “mountains”. Broken plural on the pattern فِعَال.", pair:"Singular: جَبَل.", tip:"Typical: وَٱلْجِبَالَ أَوْتَادًا (and the mountains as pegs). On the Last Day they become like fluffed wool (101:5).", ex:"and the mountains as pegs"},
     ru:{gram:"Мн. ч. от جَبَل: «горы». Ломаное мн. ч. по модели فِعَال.", pair:"Ед. ч.: جَبَل.", tip:"Типично: وَٱلْجِبَالَ أَوْتَادًا (и горы — колышками). В Судный день они станут как расчёсанная шерсть (101:5).", ex:"и горы — колышками"} } },
  { id:"bahr", ar:"بَحْر", q:"بحر|بحرين|بحرا", ex:{ref:"2:50", ar:"وَإِذْ فَرَقْنَا بِكُمُ ٱلْبَحْرَ"},
    m:{de:"Meer", en:"sea", ru:"море"},
    info:{
     de:{gram:"„Meer“. Dual: بَحْرَيْنِ (zwei Meere).", pair:"Plural: بِحَار. Ähnlich: نَهَر (Fluss).", tip:"Bekannt: das geteilte Meer für Musa (2:50) und مَرَجَ ٱلْبَحْرَيْنِ (Er ließ die zwei Meere fließen, 55:19).", ex:"Und als Wir für euch das Meer teilten"},
     en:{gram:"“sea”. Dual: بَحْرَيْنِ (two seas).", pair:"Plural: بِحَار. Similar: نَهَر (river).", tip:"Well known: the sea parted for Moses (2:50) and مَرَجَ ٱلْبَحْرَيْنِ (He released the two seas, 55:19).", ex:"And when We parted the sea for you"},
     ru:{gram:"«море». Двойств. ч.: بَحْرَيْنِ (два моря).", pair:"Мн. ч.: بِحَار. Похоже: نَهَر (река).", tip:"Известно: море, разверзшееся для Мусы (2:50), и مَرَجَ ٱلْبَحْرَيْنِ (Он смешал два моря, 55:19).", ex:"Вот Мы разверзли для вас море"} } },
  { id:"nahr", ar:"نَهَر", q:"نهر|نهرا", ex:{ref:"54:54", ar:"إِنَّ ٱلْمُتَّقِينَ فِى جَنَّٰتٍ وَنَهَرٍ"},
    m:{de:"Fluss", en:"river", ru:"река"},
    info:{
