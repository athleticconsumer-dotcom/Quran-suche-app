     ru:{gram:"Приставка: «с, в, посредством». Имя после неё в родительном падеже: بِسْمِ ٱللَّهِ (во имя Аллаха).", pair:"Похоже: فِي (в), مَعَ (с).", tip:"Как приставку приложение не может искать بِـ отдельно. Учитываются формы с окончаниями: بِهِ, بِهَا, بِهِمْ, بِكُمْ, بِنَا, بِي.", ex:"Именно они веруют в него."} } },
  { id:"an2", ar:"عَنْ", q:"عن|عنه|عنها|عنهم|عنكم|عني|عنك|عنا|عنهما", vstart:"عَن", ex:{ref:"98:8", ar:"رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ"},
    m:{de:"über, von … weg", en:"about, away from", ru:"о, от"},
    info:{
     de:{gram:"Präposition: „über (ein Thema), von … weg“.", pair:"Gegenstück: إِلَىٰ (zu … hin). Mit مَا: عَمَّا (Liste 8).", tip:"Typisch: رَضِيَ ٱللَّهُ عَنْهُمْ (Allah hat Wohlgefallen an ihnen) und يَسْأَلُونَكَ عَنِ … (sie fragen dich nach …).", ex:"Allah hat Wohlgefallen an ihnen, und sie haben Wohlgefallen an Ihm."},
     en:{gram:"Preposition: “about (a topic), away from”.", pair:"Counterpart: إِلَىٰ (towards). With مَا: عَمَّا (List 8).", tip:"Typical: رَضِيَ ٱللَّهُ عَنْهُمْ (Allah is pleased with them) and يَسْأَلُونَكَ عَنِ … (they ask you about …).", ex:"Allah is pleased with them, and they are pleased with Him."},
     ru:{gram:"Предлог: «о (теме), от, прочь от».", pair:"Пара: إِلَىٰ (к). С مَا: عَمَّا (список 8).", tip:"Типично: رَضِيَ ٱللَّهُ عَنْهُمْ (Аллах доволен ими) и يَسْأَلُونَكَ عَنِ … (они спрашивают тебя о …).", ex:"Аллах доволен ими, и они довольны Им."} } },
  { id:"fi", ar:"فِي", q:"في|فيه|فيها|فيهم|فيكم|فينا|فيهما|فيهن", ex:{ref:"2:2", ar:"ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ ۛ فِيهِ"},
    m:{de:"in", en:"in", ru:"в"},
    info:{
     de:{gram:"Präposition: „in, an, über“ (Ort, Zeit oder Thema).", pair:"Ähnlich: بِـ. Mit مَا: فِيمَا (Liste 8).", tip:"Mit Endung: فِيهِ (darin), فِيهَا (in ihr), فِيهِمْ (unter ihnen). Alle Formen sind mitgesucht.", ex:"Dies ist das Buch, an dem es keinen Zweifel gibt."},
     en:{gram:"Preposition: “in, at, about” (place, time or topic).", pair:"Similar: بِـ. With مَا: فِيمَا (List 8).", tip:"With endings: فِيهِ (in it), فِيهَا (in her/it), فِيهِمْ (among them). All forms are included.", ex:"This is the Book in which there is no doubt."},
     ru:{gram:"Предлог: «в, на, о» (место, время или тема).", pair:"Похоже: بِـ. С مَا: فِيمَا (список 8).", tip:"С окончаниями: فِيهِ (в нём), فِيهَا (в ней), فِيهِمْ (среди них). Все формы включены.", ex:"Это Писание, в котором нет сомнения."} } },
  { id:"ka", ar:"كَـ", nosearch:true, ex:{ref:"101:4", ar:"يَوْمَ يَكُونُ ٱلنَّاسُ كَٱلْفَرَاشِ ٱلْمَبْثُوثِ"},
    m:{de:"wie", en:"as, like", ru:"как"},
    info:{
     de:{gram:"Vorsilbe: „wie“. Ein Vergleich, das Nomen danach steht im Genitiv: كَٱلْفَرَاشِ (wie Motten).", pair:"Ähnlich: مِثْل (gleich wie), كَأَنَّ (als ob), كَمَا (so wie).", tip:"Als Vorsilbe kann die App كَـ nicht suchen. Achte beim Lesen auf Wörter wie كَٱلْجِبَالِ oder كَمَثَلِ.", ex:"Am Tag, da die Menschen wie verstreute Motten sein werden"},
     en:{gram:"Prefix: “like, as”. A comparison; the noun after it is in the genitive: كَٱلْفَرَاشِ (like moths).", pair:"Similar: مِثْل (like), كَأَنَّ (as if), كَمَا (just as).", tip:"As a prefix, the app can't search for كَـ. Watch for words like كَٱلْجِبَالِ or كَمَثَلِ while reading.", ex:"the Day when people will be like scattered moths"},
     ru:{gram:"Приставка: «как». Сравнение, имя после неё в родительном падеже: كَٱلْفَرَاشِ (как мотыльки).", pair:"Похоже: مِثْل (подобный), كَأَنَّ (как будто), كَمَا (так же как).", tip:"Как приставку приложение не может искать كَـ. Обращай внимание на слова вроде كَٱلْجِبَالِ или كَمَثَلِ.", ex:"в тот день люди будут подобны разлетевшимся мотылькам"} } },
  { id:"li", ar:"لِـ", q:"له|لها|لهم|لكم|لنا|لي|لك|لهما|لهن|لكما", vstart:["لَ","لِ"], ex:{ref:"2:255", ar:"لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ"},
    m:{de:"für, gehört zu", en:"for, belongs to", ru:"для, принадлежит"},
    info:{
     de:{gram:"Vorsilbe: „für, zu, gehört zu“. Mit Endung wird der Vokal meist zu a: لَهُ (ihm gehört), لَكُمْ (für euch).", pair:"Ähnlich: إِلَىٰ (zu … hin). Vor ٱللَّه wird es zu لِلَّهِ.", tip:"Gezählt werden die Formen mit Endung: لَهُ, لَهَا, لَهُمْ, لَكُمْ, لَنَا, لِي, لَكَ. Die Vorsilbe allein kann die App nicht suchen.", ex:"Ihm gehört, was in den Himmeln und was auf der Erde ist."},
     en:{gram:"Prefix: “for, to, belongs to”. With endings the vowel usually becomes a: لَهُ (belongs to Him), لَكُمْ (for you).", pair:"Similar: إِلَىٰ (towards). Before ٱللَّه it becomes لِلَّهِ.", tip:"The app counts the forms with endings: لَهُ, لَهَا, لَهُمْ, لَكُمْ, لَنَا, لِي, لَكَ. It can't search the prefix on its own.", ex:"To Him belongs whatever is in the heavens and whatever is on the earth."},
     ru:{gram:"Приставка: «для, к, принадлежит». С окончаниями гласная обычно становится a: لَهُ (Ему принадлежит), لَكُمْ (для вас).", pair:"Похоже: إِلَىٰ (к). Перед ٱللَّه превращается в لِلَّهِ.", tip:"Учитываются формы с окончаниями: لَهُ, لَهَا, لَهُمْ, لَكُمْ, لَنَا, لِي, لَكَ. Саму приставку приложение искать не может.", ex:"Ему принадлежит то, что на небесах, и то, что на земле."} } },
  { id:"min", ar:"مِنْ", q:"من|منه|منها|منهم|منكم|منا|مني|منك|منهما|منهن", vstart:"مِن", ex:{ref:"23:12", ar:"وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ مِن سُلَٰلَةٍ مِّن طِينٍ"},
    m:{de:"von, aus", en:"from, of", ru:"из, от"},
    info:{
     de:{gram:"Präposition: „von, aus“ (Herkunft, Teil von etwas, Material).", pair:"Gegenstück: إِلَىٰ (zu). Nicht verwechseln mit مَنْ (wer, Liste 3) mit Fatha.", tip:"Eines der häufigsten Wörter im Quran. Die App zeigt nur مِنْ mit Kasra, auch mit Endung: مِنْهُ, مِنْهُمْ, مِنَّا.", ex:"Und Wir haben ja den Menschen aus einem Auszug aus Lehm erschaffen."},
     en:{gram:"Preposition: “from, of” (origin, part of something, material).", pair:"Counterpart: إِلَىٰ (to). Don't confuse it with مَنْ (who, List 3), which has a fatha.", tip:"One of the most frequent words in the Quran. The app only shows مِنْ with a kasra, also with endings: مِنْهُ, مِنْهُمْ, مِنَّا.", ex:"And We certainly created man from an extract of clay."},
     ru:{gram:"Предлог: «из, от» (происхождение, часть чего-то, материал).", pair:"Пара: إِلَىٰ (к). Не путай с مَنْ (кто, список 3) с фатхой.", tip:"Одно из самых частых слов в Коране. Приложение показывает только مِنْ с кясрой, также с окончаниями: مِنْهُ, مِنْهُمْ, مِنَّا.", ex:"Мы сотворили человека из эссенции глины."} } },
  { id:"ila", ar:"إِلَىٰ", q:"إلى|إليه|إليها|إليهم|إليكم|إلينا|إلي|إليك|إليهما|إليهن", vstart:"إِلَ", ex:{ref:"2:156", ar:"إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ"},
    m:{de:"zu, hin zu", en:"to, towards", ru:"к, в сторону"},
    info:{
     de:{gram:"Präposition: „zu, nach, hin zu“ (Richtung und Ziel).", pair:"Gegenstück: مِنْ (von) und عَنْ (weg von).", tip:"Mit Endung wird ى zu ي: إِلَيْهِ (zu Ihm), إِلَيْكَ (zu dir). Bekannt: إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ.", ex:"Wir gehören Allah, und zu Ihm kehren wir zurück."},
     en:{gram:"Preposition: “to, towards” (direction and goal).", pair:"Counterpart: مِنْ (from) and عَنْ (away from).", tip:"With endings the ى becomes ي: إِلَيْهِ (to Him), إِلَيْكَ (to you). Well known: إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ.", ex:"Indeed we belong to Allah, and indeed to Him we will return."},
     ru:{gram:"Предлог: «к, в сторону» (направление и цель).", pair:"Пара: مِنْ (из) и عَنْ (от).", tip:"С окончаниями ى переходит в ي: إِلَيْهِ (к Нему), إِلَيْكَ (к тебе). Известно: إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ.", ex:"Воистину, мы принадлежим Аллаху, и к Нему мы вернёмся."} } },
  { id:"hatta", ar:"حَتَّىٰ", q:"حتى", ex:{ref:"97:5", ar:"سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"},
    m:{de:"bis, sodass", en:"until", ru:"пока не, до"},
    info:{
     de:{gram:"„bis, bis dass, sodass“. Vor Nomen wie eine Präposition, vor Verben ein Bindewort.", pair:"Ähnlich: إِلَىٰ (bis zu).", tip:"Endet auf ى, das wie ā klingt: ḥattā. Typisch: حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ (bis zum Anbruch der Morgendämmerung).", ex:"Frieden ist sie bis zum Anbruch der Morgendämmerung."},
     en:{gram:"“until, so that”. Before nouns it works like a preposition, before verbs as a conjunction.", pair:"Similar: إِلَىٰ (up to).", tip:"It ends in ى, pronounced ā: ḥattā. Typical: حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ (until the emergence of dawn).", ex:"Peace it is until the emergence of dawn."},
     ru:{gram:"«пока не, до, так что». Перед именем — как предлог, перед глаголом — союз.", pair:"Похоже: إِلَىٰ (до).", tip:"Оканчивается на ى, которое читается как ā: ḥattā. Типично: حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ (до наступления зари).", ex:"Она — мир до наступления зари."} } },
  { id:"alaa", ar:"عَلَىٰ", q:"على|عليه|عليها|عليهم|عليكم|علينا|علي|عليك|عليهما|عليهن", vstart:"عَلَ", ex:{ref:"1:7", ar:"صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ"},
    m:{de:"auf, über", en:"on, upon", ru:"на"},
    info:{
     de:{gram:"Präposition: „auf, über, gegen“. Auch Pflicht: عَلَيْكُمْ (euch ist auferlegt).", pair:"Gegenteil: تَحْتَ (unter). Ähnlich: فَوْقَ (über).", tip:"Mit Endung wird ى zu ي: عَلَيْهِ, عَلَيْهِمْ. Nicht verwechseln mit ٱلْعَلِيّ (der Erhabene). Die App zeigt nur عَلَىٰ.", ex:"den Weg derjenigen, denen Du Gunst erwiesen hast"},
     en:{gram:"Preposition: “on, upon, against”. Also obligation: عَلَيْكُمْ (it is prescribed for you).", pair:"Opposite: تَحْتَ (under). Similar: فَوْقَ (above).", tip:"With endings the ى becomes ي: عَلَيْهِ, عَلَيْهِمْ. Don't confuse it with ٱلْعَلِيّ (the Most High); the app only shows عَلَىٰ.", ex:"the path of those upon whom You have bestowed favour"},
     ru:{gram:"Предлог: «на, над, против». Также обязанность: عَلَيْكُمْ (вам предписано).", pair:"Противоположность: تَحْتَ (под). Похоже: فَوْقَ (над).", tip:"С окончаниями ى переходит в ي: عَلَيْهِ, عَلَيْهِمْ. Не путай с ٱلْعَلِيّ (Всевышний), приложение показывает только عَلَىٰ.", ex:"путём тех, кого Ты облагодетельствовал"} } },
  { id:"maa", ar:"مَعَ", q:"مع|معه|معها|معهم|معكم|معنا|معي|معك|معهما", vstart:"مَع", ex:{ref:"9:40", ar:"لَا تَحْزَنْ إِنَّ ٱللَّهَ مَعَنَا"},
    m:{de:"mit, zusammen mit", en:"with, together with", ru:"с, вместе с"},
    info:{
     de:{gram:"„mit, zusammen mit, bei“.", pair:"Ähnlich: بِـ (mit, als Mittel). مَعَ betont das Zusammensein.", tip:"Bekannt: إِنَّ ٱللَّهَ مَعَ ٱلصَّابِرِينَ (Allah ist mit den Standhaften) und إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا (mit der Erschwernis kommt Erleichterung).", ex:"Sei nicht traurig, Allah ist mit uns."},
     en:{gram:"“with, together with”.", pair:"Similar: بِـ (with, as a means). مَعَ stresses being together.", tip:"Well known: إِنَّ ٱللَّهَ مَعَ ٱلصَّابِرِينَ (Allah is with the patient) and إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا (with hardship comes ease).", ex:"Do not grieve; indeed Allah is with us."},
     ru:{gram:"«с, вместе с».", pair:"Похоже: بِـ (с, как средство). مَعَ подчёркивает совместность.", tip:"Известно: إِنَّ ٱللَّهَ مَعَ ٱلصَّابِرِينَ (Аллах с терпеливыми) и إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا (за тяготой следует облегчение).", ex:"Не печалься, ведь Аллах с нами."} } },
  { id:"wa", ar:"وَ", nosearch:true, ex:{ref:"103:1", ar:"وَٱلْعَصْرِ"},
    m:{de:"und; bei (Schwur)", en:"and; by (oath)", ru:"и; клянусь"},
    info:{
     de:{gram:"Vorsilbe mit zwei Aufgaben: „und“ (verbindet Wörter und Sätze) und „bei …!“ als Schwur. Dann steht das Nomen im Genitiv: وَٱلْعَصْرِ (bei der Zeit!).", pair:"Andere Bindewörter: فَـ (und dann), ثُمَّ (danach).", tip:"Das häufigste Wort im ganzen Quran. Als Vorsilbe kann die App es nicht suchen. Schwüre findest du vor allem am Anfang kurzer Suren.", ex:"Bei der Zeit!"},
     en:{gram:"Prefix with two jobs: “and” (joining words and sentences) and “by …!” as an oath. Then the noun is in the genitive: وَٱلْعَصْرِ (by time!).", pair:"Other conjunctions: فَـ (and then), ثُمَّ (after that).", tip:"The most frequent word in the whole Quran. As a prefix, the app can't search for it. Oaths appear mostly at the start of short surahs.", ex:"By time!"},
     ru:{gram:"Приставка с двумя функциями: «и» (соединяет слова и предложения) и «клянусь …!». Тогда имя в родительном падеже: وَٱلْعَصْرِ (клянусь временем!).", pair:"Другие союзы: فَـ (и тут), ثُمَّ (затем).", tip:"Самое частое слово во всём Коране. Как приставку приложение не может его искать. Клятвы встречаются в основном в начале коротких сур.", ex:"Клянусь временем!"} } },
 ]},
 { id:6, sub:{de:"Bindewörter und Zeitwörter", en:"Conjunctions and time words", ru:"Союзы и слова времени"}, words:[
  { id:"inna", ar:"إِنَّ", q:"إن|إنه|إنا|إنهم|إنكم|إني|إنك|إنها|إنني|إنهما|إننا|إنكن|إنهن", vstart:"إِنّ", ex:{ref:"2:153", ar:"إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ"},
    m:{de:"wahrlich, gewiss", en:"verily, truly", ru:"воистину"},
    info:{
     de:{gram:"Bekräftigung am Satzanfang: „wahrlich, gewiss“. Das Nomen danach steht im Akkusativ (-a): إِنَّ ٱللَّهَ.", pair:"Verwandt: أَنَّ (dass), gleiche Buchstaben, nur Kasra ↔ Fatha. Nicht verwechseln mit إِنْ (wenn) ohne Schadda.", tip:"Mit Endungen: إِنَّهُ, إِنَّا, إِنِّي … (alle mitgesucht). إِنَّمَا (nur) wird nicht mitgezählt.", ex:"Wahrlich, Allah ist mit den Standhaften."},
     en:{gram:"Emphasis at the start of a sentence: “indeed, truly”. The noun after it is in the accusative (-a): إِنَّ ٱللَّهَ.", pair:"Related: أَنَّ (that), same letters, only kasra ↔ fatha. Don't confuse it with إِنْ (if) without a shadda.", tip:"With endings: إِنَّهُ, إِنَّا, إِنِّي … (all included). إِنَّمَا (only) is not counted.", ex:"Indeed, Allah is with the patient."},
     ru:{gram:"Усиление в начале предложения: «воистину». Имя после него в винительном падеже (-a): إِنَّ ٱللَّهَ.", pair:"Родственное: أَنَّ (что), те же буквы, только кясра ↔ фатха. Не путай с إِنْ (если) без шадды.", tip:"С окончаниями: إِنَّهُ, إِنَّا, إِنِّي … (все включены). إِنَّمَا (лишь) не учитывается.", ex:"Воистину, Аллах — с терпеливыми."} } },
  { id:"anna2", ar:"أَنَّ", q:"أن|أنه|أنا|أنهم|أنكم|أني|أنك|أنها|أنني|أنهما|أننا|أنهن", vstart:"أَنّ", vexcl:["كَ","وَكَ","فَكَ"], vnot:["أَنَّى"], ex:{ref:"2:106", ar:"أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ"},
    m:{de:"dass (vor Nomen)", en:"that (before nouns)", ru:"что (перед именем)"},
    info:{
     de:{gram:"„dass“ vor einem Nominalsatz. Wie bei إِنَّ steht das Nomen danach im Akkusativ: أَنَّ ٱللَّهَ.", pair:"Vor Verben steht dagegen أَنْ (ohne Schadda). Am Satzanfang: إِنَّ.", tip:"Mit Endungen: أَنَّهُ, أَنَّا, أَنِّي … (mitgesucht). كَأَنَّ (als ob), أَنَّمَا und أَنَّىٰ werden nicht mitgezählt.", ex:"Weißt du nicht, dass Allah zu allem die Macht hat?"},
     en:{gram:"“that” before a nominal clause. As with إِنَّ, the noun after it is in the accusative: أَنَّ ٱللَّهَ.", pair:"Before verbs you use أَنْ (no shadda) instead. At the start of a sentence: إِنَّ.", tip:"With endings: أَنَّهُ, أَنَّا, أَنِّي … (included). كَأَنَّ (as if), أَنَّمَا and أَنَّىٰ are not counted.", ex:"Do you not know that Allah has power over all things?"},
     ru:{gram:"«что» перед именным предложением. Как и после إِنَّ, имя стоит в винительном падеже: أَنَّ ٱللَّهَ.", pair:"Перед глаголом — أَنْ (без шадды). В начале предложения — إِنَّ.", tip:"С окончаниями: أَنَّهُ, أَنَّا, أَنِّي … (включены). كَأَنَّ (как будто), أَنَّمَا и أَنَّىٰ не учитываются.", ex:"Разве ты не знаешь, что Аллах способен на всякую вещь?"} } },
  { id:"in-if", ar:"إِنْ", q:"إن", v:["إِنْ","إِنِ"], ex:{ref:"47:7", ar:"إِن تَنصُرُوا۟ ٱللَّهَ يَنصُرْكُمْ"},
    m:{de:"wenn, falls", en:"if", ru:"если"},
    info:{
     de:{gram:"Bedingung: „wenn, falls“. Das Verb danach steht oft im Jussiv: إِن تَنصُرُوا (wenn ihr helft).", pair:"Unwirkliche Bedingung: لَوْ (wenn … wäre). Mit Schwur: لَئِنْ.", tip:"Achtung: إِنْ kann auch verneinen („nicht“), wenn später إِلَّا folgt (Liste 2). Die Suche zeigt beide Bedeutungen.", ex:"Wenn ihr Allah helft, hilft Er euch."},
     en:{gram:"Condition: “if”. The verb after it is often in the jussive: إِن تَنصُرُوا (if you help).", pair:"Unreal condition: لَوْ (if … were). With an oath: لَئِنْ.", tip:"Note: إِنْ can also negate (“not”) when an إِلَّا follows (List 2). The search shows both meanings.", ex:"If you support Allah, He will support you."},
     ru:{gram:"Условие: «если». Глагол после него часто в джазме: إِن تَنصُرُوا (если вы поможете).", pair:"Нереальное условие: لَوْ (если бы). С клятвой: لَئِنْ.", tip:"Внимание: إِنْ может и отрицать («не»), если дальше идёт إِلَّا (список 2). Поиск показывает оба значения.", ex:"Если вы поможете Аллаху, то и Он поможет вам."} } },
  { id:"lain", ar:"لَئِنْ", q:"لئن", ex:{ref:"14:7", ar:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ"},
    m:{de:"wenn wirklich (mit Schwur)", en:"if (with an oath)", ru:"если же (с клятвой)"},
    info:{
     de:{gram:"Aus لَ (Bekräftigung wie beim Schwur) + إِنْ (wenn): „wenn wirklich …, dann ganz gewiss …“.", pair:"Einfache Bedingung: إِنْ. Die Antwort beginnt oft mit لَ und endet mit ـنَّ: لَأَزِيدَنَّكُمْ.", tip:"Klingt wie ein Schwur. Das ئ ist ein Hamza auf einem Ya-Träger: la-in.", ex:"Wenn ihr dankbar seid, werde Ich euch ganz gewiss noch mehr geben."},
     en:{gram:"From لَ (oath-like emphasis) + إِنْ (if): “if indeed …, then surely …”.", pair:"Plain condition: إِنْ. The answer often starts with لَ and ends in ـنَّ: لَأَزِيدَنَّكُمْ.", tip:"It sounds like an oath. The ئ is a hamza on a ya seat: la-in.", ex:"If you are grateful, I will surely give you more."},
     ru:{gram:"Из لَ (усиление, как в клятве) + إِنْ (если): «если же …, то непременно …».", pair:"Простое условие: إِنْ. Ответ часто начинается с لَ и оканчивается на ـنَّ: لَأَزِيدَنَّكُمْ.", tip:"Звучит как клятва. ئ — хамза на подставке йа: la-in.", ex:"Если вы будете благодарны, Я непременно дам вам ещё больше."} } },
  { id:"an", ar:"أَنْ", q:"أن", v:["أَنْ","أَنِ"], vexcl:["كَ","وَكَ","فَكَ"], ex:{ref:"2:184", ar:"وَأَن تَصُومُوا۟ خَيْرٌ لَّكُمْ"},
    m:{de:"dass, um zu (vor Verben)", en:"to, that (before verbs)", ru:"чтобы, что (перед глаголом)"},
    info:{
     de:{gram:"„dass, um zu“ vor einem Verb. Das Verb danach steht im Konjunktiv (Endung -a, das ن fällt oft weg).", pair:"Vor Nomen: أَنَّ (mit Schadda). Mit لَا zusammengezogen: أَلَّا (Liste 2).", tip:"Sehr häufig nach Verben wie أَرَادَ (wollen) oder أُمِرْتُ (mir wurde befohlen): أُمِرْتُ أَنْ أَعْبُدَ (mir wurde befohlen, zu dienen).", ex:"Und dass ihr fastet, ist besser für euch."},
     en:{gram:"“to, that” before a verb. The verb after it is in the subjunctive (ending -a, the ن often drops).", pair:"Before nouns: أَنَّ (with a shadda). Contracted with لَا: أَلَّا (List 2).", tip:"Very common after verbs like أَرَادَ (to want) or أُمِرْتُ (I was commanded): أُمِرْتُ أَنْ أَعْبُدَ (I was commanded to worship).", ex:"And to fast is better for you."},
     ru:{gram:"«чтобы, что» перед глаголом. Глагол после него в сослагательном наклонении (окончание -a, ن часто выпадает).", pair:"Перед именем: أَنَّ (с шаддой). Слитно с لَا: أَلَّا (список 2).", tip:"Очень часто после глаголов вроде أَرَادَ (хотеть) или أُمِرْتُ (мне велено): أُمِرْتُ أَنْ أَعْبُدَ (мне велено поклоняться).", ex:"Но поститься лучше для вас."} } },
  { id:"kaanna", ar:"كَأَنَّ", q:"كأن|كأنه|كأنها|كأنهم|كأنهن|كأنك|كأنما|كأنا", vstart:["كَأَنّ","كَأَن"], ex:{ref:"55:58", ar:"كَأَنَّهُنَّ ٱلْيَاقُوتُ وَٱلْمَرْجَانُ"},
    m:{de:"als ob", en:"as if", ru:"как будто"},
    info:{
     de:{gram:"Aus كَ (wie) + أَنَّ (dass): „als ob, als wären“. Das Nomen danach steht im Akkusativ.", pair:"Einfaches „wie“: كَ (an das Wort gehängt) oder مِثْل.", tip:"Mit Endungen: كَأَنَّهُ, كَأَنَّهُمْ, كَأَنَّهُنَّ, كَأَنَّمَا (mitgesucht). Typisch für Bilder und Vergleiche im Quran.", ex:"Als wären sie Rubine und Korallen."},
     en:{gram:"From كَ (like) + أَنَّ (that): “as if, as though”. The noun after it is in the accusative.", pair:"Simple “like”: كَ (attached to the word) or مِثْل.", tip:"With endings: كَأَنَّهُ, كَأَنَّهُمْ, كَأَنَّهُنَّ, كَأَنَّمَا (included). Typical of the Quran's images and comparisons.", ex:"As if they were rubies and coral."},
     ru:{gram:"Из كَ (как) + أَنَّ (что): «как будто, словно». Имя после него в винительном падеже.", pair:"Простое «как»: كَ (слитно) или مِثْل.", tip:"С окончаниями: كَأَنَّهُ, كَأَنَّهُمْ, كَأَنَّهُنَّ, كَأَنَّمَا (включены). Типично для образов и сравнений в Коране.", ex:"Они словно яхонт и кораллы."} } },
  { id:"lakin", ar:"لَٰكِنْ", q:"لكن|لكنه|لكنهم|لكنا|لكني|لكنكم", ex:{ref:"2:12", ar:"أَلَآ إِنَّهُمْ هُمُ ٱلْمُفْسِدُونَ وَلَٰكِن لَّا يَشْعُرُونَ"},
    m:{de:"aber, jedoch", en:"but", ru:"но, однако"},
    info:{
     de:{gram:"Gegensatz: „aber, jedoch“. Zwei Formen: لَٰكِنَّ (mit Schadda, danach Nomen im Akkusativ) und لَٰكِنْ (ohne Schadda).", pair:"Oft mit وَ: وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ (aber die meisten von ihnen wissen es nicht).", tip:"Das erste ā wird im Quran mit kleinem Alif geschrieben: لَٰكِنْ = lākin. Alle Formen sind mitgesucht.", ex:"Wahrlich, sie sind es, die Unheil stiften, aber sie merken es nicht."},
     en:{gram:"Contrast: “but, however”. Two forms: لَٰكِنَّ (with a shadda, followed by an accusative noun) and لَٰكِنْ (without a shadda).", pair:"Often with وَ: وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ (but most of them do not know).", tip:"In the Quran the first ā is written with a small alif: لَٰكِنْ = lākin. All forms are included in the search.", ex:"Truly, it is they who cause corruption, but they do not perceive it."},
     ru:{gram:"Противопоставление: «но, однако». Две формы: لَٰكِنَّ (с шаддой, затем имя в винительном падеже) и لَٰكِنْ (без шадды).", pair:"Часто с وَ: وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ (но большинство из них не знает).", tip:"В Коране первое ā пишется маленьким алифом: لَٰكِنْ = lākin. Все формы включены в поиск.", ex:"Воистину, именно они распространяют нечестие, но не осознают этого."} } },
  { id:"lamma", ar:"لَمَّا", q:"لما", v:"لَمَّا", ex:{ref:"7:143", ar:"وَلَمَّا جَآءَ مُوسَىٰ لِمِيقَٰتِنَا"},
    m:{de:"als, nachdem", en:"when, once", ru:"когда, после того как"},
    info:{
     de:{gram:"Zeitwort für ein einmaliges Ereignis in der Vergangenheit: „als, nachdem“. Danach steht meist ein Perfekt.", pair:"Ähnlich wie إِذْ (als). Nicht verwechseln mit لِمَا (für das, was) mit Kasra.", tip:"Häufig als فَلَمَّا (und als …) in Erzählungen. Mit Jussiv kann لَمَّا auch „noch nicht“ heißen.", ex:"Und als Musa zu Unserer festgesetzten Zeit kam"},
     en:{gram:"Time word for a one-off past event: “when, once”. Usually followed by a perfect verb.", pair:"Similar to إِذْ (when). Don't confuse it with لِمَا (for what), which has a kasra.", tip:"Common as فَلَمَّا (and when …) in stories. With the jussive, لَمَّا can also mean “not yet”.", ex:"And when Moses arrived at Our appointed time"},
     ru:{gram:"Слово времени для однократного события в прошлом: «когда, после того как». Обычно за ним глагол прошедшего времени.", pair:"Похоже на إِذْ (когда). Не путай с لِمَا (для того, что) с кясрой.", tip:"Часто как فَلَمَّا (и когда …) в рассказах. С джазмом لَمَّا может значить «ещё не».", ex:"Когда Муса пришёл в назначенное Нами время"} } },
  { id:"law", ar:"لَوْ", q:"لو", v:["لَوْ","لَوِ"], ex:{ref:"18:109", ar:"قُل لَّوْ كَانَ ٱلْبَحْرُ مِدَادًا لِّكَلِمَٰتِ رَبِّى لَنَفِدَ ٱلْبَحْرُ"},
    m:{de:"wenn (… wäre)", en:"if (unreal)", ru:"если бы"},
    info:{
     de:{gram:"Unwirkliche Bedingung: „wenn … wäre / hätte“. Die Antwort beginnt oft mit لَ: لَنَفِدَ (würde gewiss zu Ende gehen).", pair:"Wirkliche Bedingung: إِنْ. Verneint: لَوْلَا (wenn nicht).", tip:"وَلَوْ heißt oft „auch wenn, selbst wenn“.", ex:"Sag: Wenn das Meer Tinte für die Worte meines Herrn wäre, würde das Meer gewiss zu Ende gehen."},
     en:{gram:"Unreal condition: “if … were / had”. The answer often starts with لَ: لَنَفِدَ (would surely run out).", pair:"Real condition: إِنْ. Negative: لَوْلَا (if not for).", tip:"وَلَوْ often means “even if”.", ex:"Say: If the sea were ink for the words of my Lord, the sea would surely run out."},
     ru:{gram:"Нереальное условие: «если бы». Ответ часто начинается с لَ: لَنَفِدَ (непременно иссякло бы).", pair:"Реальное условие: إِنْ. Отрицательное: لَوْلَا (если бы не).", tip:"وَلَوْ часто значит «даже если».", ex:"Скажи: «Если бы море было чернилами для слов моего Господа, то море непременно иссякло бы»."} } },
  { id:"lawla", ar:"لَوْلَا", q:"لولا", ex:{ref:"24:21", ar:"وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ مَا زَكَىٰ مِنكُم مِّنْ أَحَدٍ أَبَدًا"},
    m:{de:"wenn nicht …; warum nicht", en:"but for; why not", ru:"если бы не; почему бы не"},
    info:{
     de:{gram:"Zwei Bedeutungen: vor einem Nomen „wenn nicht … gewesen wäre“, vor einem Verb „warum nicht?“.", pair:"Aus لَوْ (wenn) + لَا (nicht).", tip:"Typisch: وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ (und wäre nicht Allahs Huld über euch …).", ex:"Und wäre nicht Allahs Huld über euch und Seine Barmherzigkeit, keiner von euch wäre jemals rein geworden."},
     en:{gram:"Two meanings: before a noun “if not for …”, before a verb “why not?”.", pair:"From لَوْ (if) + لَا (not).", tip:"Typical: وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ (and if not for the favour of Allah upon you …).", ex:"And if not for the favour of Allah upon you and His mercy, not one of you would ever have been purified."},
     ru:{gram:"Два значения: перед именем «если бы не …», перед глаголом «почему бы не?».", pair:"Из لَوْ (если бы) + لَا (не).", tip:"Типично: وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ (если бы не милость Аллаха к вам …).", ex:"Если бы не милость Аллаха к вам и Его милосердие, никто из вас никогда бы не очистился."} } },
  { id:"qabl", ar:"قَبْل (مِنْ)", q:"قبل|قبله|قبلها|قبلهم|قبلكم|قبلك|قبلنا|قبلي", vstart:"قَبْل", ex:{ref:"2:183", ar:"كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ"},
    m:{de:"vor, vorher", en:"before", ru:"до, прежде"},
    info:{
     de:{gram:"Zeitangabe: „vor, vorher“. Oft mit مِنْ: مِن قَبْلُ (vorher), مِن قَبْلِكُمْ (vor euch).", pair:"Gegenteil: بَعْد (nach).", tip:"Steht kein Wort danach, endet es auf -u: مِن قَبْلُ. Nicht verwechseln mit قِبَل (Richtung, Seite) und قِبْلَة (Gebetsrichtung).", ex:"so wie es denjenigen vor euch vorgeschrieben war"},
     en:{gram:"Time word: “before, previously”. Often with مِنْ: مِن قَبْلُ (before), مِن قَبْلِكُمْ (before you).", pair:"Opposite: بَعْد (after).", tip:"When no word follows, it ends in -u: مِن قَبْلُ. Don't confuse it with قِبَل (side, direction) and قِبْلَة (prayer direction).", ex:"as it was prescribed for those before you"},
     ru:{gram:"Слово времени: «до, прежде». Часто с مِنْ: مِن قَبْلُ (прежде), مِن قَبْلِكُمْ (до вас).", pair:"Противоположность: بَعْد (после).", tip:"Если за ним нет слова, оно оканчивается на -u: مِن قَبْلُ. Не путай с قِبَل (сторона) и قِبْلَة (кибла).", ex:"как оно было предписано тем, кто был до вас"} } },
  { id:"bad", ar:"بَعْد (مِنْ)", q:"بعد|بعده|بعدها|بعدهم|بعدكم|بعدك|بعدي|بعدنا|بعدما", vstart:"بَعْد", ex:{ref:"2:52", ar:"ثُمَّ عَفَوْنَا عَنكُم مِّنۢ بَعْدِ ذَٰلِكَ"},
    m:{de:"nach, danach", en:"after", ru:"после"},
    info:{
     de:{gram:"Zeitangabe: „nach, danach“. Oft mit مِنْ: مِن بَعْدِ ذَٰلِكَ (nach diesem).", pair:"Gegenteil: قَبْل (vor).", tip:"Ohne folgendes Wort: مِن بَعْدُ (danach). بَعْدَمَا heißt „nachdem“ und ist mitgesucht.", ex:"Dann vergaben Wir euch nach alledem."},
     en:{gram:"Time word: “after, afterwards”. Often with مِنْ: مِن بَعْدِ ذَٰلِكَ (after that).", pair:"Opposite: قَبْل (before).", tip:"Without a following word: مِن بَعْدُ (afterwards). بَعْدَمَا means “after (something happened)” and is included.", ex:"Then We forgave you after that."},
     ru:{gram:"Слово времени: «после, затем». Часто с مِنْ: مِن بَعْدِ ذَٰلِكَ (после этого).", pair:"Противоположность: قَبْل (до).", tip:"Без следующего слова: مِن بَعْدُ (впоследствии). بَعْدَمَا значит «после того как» и включено в поиск.", ex:"Потом Мы простили вас после этого."} } },
  { id:"idh", ar:"إِذْ", q:"إذ", v:["إِذْ","إِذِ"], ex:{ref:"2:30", ar:"وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ"},
    m:{de:"als, damals (Vergangenheit)", en:"when (past)", ru:"когда (в прошлом)"},
    info:{
     de:{gram:"Zeitwort für die Vergangenheit: „als, damals als“. Leitet oft eine Erzählung ein: وَإِذْ (und [gedenke,] als …).", pair:"Für die Zukunft: إِذَا (wenn). Ähnlich: لَمَّا (als).", tip:"Vor einem Wort mit Wasla wird es zu إِذِ. Beide Formen sind mitgesucht.", ex:"Und als dein Herr zu den Engeln sagte …"},
     en:{gram:"Time word for the past: “when, at the time when”. Often opens a story: وَإِذْ (and [remember] when …).", pair:"For the future: إِذَا (when). Similar: لَمَّا (when).", tip:"Before a word with wasla it becomes إِذِ. Both forms are included.", ex:"And when your Lord said to the angels …"},
     ru:{gram:"Слово времени для прошлого: «когда, вот». Часто начинает рассказ: وَإِذْ (и [вспомни,] как …).", pair:"Для будущего: إِذَا (когда). Похоже: لَمَّا (когда).", tip:"Перед словом с васлей становится إِذِ. Обе формы включены.", ex:"Вот сказал твой Господь ангелам …"} } },
  { id:"idha", ar:"إِذَا", q:"إذا", v:"إِذَا", ex:{ref:"110:1", ar:"إِذَا جَآءَ نَصْرُ ٱللَّهِ وَٱلْفَتْحُ"},
    m:{de:"wenn (Zukunft)", en:"when (future)", ru:"когда (в будущем)"},
    info:{
     de:{gram:"Zeitwort für die Zukunft: „wenn (dann)“. Danach steht oft ein Perfekt, die Bedeutung ist aber Zukunft.", pair:"Für die Vergangenheit: إِذْ (als). Nicht verwechseln mit إِذًا (dann, also) mit Tanwin.", tip:"Typisch für die Beschreibung des Jüngsten Tages: إِذَا ٱلشَّمْسُ كُوِّرَتْ (wenn die Sonne zusammengerollt wird).", ex:"Wenn die Hilfe Allahs kommt und der Sieg"},
     en:{gram:"Time word for the future: “when”. Often followed by a perfect verb, but the meaning is future.", pair:"For the past: إِذْ (when). Don't confuse it with إِذًا (then, so), which has tanwin.", tip:"Typical of descriptions of the Last Day: إِذَا ٱلشَّمْسُ كُوِّرَتْ (when the sun is wrapped up).", ex:"When the help of Allah comes, and the victory"},
     ru:{gram:"Слово времени для будущего: «когда». Часто за ним глагол прошедшего времени, но смысл — будущий.", pair:"Для прошлого: إِذْ (когда). Не путай с إِذًا (тогда, значит) с танвином.", tip:"Типично для описания Судного дня: إِذَا ٱلشَّمْسُ كُوِّرَتْ (когда солнце будет скручено).", ex:"Когда придёт помощь Аллаха и победа"} } },
  { id:"thumma", ar:"ثُمَّ", q:"ثم", v:"ثُمَّ", ex:{ref:"2:28", ar:"ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ"},
    m:{de:"dann, danach", en:"then, later", ru:"затем, потом"},
    info:{
     de:{gram:"Reihenfolge mit Abstand: „dann, danach, später“.", pair:"Direkt danach oder als Folge: فَـ. Nicht verwechseln mit ثَمَّ (dort) mit Fatha.", tip:"ثُمَّ betont oft auch eine Steigerung: „und obendrein“.", ex:"dann lässt Er euch sterben, dann macht Er euch wieder lebendig, dann werdet ihr zu Ihm zurückgebracht"},
     en:{gram:"Sequence with a gap: “then, after that, later”.", pair:"Immediately after or as a result: فَـ. Don't confuse it with ثَمَّ (there), which has a fatha.", tip:"ثُمَّ often also marks an escalation: “and on top of that”.", ex:"then He will cause you to die, then bring you to life, then to Him you will be returned"},
     ru:{gram:"Последовательность с промежутком: «затем, потом, позже».", pair:"Сразу после или как следствие: فَـ. Не путай с ثَمَّ (там) с фатхой.", tip:"ثُمَّ часто подчёркивает и нарастание: «и более того».", ex:"потом Он умертвит вас, потом оживит, потом к Нему вы будете возвращены"} } },
  { id:"fa", ar:"فَـ", nosearch:true, ex:{ref:"94:5", ar:"فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا"},
    m:{de:"und dann (sofort), also", en:"then (directly), so", ru:"и тут же, поэтому"},
    info:{
     de:{gram:"Vorsilbe, die an das nächste Wort gehängt wird: „und dann (sofort)“, „also, deshalb“, auch „denn“.", pair:"Mit zeitlichem Abstand: ثُمَّ. Einfach „und“: وَ.", tip:"Kein eigenes Wort, deshalb kann die App es nicht suchen. Achte beim Lesen auf Wörter wie فَلَمَّا, فَإِنَّ, فَٱتَّقُوا.", ex:"Denn wahrlich, mit der Erschwernis kommt Erleichterung."},
     en:{gram:"Prefix attached to the next word: “and then (immediately)”, “so, therefore”, also “for”.", pair:"With a time gap: ثُمَّ. Simply “and”: وَ.", tip:"It is not a separate word, so the app can't search for it. Watch for words like فَلَمَّا, فَإِنَّ, فَٱتَّقُوا while reading.", ex:"For indeed, with hardship comes ease."},
     ru:{gram:"Приставка, присоединяется к следующему слову: «и тут же», «поэтому», также «ведь».", pair:"С промежутком во времени: ثُمَّ. Просто «и»: وَ.", tip:"Это не отдельное слово, поэтому приложение не может его искать. Обращай внимание на слова вроде فَلَمَّا, فَإِنَّ, فَٱتَّقُوا.", ex:"Воистину, за тяготой следует облегчение."} } },
 ]},
 { id:7, sub:{de:"Besitz, Vergleich und kleine Wörter", en:"Possession, comparison and small words", ru:"Принадлежность, сравнение и служебные слова"}, words:[
  { id:"dhu", ar:"ذُو", q:"ذو", v:"ذُو", ex:{ref:"2:105", ar:"وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ"},
    m:{de:"Besitzer von (Nominativ)", en:"owner of (nominative)", ru:"обладатель (им. п.)"},
    info:{
     de:{gram:"„Besitzer von, versehen mit“ im Nominativ (Fall des Subjekts). Steht immer vor einem anderen Wort: ذُو ٱلْفَضْلِ (Besitzer der Huld).", pair:"Gleiches Wort in anderen Fällen: ذَا (Akkusativ), ذِي (Genitiv). Feminin: ذَات.", tip:"Merke die Endvokale: ذُو -u, ذَا -a, ذِي -i, wie bei أَبُو / أَبَا / أَبِي.", ex:"Und Allah besitzt große Huld."},
     en:{gram:"“Owner of, possessing” in the nominative (subject case). It always comes before another word: ذُو ٱلْفَضْلِ (possessor of bounty).", pair:"Same word in the other cases: ذَا (accusative), ذِي (genitive). Feminine: ذَات.", tip:"Note the final vowels: ذُو -u, ذَا -a, ذِي -i, just like أَبُو / أَبَا / أَبِي.", ex:"And Allah is the possessor of great bounty."},
     ru:{gram:"«Обладатель, имеющий» в именительном падеже (падеж подлежащего). Всегда стоит перед другим словом: ذُو ٱلْفَضْلِ (обладатель милости).", pair:"То же слово в других падежах: ذَا (винительный), ذِي (родительный). Женский род: ذَات.", tip:"Запомни конечные гласные: ذُو -u, ذَا -a, ذِي -i, как у أَبُو / أَبَا / أَبِي.", ex:"Аллах обладает великой милостью."} } },
  { id:"dha", ar:"ذَا", q:"ذا", v:"ذَا", ex:{ref:"17:26", ar:"وَءَاتِ ذَا ٱلْقُرْبَىٰ حَقَّهُۥ"},
    m:{de:"Besitzer von (Akkusativ)", en:"owner of (accusative)", ru:"обладатель (вин. п.)"},
    info:{
     de:{gram:"„Besitzer von“ im Akkusativ (Fall des Objekts): وَآتِ ذَا ٱلْقُرْبَىٰ (und gib dem Verwandten).", pair:"Nominativ: ذُو, Genitiv: ذِي.", tip:"Achtung: ذَا bedeutet auch „dieser“, z. B. in مَن ذَا (wer ist es …?). Die Suche zeigt beide Bedeutungen.", ex:"Und gib dem Verwandten sein Recht."},
     en:{gram:"“Owner of” in the accusative (object case): وَآتِ ذَا ٱلْقُرْبَىٰ (and give the relative).", pair:"Nominative: ذُو, genitive: ذِي.", tip:"Note: ذَا also means “this”, e.g. in مَن ذَا (who is it …?). The search shows both meanings.", ex:"And give the relative his due."},
     ru:{gram:"«Обладатель» в винительном падеже (падеж дополнения): وَآتِ ذَا ٱلْقُرْبَىٰ (отдавай родственнику).", pair:"Именительный: ذُو, родительный: ذِي.", tip:"Внимание: ذَا значит также «этот», например в مَن ذَا (кто это …?). Поиск показывает оба значения.", ex:"Отдавай должное родственнику."} } },
  { id:"dhi", ar:"ذِي", q:"ذي", v:"ذِي", ex:{ref:"55:78", ar:"تَبَٰرَكَ ٱسْمُ رَبِّكَ ذِى ٱلْجَلَٰلِ وَٱلْإِكْرَامِ"},
    m:{de:"Besitzer von (Genitiv)", en:"owner of (genitive)", ru:"обладатель (род. п.)"},
    info:{
     de:{gram:"„Besitzer von“ im Genitiv, z. B. nach einer Präposition oder als Beiname: رَبِّكَ ذِي ٱلْجَلَالِ (deines Herrn, des Besitzers der Erhabenheit).", pair:"Nominativ: ذُو, Akkusativ: ذَا.", tip:"Nicht verwechseln mit ٱلَّذِي (der, welcher, Liste 1). Die App zeigt nur ذِي allein.", ex:"Segensreich ist der Name deines Herrn, des Besitzers der Erhabenheit und Ehre."},
     en:{gram:"“Owner of” in the genitive, e.g. after a preposition or as an epithet: رَبِّكَ ذِي ٱلْجَلَالِ (your Lord, Owner of Majesty).", pair:"Nominative: ذُو, accusative: ذَا.", tip:"Don't confuse it with ٱلَّذِي (who, which; List 1). The app only shows ذِي on its own.", ex:"Blessed is the name of your Lord, Owner of Majesty and Honour."},
     ru:{gram:"«Обладатель» в родительном падеже, например после предлога или как эпитет: رَبِّكَ ذِي ٱلْجَلَالِ (твоего Господа, Обладателя величия).", pair:"Именительный: ذُو, винительный: ذَا.", tip:"Не путай с ٱلَّذِي (который, список 1). Приложение показывает только отдельное ذِي.", ex:"Благословенно имя твоего Господа, Обладателя величия и почёта."} } },
  { id:"dhat", ar:"ذَات", q:"ذات", ex:{ref:"85:1", ar:"وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ"},
    m:{de:"Besitzerin von (f.)", en:"owner of, having (f.)", ru:"обладательница (ж. р.)"},
    info:{
     de:{gram:"Feminine Form: „Besitzerin von, versehen mit“: ذَاتِ ٱلْبُرُوجِ (mit den Türmen).", pair:"Maskulin: ذُو / ذَا / ذِي.", tip:"Feste Wendungen: بِذَاتِ ٱلصُّدُورِ (was in den Brüsten ist) und ذَاتَ بَيْنِكُمْ (die Beziehungen untereinander).", ex:"Beim Himmel mit den Türmen (der Sternbilder)"},
     en:{gram:"Feminine form: “owner of, having”: ذَاتِ ٱلْبُرُوجِ (with the great stars).", pair:"Masculine: ذُو / ذَا / ذِي.", tip:"Fixed phrases: بِذَاتِ ٱلصُّدُورِ (what is in the breasts) and ذَاتَ بَيْنِكُمْ (relations among you).", ex:"By the sky with its constellations"},
     ru:{gram:"Женская форма: «обладающая, имеющая»: ذَاتِ ٱلْبُرُوجِ (с созвездиями).", pair:"Мужской род: ذُو / ذَا / ذِي.", tip:"Устойчивые обороты: بِذَاتِ ٱلصُّدُورِ (то, что в груди) и ذَاتَ بَيْنِكُمْ (отношения между вами).", ex:"Клянусь небом с созвездиями"} } },
  { id:"ulu", ar:"أُولُو", q:"أولو|أولوا", v:["أُولُو","أُولُوا"], ex:{ref:"2:269", ar:"وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ"},
    m:{de:"Leute von (Plural, Nominativ)", en:"people of (plural, nominative)", ru:"обладающие (мн. ч., им. п.)"},
    info:{
     de:{gram:"Plural von ذُو im Nominativ: „Leute von, Besitzer von“: أُولُو ٱلْأَلْبَابِ (die Verständigen).", pair:"Akkusativ/Genitiv: أُولِي.", tip:"Das و nach أ wird nicht gesprochen: ulū. Das Alif am Ende ist stumm.", ex:"Doch nur diejenigen bedenken es, die Verstand besitzen."},
     en:{gram:"Plural of ذُو in the nominative: “people of, possessors of”: أُولُو ٱلْأَلْبَابِ (people of understanding).", pair:"Accusative/genitive: أُولِي.", tip:"The و after أ is not pronounced: ulū. The final alif is silent.", ex:"And none will remember except people of understanding."},
     ru:{gram:"Мн. ч. от ذُو в именительном падеже: «обладающие»: أُولُو ٱلْأَلْبَابِ (обладающие разумом).", pair:"Винительный/родительный: أُولِي.", tip:"Буква و после أ не произносится: ulū. Конечный алиф немой.", ex:"Но поминают назидание только обладающие разумом."} } },
  { id:"uli", ar:"أُولِي", q:"أولي", v:"أُولِي", ex:{ref:"3:190", ar:"لَءَايَٰتٍ لِّأُو۟لِى ٱلْأَلْبَٰبِ"},
    m:{de:"Leute von (Plural, Akk./Gen.)", en:"people of (plural, acc./gen.)", ru:"обладающие (мн. ч., вин./род. п.)"},
    info:{
     de:{gram:"Plural von ذُو im Akkusativ und Genitiv: لِأُولِي ٱلْأَلْبَابِ (für die Verständigen).", pair:"Nominativ: أُولُو.", tip:"Nicht verwechseln mit أَوْلَىٰ (näher, würdiger) und أُولَىٰ (die erste). Die App zeigt nur أُولِي.", ex:"sind wahrlich Zeichen für diejenigen, die Verstand besitzen"},
     en:{gram:"Plural of ذُو in the accusative and genitive: لِأُولِي ٱلْأَلْبَابِ (for people of understanding).", pair:"Nominative: أُولُو.", tip:"Don't confuse it with أَوْلَىٰ (closer, more worthy) and أُولَىٰ (first). The app only shows أُولِي.", ex:"are signs for people of understanding"},
     ru:{gram:"Мн. ч. от ذُو в винительном и родительном падеже: لِأُولِي ٱلْأَلْبَابِ (для обладающих разумом).", pair:"Именительный: أُولُو.", tip:"Не путай с أَوْلَىٰ (ближе, достойнее) и أُولَىٰ (первая). Приложение показывает только أُولِي.", ex:"знамения для обладающих разумом"} } },
  { id:"ahl", ar:"أَهْل", q:"أهل|أهله|أهلها|أهلهم|أهلكم|أهلك|أهلي|أهلنا|أهليكم|أهليهم", vstart:"أَهْل", ex:{ref:"3:64", ar:"قُلْ يَٰٓأَهْلَ ٱلْكِتَٰبِ تَعَالَوْا۟ إِلَىٰ كَلِمَةٍ سَوَآءٍۭ بَيْنَنَا وَبَيْنَكُمْ"},
    m:{de:"Leute, Familie von", en:"people, family of", ru:"люди, семья"},
    info:{
     de:{gram:"„Leute, Angehörige, Familie von“. Sehr häufig in festen Ausdrücken.", pair:"Ähnlich: آل (Sippe, Haus). أَهْل ist allgemeiner.", tip:"Bekannt: أَهْلُ ٱلْكِتَابِ (Leute der Schrift), أَهْلُ ٱلْقُرَىٰ (Bewohner der Städte). Formen mit Endung (أَهْلَهُ, أَهْلِيكُمْ …) sind mitgesucht.", ex:"Sag: O Leute der Schrift, kommt zu einem Wort, das gleich ist zwischen uns und euch."},
     en:{gram:"“People, members, family of”. Very common in fixed expressions.", pair:"Similar: آل (clan, house). أَهْل is more general.", tip:"Well known: أَهْلُ ٱلْكِتَابِ (People of the Book), أَهْلُ ٱلْقُرَىٰ (people of the towns). Forms with endings (أَهْلَهُ, أَهْلِيكُمْ …) are included.", ex:"Say: O People of the Book, come to a word that is equal between us and you."},
     ru:{gram:"«Люди, семья, жители». Очень часто в устойчивых выражениях.", pair:"Похоже: آل (род, дом). أَهْل — более общее слово.", tip:"Известно: أَهْلُ ٱلْكِتَابِ (люди Писания), أَهْلُ ٱلْقُرَىٰ (жители селений). Формы с окончаниями (أَهْلَهُ, أَهْلِيكُمْ …) включены.", ex:"Скажи: «О люди Писания! Давайте придём к единому слову для нас и для вас»."} } },
  { id:"aal", ar:"آل", q:"آل", v:["آلَ","آلِ","آلُ"], ex:{ref:"3:33", ar:"إِنَّ ٱللَّهَ ٱصْطَفَىٰٓ ءَادَمَ وَنُوحًا وَءَالَ إِبْرَٰهِيمَ وَءَالَ عِمْرَٰنَ عَلَى ٱلْعَٰلَمِينَ"},
    m:{de:"Sippe, Haus von", en:"family, house of", ru:"род, семейство"},
    info:{
     de:{gram:"„Sippe, Haus, Gefolgsleute von“. Steht fast nur vor Namen bekannter Personen.", pair:"Allgemeiner: أَهْل.", tip:"Bekannt: آلُ فِرْعَوْنَ (die Leute Pharaos), آلُ إِبْرَاهِيمَ, آلُ عِمْرَانَ. Das آ ist ein langes ā mit Hamza: āl.", ex:"Allah hat Adam, Nuh, die Sippe Ibrahims und die Sippe Imrans vor den Weltenbewohnern auserwählt."},
     en:{gram:"“Clan, house, followers of”. Almost always before the name of a well-known person.", pair:"More general: أَهْل.", tip:"Well known: آلُ فِرْعَوْنَ (Pharaoh's people), آلُ إِبْرَاهِيمَ, آلُ عِمْرَانَ. The آ is a long ā with hamza: āl.", ex:"Indeed, Allah chose Adam and Noah and the family of Abraham and the family of Imran over the worlds."},
     ru:{gram:"«Род, дом, приближённые». Почти всегда перед именем известного человека.", pair:"Более общее: أَهْل.", tip:"Известно: آلُ فِرْعَوْنَ (люди Фараона), آلُ إِبْرَاهِيمَ, آلُ عِمْرَانَ. آ — долгое ā с хамзой: āl.", ex:"Воистину, Аллах избрал Адама, Нуха, род Ибрахима и род Имрана над мирами."} } },
  { id:"ala", ar:"أَلَا", q:"ألا", v:"أَلَا", ex:{ref:"13:28", ar:"أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ"},
    m:{de:"wahrlich!; … etwa nicht?", en:"lo!; will … not?", ru:"о да!; разве не?"},
    info:{
     de:{gram:"Zwei Bedeutungen: Aufmerksamkeit „wahrlich! seht!“ am Satzanfang, oder Frage „… etwa nicht?“.", pair:"Nicht verwechseln mit أَلَّا (dass nicht) und إِلَّا (außer), beide mit Schadda.", tip:"Oft vor إِنَّ: أَلَا إِنَّ أَوْلِيَاءَ ٱللَّهِ … (Wahrlich, die Schützlinge Allahs …).", ex:"Wahrlich, im Gedenken Allahs finden die Herzen Ruhe."},
     en:{gram:"Two uses: drawing attention, “Lo! Indeed!” at the start of a sentence, or a question “will … not?”.", pair:"Don't confuse it with أَلَّا (that … not) and إِلَّا (except), both with a shadda.", tip:"Often before إِنَّ: أَلَا إِنَّ أَوْلِيَاءَ ٱللَّهِ … (Unquestionably, the allies of Allah …).", ex:"Unquestionably, by the remembrance of Allah hearts find rest."},
     ru:{gram:"Два употребления: привлечение внимания «о да! воистину!» в начале предложения или вопрос «разве не …?».", pair:"Не путай с أَلَّا (чтобы не) и إِلَّا (кроме), оба с шаддой.", tip:"Часто перед إِنَّ: أَلَا إِنَّ أَوْلِيَاءَ ٱللَّهِ … (Воистину, угодники Аллаха …).", ex:"Воистину, при поминании Аллаха успокаиваются сердца."} } },
  { id:"nima", ar:"نِعْمَ", q:"نعم|نعما", v:["نِعْمَ","نِعِمَّا"], ex:{ref:"8:40", ar:"نِعْمَ ٱلْمَوْلَىٰ وَنِعْمَ ٱلنَّصِيرُ"},
    m:{de:"wie vortrefflich ist …!", en:"what an excellent …!", ru:"как прекрасен …!"},
    info:{
     de:{gram:"Lobverb: „wie vortrefflich ist …!“. Wird nicht konjugiert.", pair:"Gegenteil: بِئْسَ (wie schlimm).", tip:"Nicht verwechseln mit نِعْمَة (Gnade) und نَعَمْ (ja, Liste 2). Die Form نِعِمَّا (wie gut ist das, was …) ist mitgesucht.", ex:"Welch vortrefflicher Schutzherr und welch vortrefflicher Helfer!"},
     en:{gram:"Verb of praise: “how excellent is …!”. It is not conjugated.", pair:"Opposite: بِئْسَ (how evil).", tip:"Don't confuse it with نِعْمَة (blessing) and نَعَمْ (yes, List 2). The form نِعِمَّا (how good is what …) is included.", ex:"An excellent Protector and an excellent Helper!"},
     ru:{gram:"Глагол похвалы: «как прекрасен …!». Не спрягается.", pair:"Противоположность: بِئْسَ (как скверен).", tip:"Не путай с نِعْمَة (милость) и نَعَمْ (да, список 2). Форма نِعِمَّا (как хорошо то, что …) включена.", ex:"Как прекрасен этот Покровитель и как прекрасен этот Помощник!"} } },
  { id:"bisa", ar:"بِئْسَ", q:"بئس|بئسما", ex:{ref:"2:206", ar:"فَحَسْبُهُۥ جَهَنَّمُ ۚ وَلَبِئْسَ ٱلْمِهَادُ"},
    m:{de:"wie schlimm ist …!", en:"what an evil …!", ru:"как скверен …!"},
    info:{
     de:{gram:"Tadelverb: „wie schlimm ist …!“. Wird nicht konjugiert.", pair:"Gegenteil: نِعْمَ (wie vortrefflich).", tip:"Oft über die Hölle: وَبِئْسَ ٱلْمَصِيرُ (welch schlimmes Ende!). بِئْسَمَا (wie schlimm ist das, was …) ist mitgesucht.", ex:"Ihm genügt die Hölle, und wahrlich, welch schlimme Lagerstatt!"},
     en:{gram:"Verb of blame: “how evil is …!”. It is not conjugated.", pair:"Opposite: نِعْمَ (how excellent).", tip:"Often about Hell: وَبِئْسَ ٱلْمَصِيرُ (what an evil destination!). بِئْسَمَا (how evil is what …) is included.", ex:"Hell is sufficient for him, and how wretched a resting place it is!"},
     ru:{gram:"Глагол порицания: «как скверен …!». Не спрягается.", pair:"Противоположность: نِعْمَ (как прекрасен).", tip:"Часто о Геенне: وَبِئْسَ ٱلْمَصِيرُ (как скверно это пристанище!). بِئْسَمَا (как скверно то, что …) включено.", ex:"Достаточно для него Геенны! Как же скверно это ложе!"} } },
  { id:"mithl", ar:"مِثْل", q:"مثل|مثله|مثلها|مثلهم|مثلكم|مثلنا", vstart:"مِثْل", ex:{ref:"18:110", ar:"قُلْ إِنَّمَآ أَنَا۠ بَشَرٌ مِّثْلُكُمْ"},
    m:{de:"gleich wie, ähnlich", en:"like, the like of", ru:"подобный, как"},
    info:{
     de:{gram:"„gleich, wie, das Gleiche wie“ (mit Kasra und Sukun: mithl). Plural: أَمْثَال.", pair:"Nicht verwechseln mit مَثَل (Gleichnis) mit zwei Fatha.", tip:"Bekannt: لَيْسَ كَمِثْلِهِ شَيْءٌ (Nichts ist Ihm gleich) und بَشَرٌ مِّثْلُكُمْ (ein Mensch wie ihr).", ex:"Sag: Ich bin nur ein Mensch wie ihr."},
     en:{gram:"“like, similar, the like of” (kasra and sukun: mithl). Plural: أَمْثَال.", pair:"Don't confuse it with مَثَل (parable), which has two fathas.", tip:"Well known: لَيْسَ كَمِثْلِهِ شَيْءٌ (There is nothing like Him) and بَشَرٌ مِّثْلُكُمْ (a human like you).", ex:"Say: I am only a human being like you."},
     ru:{gram:"«подобный, как, такой же» (кясра и сукун: mithl). Мн. ч.: أَمْثَال.", pair:"Не путай с مَثَل (притча) с двумя фатхами.", tip:"Известно: لَيْسَ كَمِثْلِهِ شَيْءٌ (Нет ничего подобного Ему) и بَشَرٌ مِّثْلُكُمْ (человек, как вы).", ex:"Скажи: «Воистину, я — такой же человек, как и вы»."} } },
  { id:"mathal", ar:"مَثَل", q:"مثل|مثلهم|مثله|مثلا|مثلكم", vstart:"مَثَل", ex:{ref:"24:35", ar:"مَثَلُ نُورِهِۦ كَمِشْكَوٰةٍ فِيهَا مِصْبَاحٌ"},
    m:{de:"Gleichnis, Beispiel", en:"example, parable", ru:"притча, пример"},
    info:{
     de:{gram:"„Gleichnis, Beispiel“ (mit zwei Fatha: mathal). Plural: أَمْثَال.", pair:"Nicht verwechseln mit مِثْل (gleich wie).", tip:"Der Quran erklärt vieles in Gleichnissen: ضَرَبَ ٱللَّهُ مَثَلًا (Allah hat ein Gleichnis angeführt).", ex:"Das Gleichnis Seines Lichts ist wie eine Nische, in der eine Lampe ist."},
     en:{gram:"“parable, example” (two fathas: mathal). Plural: أَمْثَال.", pair:"Don't confuse it with مِثْل (like).", tip:"The Quran explains much through parables: ضَرَبَ ٱللَّهُ مَثَلًا (Allah has presented an example).", ex:"The example of His light is like a niche within which is a lamp."},
     ru:{gram:"«притча, пример» (две фатхи: mathal). Мн. ч.: أَمْثَال.", pair:"Не путай с مِثْل (подобный).", tip:"Коран многое объясняет притчами: ضَرَبَ ٱللَّهُ مَثَلًا (Аллах привёл притчу).", ex:"Его свет подобен нише, в которой находится светильник."} } },
  { id:"aw", ar:"أَوْ", q:"أو", v:["أَوْ","أَوِ"], ex:{ref:"2:74", ar:"فَهِىَ كَٱلْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً"},
    m:{de:"oder", en:"or", ru:"или"},
    info:{
     de:{gram:"„oder“ bei Aufzählungen und Möglichkeiten.", pair:"In Entweder-oder-Fragen: أَمْ.", tip:"Nicht verwechseln mit أَوَ (und … etwa?), das ist أَ + وَ am nächsten Wort.", ex:"Sie sind wie Steine oder noch härter."},
     en:{gram:"“or” in lists and alternatives.", pair:"In either-or questions: أَمْ.", tip:"Don't confuse it with أَوَ (and … ?), which is أَ + وَ attached to the next word.", ex:"They became like stones or even harder."},
     ru:{gram:"«или» при перечислении и выборе.", pair:"В вопросах «или … или»: أَمْ.", tip:"Не путай с أَوَ (разве и …?) — это أَ + وَ, слитно со следующим словом.", ex:"Они подобны камням или ещё твёрже."} } },
  { id:"am", ar:"أَمْ", q:"أم", v:["أَمْ","أَمِ"], ex:{ref:"2:6", ar:"سَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ"},
    m:{de:"oder (in Fragen)", en:"or (in questions)", ru:"или (в вопросе)"},
    info:{
     de:{gram:"„oder“ in Fragen, oft nach أَ: أَ … أَمْ … (… oder …?). Allein kann es „oder etwa?“ bedeuten.", pair:"Normales „oder“: أَوْ.", tip:"Nicht verwechseln mit أُمّ (Mutter). Die App zeigt nur أَمْ.", ex:"Es ist ihnen gleich, ob du sie warnst oder nicht warnst, sie glauben nicht."},
     en:{gram:"“or” in questions, often after أَ: أَ … أَمْ … (… or …?). On its own it can mean “or is it that?”.", pair:"Ordinary “or”: أَوْ.", tip:"Don't confuse it with أُمّ (mother). The app only shows أَمْ.", ex:"It is all the same for them whether you warn them or do not warn them; they will not believe."},
     ru:{gram:"«или» в вопросах, часто после أَ: أَ … أَمْ … (… или …?). Само по себе может значить «или же?».", pair:"Обычное «или»: أَوْ.", tip:"Не путай с أُمّ (мать). Приложение показывает только أَمْ.", ex:"Им всё равно, предостерёг ты их или не предостерёг. Они не уверуют."} } },
  { id:"badh", ar:"بَعْض", q:"بعض|بعضهم|بعضكم|بعضها|بعضا|بعضه|بعضنا", vstart:"بَعْض", ex:{ref:"49:12", ar:"وَلَا يَغْتَب بَّعْضُكُم بَعْضًا"},
    m:{de:"ein Teil von, einige", en:"some of", ru:"некоторые, часть"},
    info:{
     de:{gram:"„ein Teil von, einige“. Doppelt: بَعْضُهُمْ بَعْضًا heißt „einander“.", pair:"Gegenteil: كُلّ (alle).", tip:"Nicht verwechseln mit بَعْد (nach, Liste 6). Formen mit Endung (بَعْضُكُمْ …) sind mitgesucht.", ex:"Und keiner von euch soll über den anderen hinter seinem Rücken übel reden."},
     en:{gram:"“part of, some”. Doubled: بَعْضُهُمْ بَعْضًا means “one another”.", pair:"Opposite: كُلّ (all).", tip:"Don't confuse it with بَعْد (after, List 6). Forms with endings (بَعْضُكُمْ …) are included.", ex:"And do not backbite one another."},
     ru:{gram:"«часть, некоторые». Удвоенно: بَعْضُهُمْ بَعْضًا значит «друг друга».", pair:"Противоположность: كُلّ (все).", tip:"Не путай с بَعْد (после, список 6). Формы с окончаниями (بَعْضُكُمْ …) включены.", ex:"И пусть одни из вас не злословят о других за их спиной."} } },
  { id:"kull", ar:"كُلّ", q:"كل|كلها|كلهم|كله|كلا|كلكم", vstart:"كُلّ", ex:{ref:"3:185", ar:"كُلُّ نَفْسٍ ذَآئِقَةُ ٱلْمَوْتِ"},
    m:{de:"jede(r), alle", en:"every, each, all", ru:"каждый, все"},
    info:{
     de:{gram:"„jede(r)“ vor unbestimmtem Nomen, „alle, ganz“ vor bestimmtem: كُلُّ نَفْسٍ (jede Seele), كُلُّ ٱلنَّاسِ (alle Menschen).", pair:"Gegenteil: بَعْض (einige).", tip:"Sehr häufig: عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (zu allem fähig). Nicht verwechseln mit كَلَّا (keineswegs) und كُلُوا (esst).", ex:"Jede Seele wird den Tod kosten."},
     en:{gram:"“every” before an indefinite noun, “all, whole” before a definite one: كُلُّ نَفْسٍ (every soul), كُلُّ ٱلنَّاسِ (all people).", pair:"Opposite: بَعْض (some).", tip:"Very common: عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (able to do all things). Don't confuse it with كَلَّا (certainly not) and كُلُوا (eat!).", ex:"Every soul will taste death."},
     ru:{gram:"«каждый» перед неопределённым именем, «все, весь» перед определённым: كُلُّ نَفْسٍ (каждая душа), كُلُّ ٱلنَّاسِ (все люди).", pair:"Противоположность: بَعْض (некоторые).", tip:"Очень часто: عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (способен на всякую вещь). Не путай с كَلَّا (отнюдь) и كُلُوا (ешьте).", ex:"Каждая душа вкусит смерть."} } },
  { id:"laalla", ar:"لَعَلَّ", q:"لعل|لعلكم|لعلهم|لعله|لعلي|لعلك|لعلنا|لعلها", ex:{ref:"2:183", ar:"لَعَلَّكُمْ تَتَّقُونَ"},
    m:{de:"vielleicht, auf dass", en:"perhaps, so that", ru:"может быть, дабы"},
    info:{
     de:{gram:"„vielleicht, auf dass“. Drückt Hoffnung oder Zweck aus. Das Nomen danach steht im Akkusativ.", pair:"Ähnlich: عَسَىٰ (es kann sein).", tip:"Sehr häufig am Versende: لَعَلَّكُمْ تَتَّقُونَ, لَعَلَّكُمْ تَعْقِلُونَ (auf dass ihr begreift).", ex:"auf dass ihr gottesfürchtig werdet"},
     en:{gram:"“perhaps, so that”. Expresses hope or purpose. The noun after it is in the accusative.", pair:"Similar: عَسَىٰ (it may be).", tip:"Very common at the end of verses: لَعَلَّكُمْ تَتَّقُونَ, لَعَلَّكُمْ تَعْقِلُونَ (so that you may understand).", ex:"so that you may become mindful of Allah"},
     ru:{gram:"«может быть, дабы». Выражает надежду или цель. Имя после него в винительном падеже.", pair:"Похоже: عَسَىٰ (быть может).", tip:"Очень часто в конце аятов: لَعَلَّكُمْ تَتَّقُونَ, لَعَلَّكُمْ تَعْقِلُونَ (быть может, вы уразумеете).", ex:"быть может, вы будете богобоязненны"} } },
  { id:"asa", ar:"عَسَىٰ", q:"عسى|عسيتم", ex:{ref:"2:216", ar:"وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًٔا وَهُوَ خَيْرٌ لَّكُمْ"},
    m:{de:"es kann sein, möglicherweise", en:"it may be, possibly", ru:"возможно, быть может"},
    info:{
     de:{gram:"Verb der Hoffnung: „es kann sein, dass; vielleicht“. Meist mit أَنْ + Verb.", pair:"Ähnlich: لَعَلَّ (vielleicht).", tip:"Wenn Allah عَسَىٰ sagt, verstehen viele Gelehrte es als sichere Zusage. عَسَيْتُمْ (könnte es sein, dass ihr …) ist mitgesucht.", ex:"Aber vielleicht ist euch etwas zuwider, während es gut für euch ist."},
     en:{gram:"Verb of hope: “it may be that; perhaps”. Usually with أَنْ + verb.", pair:"Similar: لَعَلَّ (perhaps).", tip:"When Allah says عَسَىٰ, many scholars understand it as a sure promise. عَسَيْتُمْ (might it be that you …) is included.", ex:"But perhaps you dislike a thing and it is good for you."},
     ru:{gram:"Глагол надежды: «возможно, что; быть может». Обычно с أَنْ + глагол.", pair:"Похоже: لَعَلَّ (может быть).", tip:"Когда Аллах говорит عَسَىٰ, многие учёные понимают это как верное обещание. عَسَيْتُمْ (не может ли быть, что вы …) включено.", ex:"Возможно, вам неприятно то, что является благом для вас."} } },
  { id:"ya", ar:"يَا", q:"يا", v:"يَا", ex:{ref:"2:21", ar:"يَٰٓأَيُّهَا ٱلنَّاسُ ٱعْبُدُوا۟ رَبَّكُمُ"},
    m:{de:"o! (Anrede)", en:"O! (calling)", ru:"о! (обращение)"},
    info:{
     de:{gram:"Anredepartikel: „o!“. Danach steht der Angesprochene: يَا مُوسَىٰ (o Musa).", pair:"Vor Nomen mit ال steht يَا أَيُّهَا: يَا أَيُّهَا ٱلنَّاسُ (o ihr Menschen).", tip:"Im Quran oft mit dem nächsten Wort zusammengeschrieben: يَٰٓأَيُّهَا. In der Suche wird es als eigenes Wort gezählt.", ex:"O ihr Menschen, dient eurem Herrn."},
     en:{gram:"Vocative particle: “O!”. The person addressed follows: يَا مُوسَىٰ (O Moses).", pair:"Before nouns with ال you use يَا أَيُّهَا: يَا أَيُّهَا ٱلنَّاسُ (O mankind).", tip:"In the Quran it is often written joined to the next word: يَٰٓأَيُّهَا. The search counts it as a separate word.", ex:"O mankind, worship your Lord."},
     ru:{gram:"Частица обращения: «о!». Затем идёт тот, к кому обращаются: يَا مُوسَىٰ (о Муса).", pair:"Перед именем с ال используется يَا أَيُّهَا: يَا أَيُّهَا ٱلنَّاسُ (о люди).", tip:"В Коране часто пишется слитно со следующим словом: يَٰٓأَيُّهَا. Поиск считает его отдельным словом.", ex:"О люди! Поклоняйтесь вашему Господу."} } },
  { id:"inda", ar:"عِنْدَ", q:"عند|عنده|عندها|عندهم|عندكم|عندنا|عندي|عندك", vstart:"عِنْد", ex:{ref:"3:19", ar:"إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَٰمُ"},
    m:{de:"bei", en:"with, at", ru:"у, при"},
    info:{
     de:{gram:"„bei“ (Ort, Besitz oder Urteil): عِندَ ٱللَّهِ (bei Allah).", pair:"Ähnlich: لَدَى und لَدُنْ.", tip:"عِندِي heißt „ich habe“ (wörtl. bei mir). Formen mit Endung (عِندَهُ, عِندَنَا …) sind mitgesucht.", ex:"Gewiss, die Religion bei Allah ist der Islam."},
     en:{gram:"“with, at” (place, possession or judgement): عِندَ ٱللَّهِ (with Allah).", pair:"Similar: لَدَى and لَدُنْ.", tip:"عِندِي means “I have” (lit. with me). Forms with endings (عِندَهُ, عِندَنَا …) are included.", ex:"Indeed, the religion in the sight of Allah is Islam."},
     ru:{gram:"«у, при» (место, обладание или суждение): عِندَ ٱللَّهِ (у Аллаха).", pair:"Похоже: لَدَى и لَدُنْ.", tip:"عِندِي значит «у меня есть». Формы с окончаниями (عِندَهُ, عِندَنَا …) включены.", ex:"Воистину, религией у Аллаха является ислам."} } },
  { id:"lada", ar:"لَدَى", q:"لدى|لديه|لديهم|لدينا|لديك|لديكم|لدي", ex:{ref:"40:18", ar:"إِذِ ٱلْقُلُوبُ لَدَى ٱلْحَنَاجِرِ كَٰظِمِينَ"},
    m:{de:"bei, vor (jemandem)", en:"with, in the presence of", ru:"у, перед (кем-то)"},
    info:{
     de:{gram:"„bei, vor, in der Gegenwart von“, etwas gehobener als عِندَ.", pair:"Ähnlich: عِندَ und لَدُنْ.", tip:"Mit Endung wird ى zu ي: لَدَيْهِ, لَدَيْنَا (bei uns). Diese Formen sind mitgesucht.", ex:"wenn die Herzen vor Kummer bis an die Kehle reichen"},
     en:{gram:"“with, in the presence of”, a little more formal than عِندَ.", pair:"Similar: عِندَ and لَدُنْ.", tip:"With endings the ى becomes ي: لَدَيْهِ, لَدَيْنَا (with Us). These forms are included.", ex:"when hearts are at the throats, choked with grief"},
     ru:{gram:"«у, перед, в присутствии», несколько более возвышенно, чем عِندَ.", pair:"Похоже: عِندَ и لَدُنْ.", tip:"С окончаниями ى переходит в ي: لَدَيْهِ, لَدَيْنَا (у Нас). Эти формы включены.", ex:"когда сердца подступят к горлу от горя"} } },
  { id:"ladun", ar:"لَدُنْ", q:"لدن|لدنه|لدنا|لدني|لدنك", vstart:"لَدُن", ex:{ref:"3:8", ar:"وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً"},
    m:{de:"von … her (mit مِنْ)", en:"from (the presence of)", ru:"от (кого-то)"},
    info:{
     de:{gram:"„bei, von … her“, fast immer mit مِنْ: مِن لَّدُنْهُ (von Ihm her), مِن لَّدُنَّا (von Uns).", pair:"Ähnlich: عِندَ und لَدَى.", tip:"Betont, dass etwas direkt von Allah kommt: وَعَلَّمْنَاهُ مِن لَّدُنَّا عِلْمًا (und Wir lehrten ihn Wissen von Uns her).", ex:"Und schenke uns von Dir aus Barmherzigkeit."},
     en:{gram:"“from (the presence of)”, almost always with مِنْ: مِن لَّدُنْهُ (from Him), مِن لَّدُنَّا (from Us).", pair:"Similar: عِندَ and لَدَى.", tip:"It stresses that something comes directly from Allah: وَعَلَّمْنَاهُ مِن لَّدُنَّا عِلْمًا (and We taught him knowledge from Us).", ex:"And grant us mercy from Yourself."},
     ru:{gram:"«от (кого-то), у», почти всегда с مِنْ: مِن لَّدُنْهُ (от Него), مِن لَّدُنَّا (от Нас).", pair:"Похоже: عِندَ и لَدَى.", tip:"Подчёркивает, что нечто исходит прямо от Аллаха: وَعَلَّمْنَاهُ مِن لَّدُنَّا عِلْمًا (и научили его знанию от Нас).", ex:"Даруй нам милость от Тебя."} } },
 ]},
 { id:8, sub:{de:"Bonus: Verbindungen mit مَا", en:"Bonus: combinations with مَا", ru:"Бонус: сочетания с مَا"}, words:[
  { id:"bima", ar:"بِمَا", q:"بما", v:"بِمَا", ex:{ref:"2:4", ar:"وَٱلَّذِينَ يُؤْمِنُونَ بِمَآ أُنزِلَ إِلَيْكَ"},
    m:{de:"an das, was; mit dem, was", en:"with what, in what", ru:"тем, что; в то, что"},
    info:{
     de:{gram:"بِ (mit, an, wegen) + مَا (was): „an das, was; wegen dem, was; mit dem, was“.", pair:"Weitere Verbindungen: لِمَا, فِيمَا, مِمَّا, عَمَّا.", tip:"Sehr häufig am Versende: بِمَا كَانُوا يَعْمَلُونَ (für das, was sie zu tun pflegten), بِمَا تَعْمَلُونَ بَصِيرٌ.", ex:"und die an das glauben, was zu dir herabgesandt wurde"},
     en:{gram:"بِ (with, in, because of) + مَا (what): “in what, because of what, with what”.", pair:"Other combinations: لِمَا, فِيمَا, مِمَّا, عَمَّا.", tip:"Very common at the end of verses: بِمَا كَانُوا يَعْمَلُونَ (for what they used to do), بِمَا تَعْمَلُونَ بَصِيرٌ.", ex:"and who believe in what has been revealed to you"},
     ru:{gram:"بِ (с, в, из-за) + مَا (что): «в то, что; за то, что; тем, что».", pair:"Другие сочетания: لِمَا, فِيمَا, مِمَّا, عَمَّا.", tip:"Очень часто в конце аятов: بِمَا كَانُوا يَعْمَلُونَ (за то, что они совершали), بِمَا تَعْمَلُونَ بَصِيرٌ.", ex:"которые веруют в ниспосланное тебе"} } },
  { id:"anma", ar:"عَمَّا", q:"عما", v:"عَمَّا", ex:{ref:"2:74", ar:"وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ"},
    m:{de:"über das, was; von dem, was", en:"about what", ru:"о том, что"},
    info:{
     de:{gram:"عَنْ (über, von) + مَا: „über das, was; von dem, was“. Das ن verschmilzt mit م zu مّ.", pair:"Ähnlich gebaut: مِمَّا (مِنْ + مَا).", tip:"Typisch: وَمَا ٱللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ (Allah ist nicht unachtsam dessen, was ihr tut).", ex:"Und Allah ist nicht unachtsam dessen, was ihr tut."},
     en:{gram:"عَنْ (about, from) + مَا: “about what, from what”. The ن merges with the م into مّ.", pair:"Built the same way: مِمَّا (مِنْ + مَا).", tip:"Typical: وَمَا ٱللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ (Allah is not unaware of what you do).", ex:"And Allah is not unaware of what you do."},
     ru:{gram:"عَنْ (о, от) + مَا: «о том, что; от того, что». ن сливается с م в مّ.", pair:"Так же построено: مِمَّا (مِنْ + مَا).", tip:"Типично: وَمَا ٱللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ (Аллах не пребывает в неведении о том, что вы совершаете).", ex:"Аллах не пребывает в неведении относительно того, что вы совершаете."} } },
  { id:"fima", ar:"فِيمَا", q:"فيما", v:"فِيمَا", ex:{ref:"2:113", ar:"فَٱللَّهُ يَحْكُمُ بَيْنَهُمْ يَوْمَ ٱلْقِيَٰمَةِ فِيمَا كَانُوا۟ فِيهِ يَخْتَلِفُونَ"},
    m:{de:"in dem, was; worüber", en:"in what", ru:"в том, что"},
    info:{
     de:{gram:"فِي (in) + مَا: „in dem, was; worüber“.", pair:"Ähnlich: بِمَا, مِمَّا.", tip:"Oft beim Urteil am Jüngsten Tag: فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ (worüber sie uneinig waren). An wenigen Stellen ist es getrennt geschrieben (فِي مَا). Diese zeigt die Suche nicht.", ex:"Allah wird am Tag der Auferstehung zwischen ihnen richten über das, worüber sie uneinig waren."},
     en:{gram:"فِي (in) + مَا: “in what, concerning what”.", pair:"Similar: بِمَا, مِمَّا.", tip:"Often about the Judgement: فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ (concerning that over which they differed). In a few places it is written separately (فِي مَا); the search doesn't show those.", ex:"Allah will judge between them on the Day of Resurrection concerning that over which they used to differ."},
     ru:{gram:"فِي (в) + مَا: «в том, что; о том, в чём».", pair:"Похоже: بِمَا, مِمَّا.", tip:"Часто о Суде: فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ (в том, в чём они расходились). В некоторых местах пишется раздельно (فِي مَا), поиск их не показывает.", ex:"Аллах рассудит между ними в День воскресения в том, в чём они расходились."} } },
  { id:"mimma", ar:"مِمَّا", q:"مما", v:"مِمَّا", ex:{ref:"2:3", ar:"وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ"},
    m:{de:"von dem, was", en:"from what, of what", ru:"из того, что"},
    info:{
     de:{gram:"مِنْ (von) + مَا: „von dem, was“. Das ن verschmilzt mit م zu مّ.", pair:"Ähnlich gebaut: عَمَّا (عَنْ + مَا). Nicht verwechseln mit مِمَّنْ (von dem, der).", tip:"Bekannt aus 2:3: وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ (und von dem, womit Wir sie versorgt haben, geben sie aus).", ex:"und von dem, womit Wir sie versorgt haben, ausgeben"},
     en:{gram:"مِنْ (from) + مَا: “from what, of what”. The ن merges with the م into مّ.", pair:"Built the same way: عَمَّا (عَنْ + مَا). Don't confuse it with مِمَّنْ (from whom).", tip:"Known from 2:3: وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ (and spend from what We have provided them).", ex:"and spend out of what We have provided for them"},
     ru:{gram:"مِنْ (из, от) + مَا: «из того, что». ن сливается с م в مّ.", pair:"Так же построено: عَمَّا (عَنْ + مَا). Не путай с مِمَّنْ (из тех, кто).", tip:"Известно из 2:3: وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ (и расходуют из того, чем Мы их наделили).", ex:"и расходуют из того, чем Мы их наделили"} } },
  { id:"lima2", ar:"لِمَا", q:"لما", v:"لِمَا", ex:{ref:"3:3", ar:"مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ"},
    m:{de:"für das, was; zu dem, was", en:"for what, to what", ru:"для того, что"},
    info:{
     de:{gram:"لِ (für, zu) + مَا: „für das, was; zu dem, was“.", pair:"Nicht verwechseln mit لَمَّا (als, Liste 6) und لِمَ (warum, Liste 3).", tip:"Typisch: مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ (bestätigend, was vor ihm war). Die App zeigt nur لِمَا mit Kasra.", ex:"als Bestätigung dessen, was vor ihm war"},
     en:{gram:"لِ (for, to) + مَا: “for what, to what”.", pair:"Don't confuse it with لَمَّا (when, List 6) and لِمَ (why, List 3).", tip:"Typical: مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ (confirming what came before it). The app only shows لِمَا with a kasra.", ex:"confirming what came before it"},
     ru:{gram:"لِ (для, к) + مَا: «для того, что; к тому, что».", pair:"Не путай с لَمَّا (когда, список 6) и لِمَ (почему, список 3).", tip:"Типично: مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ (подтверждая то, что было до него). Приложение показывает только لِمَا с кясрой.", ex:"в подтверждение того, что было до него"} } },
  { id:"kama", ar:"كَمَا", q:"كما", v:"كَمَا", ex:{ref:"2:151", ar:"كَمَآ أَرْسَلْنَا فِيكُمْ رَسُولًا مِّنكُمْ"},
    m:{de:"so wie, ebenso wie", en:"just as, like", ru:"так же как, как"},
    info:{

     en:{gram:"كَ (like) + مَا: “just as, like”.", pair:"Similar: مِثْل (like) and كَأَنَّ (as if).", tip:"Typical for comparisons with earlier peoples: كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ (as it was prescribed for those before you).", ex:"Just as We have sent among you a messenger from yourselves"},
     ru:{gram:"كَ (как) + مَا: «так же как, как».", pair:"Похоже: مِثْل (подобный) и كَأَنَّ (как будто).", tip:"Типично для сравнения с прежними народами: كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ (как было предписано тем, кто был до вас).", ex:"Точно так же Мы отправили к вам Посланника из вашей среды"} } },
  { id:"innama", ar:"إِنَّمَا", q:"إنما", v:"إِنَّمَا", ex:{ref:"49:10", ar:"إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ"},
    m:{de:"nur, doch nur", en:"only, nothing but", ru:"только, лишь"},
    info:{
     de:{gram:"إِنَّ + مَا: „nur, doch nur“. Beschränkt die Aussage auf das, was folgt.", pair:"Gleiche Bedeutung wie مَا … إِلَّا oder إِنْ … إِلَّا (Liste 2).", tip:"Bekannt: إِنَّمَا ٱلْأَعْمَالُ بِٱلنِّيَّاتِ (Hadith) und im Quran إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ.", ex:"Die Gläubigen sind doch Brüder."},
     en:{gram:"إِنَّ + مَا: “only, nothing but”. It restricts the statement to what follows.", pair:"Same meaning as مَا … إِلَّا or إِنْ … إِلَّا (List 2).", tip:"Well known: إِنَّمَا ٱلْأَعْمَالُ بِٱلنِّيَّاتِ (hadith) and in the Quran إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ.", ex:"The believers are but brothers."},
     ru:{gram:"إِنَّ + مَا: «только, лишь». Ограничивает высказывание тем, что следует.", pair:"То же значение, что مَا … إِلَّا или إِنْ … إِلَّا (список 2).", tip:"Известно: إِنَّمَا ٱلْأَعْمَالُ بِٱلنِّيَّاتِ (хадис) и в Коране إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ.", ex:"Верующие — братья."} } },
  { id:"annama", ar:"أَنَّمَا", q:"أنما", v:"أَنَّمَا", vexcl:["كَ","وَكَ","فَكَ"], ex:{ref:"18:110", ar:"يُوحَىٰٓ إِلَىَّ أَنَّمَآ إِلَٰهُكُمْ إِلَٰهٌ وَٰحِدٌ"},
    m:{de:"dass (nur)", en:"that (only)", ru:"что (лишь)"},
    info:{

     en:{gram:"أَنَّ + مَا: “that (only)”, in the middle of a sentence.", pair:"At the start of a sentence: إِنَّمَا.", tip:"Typical: يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ (it is revealed to me that your god is one God). كَأَنَّمَا is not counted here.", ex:"it is revealed to me that your god is one God"},
     ru:{gram:"أَنَّ + مَا: «что (лишь)», в середине предложения.", pair:"В начале предложения: إِنَّمَا.", tip:"Типично: يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ (мне внушается, что ваш Бог — Бог Единственный). كَأَنَّمَا здесь не учитывается.", ex:"мне внушается, что ваш Бог — Бог Единственный"} } },
  { id:"kullama", ar:"كُلَّمَا", q:"كلما", v:"كُلَّمَا", ex:{ref:"2:25", ar:"كُلَّمَا رُزِقُوا۟ مِنْهَا مِن ثَمَرَةٍ رِّزْقًا قَالُوا۟ هَٰذَا ٱلَّذِى رُزِقْنَا مِن قَبْلُ"},
    m:{de:"jedes Mal wenn, sooft", en:"every time, whenever", ru:"всякий раз, когда"},
    info:{
     de:{gram:"كُلّ (jede) + مَا: „jedes Mal wenn, sooft“.", pair:"Einmaliges „als“: لَمَّا. „wenn“ in der Zukunft: إِذَا.", tip:"Danach steht meist ein Perfekt. Nicht verwechseln mit مِن كُلِّ مَا (von allem, was), das getrennt geschrieben wird.", ex:"Jedes Mal, wenn ihnen eine Frucht daraus gegeben wird, sagen sie: Das ist es, was uns zuvor gegeben wurde."},
     en:{gram:"كُلّ (every) + مَا: “every time, whenever”.", pair:"One-off “when”: لَمَّا. Future “when”: إِذَا.", tip:"Usually followed by a perfect verb. Don't confuse it with مِن كُلِّ مَا (of all that), which is written separately.", ex:"Whenever they are given fruit from it, they will say: This is what we were given before."},
     ru:{gram:"كُلّ (каждый) + مَا: «всякий раз, когда».", pair:"Однократное «когда»: لَمَّا. «Когда» в будущем: إِذَا.", tip:"Обычно за ним глагол прошедшего времени. Не путай с مِن كُلِّ مَا (из всего, что), которое пишется раздельно.", ex:"Всякий раз, когда им дадут плоды оттуда, они скажут: «Это нам давали прежде»."} } },
  { id:"aynama2", ar:"أَيْنَمَا", q:"أينما", ex:{ref:"4:78", ar:"أَيْنَمَا تَكُونُوا۟ يُدْرِككُّمُ ٱلْمَوْتُ"},
    m:{de:"wo auch immer", en:"wherever", ru:"где бы ни"},
    info:{
     de:{gram:"أَيْنَ (wo) + مَا: „wo auch immer“. Bedingungswort.", pair:"Ähnlich: حَيْثُ مَا. Schon in Liste 4, hier als Teil der مَا-Verbindungen.", tip:"Danach steht oft ein Jussiv: أَيْنَمَا تَكُونُوا (wo immer ihr seid).", ex:"Wo immer ihr auch seid, wird euch der Tod erreichen."},
     en:{gram:"أَيْنَ (where) + مَا: “wherever”. A conditional word.", pair:"Similar: حَيْثُ مَا. Already in List 4, here as one of the مَا combinations.", tip:"Often followed by a jussive: أَيْنَمَا تَكُونُوا (wherever you are).", ex:"Wherever you may be, death will overtake you."},
     ru:{gram:"أَيْنَ (где) + مَا: «где бы ни». Условное слово.", pair:"Похоже: حَيْثُ مَا. Уже было в списке 4, здесь как одно из сочетаний с مَا.", tip:"Часто за ним джазм: أَيْنَمَا تَكُونُوا (где бы вы ни были).", ex:"Где бы вы ни были, смерть настигнет вас."} } },
  { id:"nimimma", ar:"نِعِمَّا", q:"نعما", v:"نِعِمَّا", ex:{ref:"4:58", ar:"إِنَّ ٱللَّهَ نِعِمَّا يَعِظُكُم بِهِۦٓ"},
    m:{de:"wie gut ist das, was", en:"how good is what", ru:"как хорошо то, что"},
    info:{
     de:{gram:"نِعْمَ (wie vortrefflich) + مَا: „wie gut ist das, was …“.", pair:"Gegenteil: بِئْسَمَا.", tip:"Kommt nur zweimal im Quran vor (2:271 und 4:58). Merke: Aus نِعْمَ + مَا wird نِعِمَّا.", ex:"Wie trefflich ist das, womit Allah euch ermahnt!"},
     en:{gram:"نِعْمَ (how excellent) + مَا: “how good is what …”.", pair:"Opposite: بِئْسَمَا.", tip:"It only occurs twice in the Quran (2:271 and 4:58). Note: نِعْمَ + مَا becomes نِعِمَّا.", ex:"Excellent is that with which Allah instructs you!"},
     ru:{gram:"نِعْمَ (как прекрасен) + مَا: «как хорошо то, что …».", pair:"Противоположность: بِئْسَمَا.", tip:"Встречается в Коране только дважды (2:271 и 4:58). Запомни: из نِعْمَ + مَا получается نِعِمَّا.", ex:"Как прекрасно то, чем увещевает вас Аллах!"} } },
  { id:"bisama", ar:"بِئْسَمَا", q:"بئسما", ex:{ref:"2:90", ar:"بِئْسَمَا ٱشْتَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ"},
    m:{de:"wie schlimm ist das, was", en:"how evil is what", ru:"как скверно то, что"},
    info:{
     de:{gram:"بِئْسَ (wie schlimm) + مَا: „wie schlimm ist das, was …“.", pair:"Gegenteil: نِعِمَّا.", tip:"Typisch über die Kinder Israels: بِئْسَمَا ٱشْتَرَوْا بِهِ أَنفُسَهُمْ (wie schlimm ist das, wofür sie sich verkauft haben).", ex:"Wie schlimm ist das, wofür sie ihre Seelen verkauft haben!"},
     en:{gram:"بِئْسَ (how evil) + مَا: “how evil is what …”.", pair:"Opposite: نِعِمَّا.", tip:"Typical, about the Children of Israel: بِئْسَمَا ٱشْتَرَوْا بِهِ أَنفُسَهُمْ (how wretched is that for which they sold themselves).", ex:"How wretched is that for which they sold themselves!"},
     ru:{gram:"بِئْسَ (как скверен) + مَا: «как скверно то, что …».", pair:"Противоположность: نِعِمَّا.", tip:"Типично о сынах Исраила: بِئْسَمَا ٱشْتَرَوْا بِهِ أَنفُسَهُمْ (как скверно то, за что они продали себя).", ex:"Как же скверно то, за что они продали свои души!"} } },
  { id:"fama", ar:"فَمَا", q:"فما", v:"فَمَا", ex:{ref:"2:16", ar:"فَمَا رَبِحَت تِّجَٰرَتُهُمْ"},
    m:{de:"so … nicht; was also …?", en:"so … not; so what …?", ru:"и не …; что же …?"},
    info:{
     de:{gram:"فَ (und so) + مَا: entweder „und so … nicht“ (Verneinung) oder „was also …?“ (Frage).", pair:"Siehe مَا (Liste 2 und 3) und فَـ (Liste 6).", tip:"Typisch: فَمَا لَهُمْ لَا يُؤْمِنُونَ (Was ist denn mit ihnen, dass sie nicht glauben?). Die Suche zeigt beide Bedeutungen.", ex:"doch ihr Handel hat keinen Gewinn gebracht"},
     en:{gram:"فَ (and so) + مَا: either “so … not” (negation) or “so what …?” (question).", pair:"See مَا (Lists 2 and 3) and فَـ (List 6).", tip:"Typical: فَمَا لَهُمْ لَا يُؤْمِنُونَ (So what is wrong with them that they do not believe?). The search shows both meanings.", ex:"so their trade brought no profit"},
     ru:{gram:"فَ (и вот) + مَا: либо «и не …» (отрицание), либо «что же …?» (вопрос).", pair:"См. مَا (списки 2 и 3) и فَـ (список 6).", tip:"Типично: فَمَا لَهُمْ لَا يُؤْمِنُونَ (Что же с ними, что они не веруют?). Поиск показывает оба значения.", ex:"но не принесла их сделка прибыли"} } },
  { id:"amma2", ar:"أَمَّا", q:"أما", v:"أَمَّا", ex:{ref:"93:9", ar:"فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ"},
    m:{de:"was … betrifft", en:"as for", ru:"что касается"},
    info:{
     de:{gram:"„was … betrifft“. Der Teil danach beginnt fast immer mit فَـ: فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ.", pair:"Nicht verwechseln mit إِمَّا (entweder … oder) mit Kasra.", tip:"Oft paarweise: فَأَمَّا مَنْ … وَأَمَّا مَنْ … (was den angeht, der … und was den angeht, der …).", ex:"Was nun die Waise angeht, so unterdrücke sie nicht."},
     en:{gram:"“as for”. The part after it almost always starts with فَـ: فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ.", pair:"Don't confuse it with إِمَّا (either … or), which has a kasra.", tip:"Often in pairs: فَأَمَّا مَنْ … وَأَمَّا مَنْ … (as for the one who … and as for the one who …).", ex:"So as for the orphan, do not oppress him."},
     ru:{gram:"«что касается». Часть после него почти всегда начинается с فَـ: فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ.", pair:"Не путай с إِمَّا (либо … либо) с кясрой.", tip:"Часто парами: فَأَمَّا مَنْ … وَأَمَّا مَنْ … (что касается того, кто … а что касается того, кто …).", ex:"Посему не притесняй сироту."} } },
  { id:"imma", ar:"إِمَّا", q:"إما", v:"إِمَّا", ex:{ref:"76:3", ar:"إِنَّا هَدَيْنَٰهُ ٱلسَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا"},
    m:{de:"entweder … oder; wenn je", en:"either … or; if ever", ru:"либо … либо; если же"},
    info:{
     de:{gram:"Zwei Bedeutungen: „entweder … oder“ (إِمَّا … وَإِمَّا) und „wenn je“ (aus إِنْ + مَا), oft mit verstärktem Verb: فَإِمَّا يَأْتِيَنَّكُم (und wenn dann zu euch kommt …).", pair:"Nicht verwechseln mit أَمَّا (was … betrifft) mit Fatha.", tip:"Typisch: إِمَّا شَاكِرًا وَإِمَّا كَفُورًا (sei er dankbar oder undankbar).", ex:"Wir haben ihm den Weg gezeigt, sei er nun dankbar oder undankbar."},
     en:{gram:"Two meanings: “either … or” (إِمَّا … وَإِمَّا) and “if ever” (from إِنْ + مَا), often with an emphatic verb: فَإِمَّا يَأْتِيَنَّكُم (and when there comes to you …).", pair:"Don't confuse it with أَمَّا (as for), which has a fatha.", tip:"Typical: إِمَّا شَاكِرًا وَإِمَّا كَفُورًا (be he grateful or ungrateful).", ex:"Indeed, We guided him to the way, be he grateful or ungrateful."},
     ru:{gram:"Два значения: «либо … либо» (إِمَّا … وَإِمَّا) и «если же» (из إِنْ + مَا), часто с усиленным глаголом: فَإِمَّا يَأْتِيَنَّكُم (и когда придёт к вам …).", pair:"Не путай с أَمَّا (что касается) с фатхой.", tip:"Типично: إِمَّا شَاكِرًا وَإِمَّا كَفُورًا (будь он благодарным или неблагодарным).", ex:"Мы наставили его на путь, будь он благодарным или неблагодарным."} } },
 ]}
];

     de:{gram:"Name Allahs: „der Allerbarmer“, dessen Barmherzigkeit alles umfasst. Wird nur für Allah benutzt.", pair:"Gleiche Wurzel (ر ح م): رَحِيم (barmherzig), رَحْمَة (Barmherzigkeit).", tip:"Steht in der Basmala: بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ. Das lange ā wird mit kleinem Alif geschrieben: raḥmān.", ex:"Der Allerbarmer hat Sich über den Thron erhoben."},
     en:{gram:"Name of Allah: “the Most Compassionate”, whose mercy encompasses everything. Used only for Allah.", pair:"Same root (ر ح م): رَحِيم (merciful), رَحْمَة (mercy).", tip:"It is in the basmala: بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ. The long ā is written with a small alif: raḥmān.", ex:"The Most Compassionate rose over the Throne."},
     ru:{gram:"Имя Аллаха: «Милостивый», чья милость объемлет всё. Употребляется только по отношению к Аллаху.", pair:"Тот же корень (ر ح م): رَحِيم (милосердный), رَحْمَة (милость).", tip:"Есть в басмале: بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ. Долгое ā пишется маленьким алифом: raḥmān.", ex:"Милостивый вознёсся на Трон."} } },
  { id:"rahim", ar:"رَحِيم", q:"رحيم|رحيما", ex:{ref:"1:3", ar:"ٱلرَّحْمَٰنِ ٱلرَّحِيمِ"},
    m:{de:"der Barmherzige", en:"the Most Merciful", ru:"Милосердный"},
    info:{
     de:{gram:"„der Barmherzige“, Muster فَعِيل. Oft nach غَفُور: غَفُورٌ رَحِيمٌ (allvergebend, barmherzig).", pair:"Gleiche Wurzel: رَحْمَٰن (Allerbarmer). Viele Gelehrte erklären: رَحْمَٰن für alle Geschöpfe, رَحِيم besonders für die Gläubigen.", tip:"Mit Tanwin-Fatha bekommt es ein Alif: رَحِيمًا. Beide Formen sind mitgesucht. Einmal beschreibt es auch den Propheten (9:128).", ex:"dem Allerbarmer, dem Barmherzigen"},
     en:{gram:"“the Most Merciful”, pattern فَعِيل. Often after غَفُور: غَفُورٌ رَحِيمٌ (forgiving, merciful).", pair:"Same root: رَحْمَٰن (Most Compassionate). Many scholars explain: رَحْمَٰن for all creation, رَحِيم especially for the believers.", tip:"With tanwin fatha it gains an alif: رَحِيمًا. Both forms are included. Once it also describes the Prophet (9:128).", ex:"the Most Compassionate, the Most Merciful"},
     ru:{gram:"«Милосердный», модель فَعِيل. Часто после غَفُور: غَفُورٌ رَحِيمٌ (прощающий, милосердный).", pair:"Тот же корень: رَحْمَٰن (Милостивый). Многие учёные поясняют: رَحْمَٰن — ко всем творениям, رَحِيم — особенно к верующим.", tip:"С танвином фатха получает алиф: رَحِيمًا. Обе формы включены. Однажды так описан и Пророк (9:128).", ex:"Милостивому, Милосердному"} } },
  { id:"aziz", ar:"عَزِيز", q:"عزيز|عزيزا", ex:{ref:"2:129", ar:"إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
    m:{de:"der Mächtige, Unbezwingbare", en:"the Mighty, the Invincible", ru:"Могущественный"},
    info:{
     de:{gram:"„der Mächtige, Unbezwingbare“, Muster فَعِيل. Sehr oft zusammen mit حَكِيم: ٱلْعَزِيزُ ٱلْحَكِيمُ.", pair:"Wurzel ع ز ز: عِزَّة (Macht, Ehre).", tip:"Kann auch Menschen beschreiben, z. B. ٱمْرَأَتُ ٱلْعَزِيزِ (die Frau des Mächtigen) in Sura Yusuf. Die Suche zeigt alle Stellen.", ex:"Du bist ja der Mächtige, der Allweise."},
     en:{gram:"“the Mighty, the Invincible”, pattern فَعِيل. Very often paired with حَكِيم: ٱلْعَزِيزُ ٱلْحَكِيمُ.", pair:"Root ع ز ز: عِزَّة (might, honour).", tip:"It can also describe people, e.g. ٱمْرَأَتُ ٱلْعَزِيزِ (the wife of al-Aziz) in Surah Yusuf. The search shows all places.", ex:"Indeed, You are the Mighty, the Wise."},
