<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quran Wortsuche · al-Husary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2a24; --muted:#6b736c; --line:#e4ddcc;
    --accent:#1f6b52; --accent-soft:#e3efe9; --gold:#b08a3e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121714; --card:#1a211d; --ink:#ece8de; --muted:#9aa39c; --line:#2c3630;
      --accent:#5cc49c; --accent-soft:#1f3229; --gold:#d6b46a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 12px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:18px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  h1 small{font-weight:400;color:var(--muted);font-size:13px}
  .search{display:flex;gap:8px}
  .search input{flex:1;font-family:Amiri,serif;font-size:24px;direction:rtl;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent)}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;font-size:13px;color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 10px;font-size:13px;background:var(--card)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  select{font-family:inherit;font-size:13px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  main{padding:14px 16px 120px}
  .status{color:var(--muted);font-size:14px;margin:6px 0 12px}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;direction:rtl}
  .chip{font-family:Amiri,serif;font-size:19px;padding:2px 12px;border-radius:999px;border:2px solid transparent;cursor:pointer;background:var(--card);display:inline-flex;gap:6px;align-items:center}
  .chip span{font-family:Inter,sans-serif;font-size:12px;color:var(--muted)}
  .chip.off{opacity:.35}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;transition:box-shadow .2s,border-color .2s}
  .card.playing{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
  .meta b{color:var(--accent);font-weight:600}
  .ar{font-family:"Amiri Quran",Amiri,serif;font-size:27px;line-height:2.2;direction:rtl;text-align:right;margin:4px 0 8px}
  .ar mark{background:none;font-weight:700;border-radius:6px;padding:0 3px}
  .tr{font-size:15px;color:var(--ink);opacity:.9;border-top:1px dashed var(--line);padding-top:8px}
  .play{width:38px;height:38px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .more{display:block;margin:10px auto}
  .player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;z-index:6}
  .player .wrap{display:flex;align-items:center;gap:10px;font-size:14px}
  .player .now{flex:1;color:var(--muted)}
  .hint{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .hint p{margin:4px 0}
  .ex{font-family:Amiri,serif;font-size:18px;cursor:pointer;color:var(--accent);margin:0 4px}
  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  #lang{margin-left:auto;font-size:13px;padding:4px 6px}
  h1 .ttl{white-space:nowrap}
  .tabs button{flex:1;padding:8px;font-weight:600}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hidden{display:none!important}
  /* 50% */
  .intro{font-size:14px;color:var(--muted);margin:0 0 14px}
  .listcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
  .listhead{padding:14px 16px;border-bottom:1px solid var(--line)}
  .listhead h2{margin:0;font-size:16px}
  .listhead .sub{font-size:13px;color:var(--muted)}
  .bar{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .row{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--accent-soft)}
  .row .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;color:#fff;background:var(--card)}
  .row.done .chk{background:var(--accent);border-color:var(--accent)}
  .row .en{flex:1;min-width:0}
  .row .en b{display:block;font-size:15px}
  .row .en span{font-size:12.5px;color:var(--muted)}
  .row .w{font-family:"Amiri Quran",Amiri,serif;font-size:28px;direction:rtl;min-width:84px;text-align:center}
  .row.done .en b{color:var(--muted)}
  .row .cnt{font-size:12px;color:var(--muted);min-width:46px;text-align:right}
  .info{width:32px;height:32px;padding:0;border-radius:50%;flex:none;font-weight:700;color:var(--accent)}
  .backbar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:14px;padding:8px 10px;margin-bottom:12px;font-size:14px}
  .backbar .w{font-family:"Amiri Quran",Amiri,serif;font-size:24px;flex:1;text-align:center}
  .backbar .done{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
  @media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
  .sheet .big{font-family:"Amiri Quran",Amiri,serif;font-size:48px;text-align:center;direction:rtl;line-height:1.6}
  .sheet h3{margin:0;text-align:center;font-size:17px}
  .sheet .de{text-align:center;color:var(--muted);margin-bottom:12px}
  .sheet dl{margin:0}
  .sheet dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin-top:12px;font-weight:600}
  .sheet dd{margin:2px 0 0;font-size:15px}
  .sheet .arx{font-family:"Amiri Quran",Amiri,serif;font-size:22px;direction:rtl;text-align:right;display:block;line-height:2}
  .sheet .actions{display:flex;gap:8px;margin-top:18px}
  .sheet .actions button{flex:1;padding:10px}
  .arin{unicode-bidi:isolate;direction:rtl;font-family:Amiri,serif;font-size:1.15em}
  /* Quiz */
  .listhead .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .quizbtn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;flex:none}
  .best{font-size:12px;color:var(--gold);margin-top:2px}
  .qz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .qz .qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .qz .qbar{height:6px;background:var(--line);border-radius:6px;margin:8px 0 16px;overflow:hidden}
  .qz .qbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
  .qz .qtype{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);font-weight:600;text-align:center}
  .qz .prompt{text-align:center;margin:10px 0 18px}
  .qz .prompt .big{font-family:"Amiri Quran",Amiri,serif;font-size:52px;line-height:1.6;direction:rtl}
  .qz .prompt .txt{font-size:20px;font-weight:600}
  .qz .prompt .sub{font-size:14px;color:var(--muted)}
  .qz .ayah{font-family:"Amiri Quran",Amiri,serif;font-size:25px;line-height:2.2;direction:rtl;text-align:right}
  .qz .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center;padding:0 6px}
  .qz .gap.ok{color:#1d8f4e;border-color:#1d8f4e}
  .qz .ref{font-size:12.5px;color:var(--muted);text-align:left;margin-top:4px}
  .qz .hint{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;text-align:left}
  .opts4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opts4 button{padding:12px 8px;font-size:15px;min-height:58px;border-radius:14px;line-height:1.3}
  .opts4 button.arb{font-family:"Amiri Quran",Amiri,serif;font-size:27px;padding:4px 8px}
  .opts4 button.right{background:#1d8f4e;border-color:#1d8f4e;color:#fff}
  .opts4 button.wrong{background:#c62f3b;border-color:#c62f3b;color:#fff}
  .opts4 button:disabled{cursor:default}
  .qfoot{display:flex;gap:8px;margin-top:14px}
  .qfoot button{flex:1;padding:12px}
  .qfb{text-align:center;font-weight:600;margin-top:12px;min-height:22px}
  .res{text-align:center}
  .res .score{font-size:46px;font-weight:700;color:var(--accent)}
  .res .wl{text-align:left;margin:14px 0}
  .res .wl div{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .res .wl .a{font-family:"Amiri Quran",Amiri,serif;font-size:24px;min-width:70px;text-align:center}
  .res .wl .m{flex:1}
  /* ---------- Handy ---------- */
  html,body{overflow-x:hidden;width:100%}
  .search input{min-width:0;width:100%}
  .search button{flex:none}
  @media (max-width:640px){
    header{padding:calc(8px + env(safe-area-inset-top)) 12px 10px}
    h1{font-size:16px;margin-bottom:8px;flex-wrap:wrap;gap:2px 6px}
    h1 small{font-size:11.5px;width:100%;order:3}
    .tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;margin:0;gap:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
    .tabs button{border:0;border-radius:12px;padding:10px 4px;font-size:14px;background:transparent}
    .tabs button.on{background:var(--accent-soft);color:var(--accent)}
    .search input{font-size:22px;padding:6px 12px}
    .search button{padding:8px 12px}
    .opts{gap:6px;margin-top:8px}
    .seg{display:flex;width:100%}
    .seg button{flex:1;padding:7px 4px}
    #trans{flex:1;min-width:0}
    #playAll{flex:none;padding:6px 10px;font-size:13px}
    main{padding:10px 10px calc(150px + env(safe-area-inset-bottom))}
    .card{padding:12px 12px;border-radius:14px;margin-bottom:10px}
    .ar{font-size:24px;line-height:2.1}
    .tr{font-size:14.5px}
    .player{bottom:calc(58px + env(safe-area-inset-bottom));padding:8px 12px;border-radius:14px 14px 0 0}
    .intro{font-size:13.5px;margin:2px 4px 12px}
    .listcard{border-radius:14px}
    .listhead{padding:12px 14px}
    .row{gap:8px;padding:10px 10px}
    .row .chk{width:28px;height:28px}
    .row .en b{font-size:14.5px}
    .row .en span{font-size:12px;line-height:1.3;display:block}
    .row .w{font-size:26px;min-width:70px}
    .row .cnt{min-width:0;font-size:11px}
    .backbar{padding:6px 8px;gap:6px;font-size:13px}
    .backbar button{padding:7px 9px;font-size:13px}
    .backbar .w{font-size:22px}
    .sheet{max-height:85vh;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
    .modal{z-index:20}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1><span class="ttl" data-i="title">Quran Wortsuche</span> <select id="lang" aria-label="Sprache / Language / Язык"><option value="de">🇩🇪 DE</option><option value="en">🇬🇧 EN</option><option value="ru">🇷🇺 RU</option></select><small data-i="reciter">· Rezitation: Mahmoud Khalil al-Husary</small></h1>
    <nav class="tabs">
      <button type="button" data-t="search" class="on" data-i="tabSearch">🔍 Suche</button>
      <button type="button" data-t="fifty" data-i="tabFifty">50% des Quran</button>
      <button type="button" data-t="s65" data-i="tabS65">65% des Quran</button>
    </nav>
    <div id="searchBar">
    <form class="search" id="form">
      <input id="q" placeholder="اكتب كلمة…" autocomplete="off" dir="rtl" lang="ar">
      <button class="primary" type="submit" data-i="searchBtn">Suchen</button>
    </form>
    <div class="opts">
      <div class="seg" id="mode">
        <button type="button" data-m="contains" class="on" data-i="mContains">enthält</button>
        <button type="button" data-m="start" data-i="mStart">beginnt mit</button>
        <button type="button" data-m="exact" data-i="mExact">genaues Wort</button>
      </div>
      <select id="trans"></select>
      <button type="button" id="playAll" data-i="playAll">▶ Alle abspielen</button>
    </div>
    </div>
  </div>
</header>

<main class="wrap">
 <section id="viewFifty" class="hidden">
  <p class="intro" id="intro"></p>
  <div id="lists"></div>
 </section>
 <section id="viewQuiz" class="hidden"></section>
 <section id="viewSearch">
  <div class="backbar hidden" id="backbar"></div>
  <div class="status" id="status" data-i="loading">Koran wird geladen…</div>
  <div class="legend" id="legend"></div>
  <div id="results">
    <div class="hint">
      <p><span data-i="hint1">Gib ein arabisches Wort ein, mit oder ohne Harakat. Beispiele:</span>
        <span class="ex">رحمة</span><span class="ex">صبر</span><span class="ex">جنات</span><span class="ex">نور</span><span class="ex">يوم الدين</span></p>
      <p data-i="hint2"></p>
    </div>
  </div>
 </section>
</main>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>

<div class="player" id="player">
  <div class="wrap">
    <button class="play" id="pPlay">⏸</button>
    <div class="now" id="pNow"></div>
    <button id="pStop">✕</button>
  </div>
</div>

<script>

const AUDIO = n => `https://cdn.islamic.network/quran/audio/128/ar.husary/${n}.mp3`;

// ---------- Normalisierung ----------
function norm(s){
  return s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,"")
          .replace(/[ٱأإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
          .replace(/[^ء-ي ]/g,"").trim();
}

// ---------- Laden (mit Cache) ----------
async function getEdition(id){
  const key = "qws_"+id;
  try{ const c = localStorage.getItem(key); if(c) return JSON.parse(c); }catch(e){}
  const r = await fetch(API+id); if(!r.ok) throw new Error(id);
  const j = await r.json();
  const slim = j.data.surahs.map(s=>({n:s.number,name:s.englishName,ar:s.name,ay:s.ayahs.map(a=>[a.number,a.numberInSurah,a.text])}));
  try{ localStorage.setItem(key, JSON.stringify(slim)); }catch(e){}
  return slim;
}

function stripBasmala(words, s, a){
  if(a===1 && s!==1 && s!==9 && words.length>4 && norm(words[0])==="بسم") return words.slice(4);
  return words;
}

async function load(){
  const [disp, clean] = await Promise.all([getEdition("quran-simple"), getEdition("quran-simple-clean").catch(()=>null)]);
  AYAT = [];
  disp.forEach((su,si)=>su.ay.forEach((ay,ai)=>{
    const src = clean ? clean[si].ay[ai][2] : ay[2];
    const cw = stripBasmala(src.split(/\s+/).filter(Boolean), su.n, ay[1]);
    let dw = stripBasmala(ay[2].split(/\s+/).filter(Boolean), su.n, ay[1]);
    AYAT.push({n:ay[0], s:su.n, a:ay[1], sName:su.name, sNameAr:su.ar, words:dw,
               clean:cw.map(norm), aligned: dw.length===cw.length, tr:""});
  }));
  await loadTrans();
  setStatus(t("ready")(nf(AYAT.length)));
  renderLists();
}

async function loadTrans(){
  const id = document.getElementById("trans").value;
  const t = await getEdition(id);
  let i=0; t.forEach(su=>su.ay.forEach(ay=>{ AYAT[i++].tr = ay[2]; }));
}

// ---------- Suche ----------
const PREFIXES = ["","و","ف","ب","ل","ك","ا","وب","فب","ول","فل","وك","فك","او","اف","ال","وال","فال","بال","كال","وبال"];
function wordMatch(w, q, m=mode){
  if(m==="exact"){
    if(PREFIXES.some(p=>w===p+q)) return true;
    if(q.startsWith("ال")){ const r=q.slice(2); return ["لل","ولل","فلل"].some(p=>w===p+r); }  // ل + الذين = للذين
    return false;
  }
  if(m==="start") return PREFIXES.some(p=>w.startsWith(p+q));
  return w.includes(q);
}

// raw: Suchtext. "a|b|c" = Alternativen (genaues Wort, mit Vorsilben)
function findMatches(raw, m=mode){
  const alts = (raw.includes("|") || m==="alts") ? raw.split("|").map(norm).filter(Boolean) : null;
  const toks = alts ? ["*"] : norm(raw).split(/\s+/).filter(Boolean);
  const res = [], fm = new Map();
  if(!toks.length) return {res, fm};
  for(const ay of AYAT){
    const W = ay.aligned ? ay.clean : ay.words.map(norm);
    const hits = [];
    for(let i=0;i<=W.length-toks.length;i++){
      let ok = true;
      for(let k=0;k<toks.length;k++){
        const w = W[i+k], t = toks[k];
        const r = alts ? alts.some(a=>wordMatch(w,a,"exact"))
                : toks.length===1 ? wordMatch(w,t,m) : w.includes(t);
        if(!r){ ok=false; break; }
      }
      if(ok){
        const form = W.slice(i,i+toks.length).join(" ");
        hits.push({i, len:toks.length, form});
        fm.set(form, (fm.get(form)||0)+1);
      }
    }
    if(hits.length) res.push({ay, hits});
  }
  return {res, fm};
}

// ---------- Listenwörter: genaue Suche mit Vokalen, Wortpaaren, Phrasen ----------
const VPREF = ["","وَ","فَ","أَ","بِ","لِ","كَ","لَ","وَلَ","فَلَ","وَلِ","فَلِ","أَفَ","أَوَ","وَبِ","فَبِ","وَكَ","فَكَ","أَفَلَ","أَوَلَ"];
function vnorm(x){
  return x.replace(/[\u0610-\u061A\u0670\u06D6-\u06ED\u0640\u0652]/g,"").replace(/ٱ/g,"ا")
          .replace(/([\u064B-\u0650])\u0651/g,"\u0651$1");
}
function vMatch(word, sp){
  const vs = [].concat(sp.v), vw = vnorm(word);
  return vs.some(v=>{ const tv = vnorm(v);
    return VPREF.some(p=> !(sp.vexcl||[]).includes(p) && vw===vnorm(p)+tv); });
}
// Wortanfang mit Vokalen prüfen (für Formen mit Endungen, z. B. بَيْنَهُمْ)
const ARTP = ["ال","وَال","فَال","بِال","كَال","لِل","وَلِل","فَلِل"];
function vStart(word, stems, excl, art){
  const vw = vnorm(word), pre = art ? VPREF.concat(ARTP) : VPREF;
  return [].concat(stems).some(stem=>{ const st = vnorm(stem);
    return pre.some(p=>!(excl||[]).includes(p) && vw.startsWith(vnorm(p)+st)); });
}
// sp: {q:"a|b c", v?, vexcl?, vstart?, notPrev?}
function specHits(ay, W, sp){
  const alts = sp.q.split("|").map(a=>a.trim().split(/\s+/).map(norm));
  const hits = [];
  for(let i=0;i<W.length;i++){
    for(const alt of alts){
      if(i+alt.length>W.length) continue;
      if(!alt.every((tk,k)=>wordMatch(W[i+k],tk,"exact"))) continue;
      if(sp.v && !vMatch(ay.words[i], sp)) continue;
      if(sp.vstart && !vStart(ay.words[i], sp.vstart, sp.vexcl, sp.art)) continue;
      if(sp.vnot && vMatch(ay.words[i], {v:sp.vnot})) continue;
      if(sp.notPrev && i>0 && [].concat(sp.notPrev).some(np=>wordMatch(W[i-1],norm(np),"exact"))) continue;
      hits.push({i, len:alt.length, form:W.slice(i,i+alt.length).join(" ")});
      i += alt.length-1; break;
    }
  }
  return hits;
}
function findList(w){
  const res = [], fm = new Map();
  if(w.nosearch) return {res, fm};
  for(const ay of AYAT){
    const W = ay.aligned ? ay.clean : ay.words.map(norm);
    let hits = [];
    if(w.combo){
      const A = specHits(ay, W, w.combo[0]), B = specHits(ay, W, w.combo[1]);
      let last = -1;
      for(const b of B){
        const a = A.filter(x=>x.i>last && x.i<b.i).pop();
        if(!a) continue;
        const form = a.form+" … "+b.form;
        hits.push({i:a.i,len:a.len,form},{i:b.i,len:b.len,form});
        fm.set(form,(fm.get(form)||0)+1); last = b.i;
      }
    } else {
      hits = specHits(ay, W, w);
      hits.forEach(h=>fm.set(h.form,(fm.get(h.form)||0)+1));
    }
    if(hits.length) res.push({ay, hits});
  }
  return {res, fm};
}
function showList(w){ const {res,fm} = findList(w); setResults(res, fm); }

function search(raw, m=mode){
  const {res, fm} = findMatches(raw, m);
  if(!res.length && !norm(raw.replace(/\|/g," "))) return;
  setResults(res, fm);
}
function setResults(res, fm){
  results = res; hidden.clear();
  const sorted = [...fm.entries()].sort((a,b)=>b[1]-a[1]);
  forms = new Map(sorted.map(([f,c],i)=>[f,{count:c,color:COLORS[i%COLORS.length]}]));
  render();
}

function visible(){ return results.filter(r=>r.hits.some(h=>!hidden.has(h.form))); }

function render(){
  const occ = [...forms.values()].reduce((a,b)=>a+b.count,0);
  const vis = visible();
  setStatus(results.length
    ? t("stat")(nf(vis.length), nf(occ), nf(forms.size))
    : t("none"));
  const lg = document.getElementById("legend"); lg.innerHTML = "";
  [...forms.entries()].slice(0,40).forEach(([f,o])=>{
    const c = document.createElement("div");
    c.className = "chip"+(hidden.has(f)?" off":"");
    c.style.borderColor = o.color; c.style.color = o.color;
    c.innerHTML = `${f}<span>${o.count}</span>`;
    c.onclick = ()=>{ hidden.has(f)?hidden.delete(f):hidden.add(f); render(); };
    lg.appendChild(c);
  });
  if(forms.size>40){ const s=document.createElement("span"); s.style.cssText="font-size:12px;color:var(--muted);align-self:center"; s.textContent=t("moreForms")(forms.size-40); lg.appendChild(s); }
  document.getElementById("results").innerHTML = "";
  shown = 0; more();
}

function more(){
  const box = document.getElementById("results");
  (box.querySelector(".more")||{}).remove?.();
  const vis = visible();
  vis.slice(shown, shown+PAGE).forEach(r=>box.appendChild(card(r)));
  shown += PAGE;
  if(shown < vis.length){
    const b = document.createElement("button"); b.className="more";
    b.textContent = t("more")(Math.min(PAGE, vis.length-shown), vis.length-shown);
    b.onclick = more; box.appendChild(b);
  }
}

function card({ay,hits}){
  const el = document.createElement("div"); el.className="card"; el.id="ay"+ay.n;
  const color = {};
  hits.forEach(h=>{ if(hidden.has(h.form)) return; for(let k=0;k<h.len;k++) color[h.i+k]=forms.get(h.form).color; });
  const ar = ay.words.map((w,i)=>color[i]?`<mark style="color:${color[i]};background:${color[i]}1f">${w}</mark>`:w).join(" ");
  el.innerHTML = `
    <div class="meta"><div><b>${ay.s}:${ay.a}</b> · ${ay.sName} · <span style="font-family:Amiri,serif;font-size:16px">${ay.sNameAr}</span></div>
      <button class="play" title="${t("listen")}">▶</button></div>
    <div class="ar">${ar} <span style="color:var(--gold);font-size:20px">﴿${ay.a.toLocaleString("ar-EG")}﴾</span></div>
    <div class="tr">${ay.tr}</div>`;
  el.querySelector(".play").onclick = ()=>{
    if(queue.length===1 && queue[0]===ay && !audio.paused){ audio.pause(); updBtns(); return; }
    queue=[ay]; qi=0; playCur();
  };
  return el;
}

// ---------- Audio ----------
function playCur(){
  const ay = queue[qi]; if(!ay) return stop();
  audio.src = AUDIO(ay.n); audio.dataset.fb = "0";
  audio.play().catch(()=>{});
  document.querySelectorAll(".card.playing").forEach(c=>c.classList.remove("playing"));
  const c = document.getElementById("ay"+ay.n);
  if(c){ c.classList.add("playing"); if(queue.length>1) c.scrollIntoView({behavior:"smooth",block:"center"}); }
  document.getElementById("player").style.display="block";
  document.getElementById("pNow").textContent = `al-Husary · ${ay.sName} ${ay.s}:${ay.a}` + (queue.length>1?` · ${qi+1}/${queue.length}`:"");
  updBtns();
}
audio.onerror = ()=>{ const ay=queue[qi]; if(ay && audio.dataset.fb==="0"){ audio.dataset.fb="1"; audio.src=AUDIO_FALLBACK(ay.s,ay.a); audio.play().catch(()=>{}); } };
audio.onended = ()=>{ qi++; if(qi<queue.length){ if(document.getElementById("ay"+queue[qi].n)===null && shown<visible().length) more(); playCur(); } else stop(); };
audio.onplay = audio.onpause = updBtns;
function stop(){ audio.pause(); queue=[]; qi=-1; document.getElementById("player").style.display="none";
  document.querySelectorAll(".card.playing").forEach(c=>c.classList.remove("playing")); updBtns(); }
function updBtns(){
  document.getElementById("pPlay").textContent = audio.paused ? "▶" : "⏸";
  document.querySelectorAll(".card").forEach(c=>{
    const on = queue[qi] && c.id==="ay"+queue[qi].n && !audio.paused;
    c.querySelector(".play").textContent = on ? "⏸" : "▶";
  });
}
document.getElementById("pPlay").onclick = ()=> audio.paused ? audio.play() : audio.pause();
document.getElementById("pStop").onclick = stop;
document.getElementById("playAll").onclick = ()=>{ const v=visible(); if(!v.length) return; queue=v.map(r=>r.ay); qi=0; playCur(); };

     ru:{gram:"Указательное местоимение для далёкого, мужской род, ед. ч. Часто просто «это» как ссылка на сказанное.", pair:"Далеко ↔ близко: ذَٰلِكَ ↔ هَٰذَا. Женский род: تِلْكَ.", tip:"Очень часто в форме كَذَٰلِكَ (так, таким же образом). Форма ذَٰلِكُمْ обращена к нескольким людям. Обе формы включены в поиск.", ex:"Это Писание, в котором нет сомнения."} } },
  { id:"tilka", ar:"تِلْكَ", q:"تلك|تلكم", ex:{ref:"2:134", ar:"تِلْكَ أُمَّةٌ قَدْ خَلَتْ"},
    m:{de:"jene (f.)", en:"that (f.)", ru:"та (ж. р.)"},
    info:{
     de:{gram:"Hinweispronomen für etwas Fernes, feminin Singular. Steht wie هَٰذِهِ auch für Plurale von Dingen.", pair:"Fern ↔ nah: تِلْكَ ↔ هَٰذِهِ. Maskulin: ذَٰلِكَ.", tip:"تِلْكَ آيَاتُ … ist ein typischer Sura-Anfang: „Das sind die Verse …“.", ex:"Jenes ist eine Gemeinschaft, die bereits vergangen ist."},
     en:{gram:"Demonstrative pronoun for something far, feminine singular. Like هَٰذِهِ, also used for plurals of things.", pair:"Far ↔ near: تِلْكَ ↔ هَٰذِهِ. Masculine: ذَٰلِكَ.", tip:"تِلْكَ آيَاتُ … is a typical opening of a surah: “These are the verses …”.", ex:"That is a nation which has passed on."},
     ru:{gram:"Указательное местоимение для далёкого, женский род, ед. ч. Как и هَٰذِهِ, используется для мн. ч. предметов.", pair:"Далеко ↔ близко: تِلْكَ ↔ هَٰذِهِ. Мужской род: ذَٰلِكَ.", tip:"تِلْكَ آيَاتُ … — типичное начало суры: «Это аяты …».", ex:"То была община, которая уже прошла."} } },
  { id:"ulaika", ar:"أُولَٰئِكَ", q:"أولئك|أولئكم", ex:{ref:"2:5", ar:"أُولَٰئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ"},
    m:{de:"jene (Personen, Plural)", en:"those (people)", ru:"те (о людях, мн. ч.)"},
    info:{
     de:{gram:"Hinweispronomen für Fernes im Plural, für Menschen.", pair:"Fern ↔ nah: أُولَٰئِكَ ↔ هَٰؤُلَاءِ.", tip:"Das و wird nicht gesprochen: ulā-ika. Leitet oft das Fazit über eine Gruppe ein: „Jene sind es, die …“.", ex:"Jene folgen einer Rechtleitung von ihrem Herrn."},
     en:{gram:"Demonstrative pronoun for far things in the plural, for people.", pair:"Far ↔ near: أُولَٰئِكَ ↔ هَٰؤُلَاءِ.", tip:"The و is not pronounced: ulā-ika. It often introduces a conclusion about a group: “Those are the ones who …”.", ex:"Those are upon guidance from their Lord."},
     ru:{gram:"Указательное местоимение мн. ч. для далёкого, о людях.", pair:"Далеко ↔ близко: أُولَٰئِكَ ↔ هَٰؤُلَاءِ.", tip:"Буква و не произносится: ulā-ika. Часто вводит вывод о группе людей: «Именно они те, кто …».", ex:"Они следуют верному руководству от своего Господа."} } },
  { id:"alladhi", ar:"ٱلَّذِي", q:"الذي", ex:{ref:"67:1", ar:"تَبَارَكَ ٱلَّذِي بِيَدِهِ ٱلْمُلْكُ"},
    m:{de:"der, welcher (m.)", en:"who, which (m.)", ru:"который (м. р.)"},
    info:{
     de:{gram:"Relativpronomen, maskulin Singular: „der, welcher; derjenige, der“.", pair:"Feminin: ٱلَّتِي. Plural (Personen): ٱلَّذِينَ.", tip:"Das Alif am Anfang ist ein Wasla: nach einem Wort davor wird es nicht gesprochen (…l-ladhī).", ex:"Segensreich ist Derjenige, in Dessen Hand die Herrschaft ist."},
     en:{gram:"Relative pronoun, masculine singular: “who, which; the one who”.", pair:"Feminine: ٱلَّتِي. Plural (people): ٱلَّذِينَ.", tip:"The alif at the start is a wasla: after a preceding word it is not pronounced (…l-ladhī).", ex:"Blessed is He in whose hand is the dominion."},
     ru:{gram:"Относительное местоимение, мужской род, ед. ч.: «который; тот, кто».", pair:"Женский род: ٱلَّتِي. Мн. ч. (о людях): ٱلَّذِينَ.", tip:"Алиф в начале — это васля: после предыдущего слова он не произносится (…l-ladhī).", ex:"Благословен Тот, в Чьей Руке власть."} } },
  { id:"allati", ar:"ٱلَّتِي", q:"التي", ex:{ref:"2:24", ar:"فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِي وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ"},
    m:{de:"die, welche (f.)", en:"who, which (f.)", ru:"которая (ж. р.)"},
    info:{
     de:{gram:"Relativpronomen, feminin Singular. Auch für Plurale von Dingen.", pair:"Maskulin: ٱلَّذِي. Plural (Personen): ٱلَّذِينَ.", tip:"Merke: ٱلَّذِي und ٱلَّتِي unterscheiden sich nur in ذ ↔ ت, genau wie ذَٰلِكَ ↔ تِلْكَ.", ex:"So hütet euch vor dem Feuer, dessen Brennstoff Menschen und Steine sind."},
     en:{gram:"Relative pronoun, feminine singular. Also used for plurals of things.", pair:"Masculine: ٱلَّذِي. Plural (people): ٱلَّذِينَ.", tip:"ٱلَّذِي and ٱلَّتِي differ only in ذ ↔ ت, just like ذَٰلِكَ ↔ تِلْكَ.", ex:"Then fear the Fire whose fuel is people and stones."},
     ru:{gram:"Относительное местоимение, женский род, ед. ч. Также для мн. ч. предметов.", pair:"Мужской род: ٱلَّذِي. Мн. ч. (о людях): ٱلَّذِينَ.", tip:"ٱلَّذِي и ٱلَّتِي отличаются только буквами ذ ↔ ت — так же, как ذَٰلِكَ ↔ تِلْكَ.", ex:"Так бойтесь Огня, топливом для которого служат люди и камни."} } },
  { id:"alladhina", ar:"ٱلَّذِينَ", q:"الذين", ex:{ref:"1:7", ar:"صِرَاطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ"},
    m:{de:"die, welche (Plural)", en:"those who", ru:"которые (мн. ч.)"},
    info:{
     de:{gram:"Relativpronomen, maskulin Plural (Gruppen von Menschen).", pair:"Singular: ٱلَّذِي (m.), ٱلَّتِي (f.).", tip:"Eines der häufigsten Wörter im Quran, z. B. ٱلَّذِينَ آمَنُوا (die, die glauben). Mit ل wird es zu لِلَّذِينَ. Diese Form ist mitgesucht.", ex:"den Weg derjenigen, denen Du Gunst erwiesen hast."},
     en:{gram:"Relative pronoun, masculine plural (groups of people).", pair:"Singular: ٱلَّذِي (m.), ٱلَّتِي (f.).", tip:"One of the most frequent words in the Quran, e.g. ٱلَّذِينَ آمَنُوا (those who believe). With ل it becomes لِلَّذِينَ. That form is included in the search.", ex:"the path of those You have blessed"},
     ru:{gram:"Относительное местоимение, мужской род, мн. ч. (группы людей).", pair:"Ед. ч.: ٱلَّذِي (м. р.), ٱلَّتِي (ж. р.).", tip:"Одно из самых частых слов в Коране, напр. ٱلَّذِينَ آمَنُوا (те, которые уверовали). С ل превращается в لِلَّذِينَ. Эта форма включена в поиск.", ex:"путём тех, кого Ты облагодетельствовал"} } },
  { id:"hadhihi-pl", ar:"هَٰذِهِ", q:"هذه", ex:{ref:"6:139", ar:"مَا فِي بُطُونِ هَٰذِهِ ٱلْأَنْعَامِ"},
    m:{de:"diese (Dinge, Plural)", en:"these (things)", ru:"эти (о предметах, мн. ч.)"},
    info:{
     de:{gram:"Für Plurale von Dingen, Tieren und Begriffen nimmt das Arabische die feminine Singularform: هَٰذِهِ.", pair:"Für Personen im Plural dagegen: هَٰؤُلَاءِ.", tip:"Gleiches Wort wie „diese (f.)“, deshalb zeigt die Suche dieselben Ayat. Achte im Text darauf, ob danach ein Plural steht.", ex:"was im Leib dieses Viehs ist"},
     en:{gram:"For plurals of things, animals and ideas, Arabic uses the feminine singular form: هَٰذِهِ.", pair:"For people in the plural, use هَٰؤُلَاءِ instead.", tip:"Same word as “this (f.)”, so the search shows the same ayat. Check in the text whether a plural follows.", ex:"what is in the bellies of these cattle"},
     ru:{gram:"Для мн. ч. предметов, животных и понятий в арабском используется форма женского рода ед. ч.: هَٰذِهِ.", pair:"Для людей во мн. ч. используется هَٰؤُلَاءِ.", tip:"То же слово, что «эта (ж. р.)», поэтому поиск показывает те же аяты. Смотри по тексту, следует ли за ним мн. ч.", ex:"то, что в утробах этого скота"} } },
 ]},
 { id:2, sub:{de:"Ja, Nein und Verneinung", en:"Yes, no and negation", ru:"Да, нет и отрицание"}, words:[
  { id:"naam", ar:"نَعَمْ", q:"نعم", v:"نَعَمْ", ex:{ref:"7:44", ar:"فَهَلْ وَجَدتُّم مَّا وَعَدَ رَبُّكُمْ حَقًّا ۖ قَالُوا۟ نَعَمْ"},
    m:{de:"ja", en:"yes", ru:"да"},
    info:{
     de:{gram:"Antwortpartikel: bestätigt eine Frage oder Aussage.", pair:"Gegenteil: لَا (nein). Auf eine verneinte Frage antwortet man mit بَلَىٰ statt نَعَمْ.", tip:"Nicht verwechseln mit نِعَمٌ (Gaben, Wohltaten) und نِعْمَ (wie vortrefflich). Die App zeigt nur نَعَمْ mit genau diesen Vokalen.", ex:"„Habt ihr gefunden, dass das, was euer Herr versprochen hat, wahr ist?“ Sie sagten: „Ja.“"},
     en:{gram:"Answer particle: confirms a question or statement.", pair:"Opposite: لَا (no). To a negative question you answer بَلَىٰ instead of نَعَمْ.", tip:"Don't confuse it with نِعَمٌ (blessings) and نِعْمَ (how excellent). The app only shows نَعَمْ with exactly these vowels.", ex:"“Have you found what your Lord promised to be true?” They said: “Yes.”"},
     ru:{gram:"Частица ответа: подтверждает вопрос или утверждение.", pair:"Противоположность: لَا (нет). На отрицательный вопрос отвечают بَلَىٰ, а не نَعَمْ.", tip:"Не путай с نِعَمٌ (блага) и نِعْمَ (как прекрасен). Приложение показывает только نَعَمْ именно с этими огласовками.", ex:"«Нашли ли вы обещанное вашим Господом истинным?» Они сказали: «Да»."} } },
  { id:"bala", ar:"بَلَىٰ", q:"بلى", v:"بَلَى", ex:{ref:"7:172", ar:"أَلَسْتُ بِرَبِّكُمْ ۖ قَالُوا۟ بَلَىٰ"},
    m:{de:"doch, ja doch", en:"yes, indeed", ru:"да, конечно (на отриц. вопрос)"},
    info:{
     de:{gram:"Antwort auf eine verneinte Frage: widerspricht der Verneinung („doch!“).", pair:"Vergleiche نَعَمْ: Auf „Bist du nicht gekommen?“ heißt نَعَمْ „stimmt, ich bin nicht gekommen“, بَلَىٰ heißt „doch, ich bin gekommen“.", tip:"Das ى am Ende wird wie ā gesprochen: balā.", ex:"„Bin Ich nicht euer Herr?“ Sie sagten: „Doch!“"},
     en:{gram:"Answer to a negative question: contradicts the negation (“yes, indeed!”).", pair:"Compare نَعَمْ: to “Didn't you come?”, نَعَمْ means “right, I didn't”, while بَلَىٰ means “yes, I did”.", tip:"The final ى is pronounced ā: balā.", ex:"“Am I not your Lord?” They said: “Yes, indeed!”"},
     ru:{gram:"Ответ на отрицательный вопрос: опровергает отрицание («нет же, да!»).", pair:"Сравни с نَعَمْ: на «Разве ты не пришёл?» نَعَمْ значит «верно, не пришёл», а بَلَىٰ — «нет, пришёл».", tip:"Конечная ى читается как ā: balā.", ex:"«Разве Я не ваш Господь?» Они сказали: «Да, конечно!»"} } },
  { id:"kalla", ar:"كَلَّا", q:"كلا", v:"كَلَّا", ex:{ref:"102:3", ar:"كَلَّا سَوْفَ تَعْلَمُونَ"},
    m:{de:"keineswegs!", en:"certainly not", ru:"отнюдь, ни в коем случае"},
    info:{
     de:{gram:"Starke Zurückweisung: „keineswegs! ganz und gar nicht!“. Manchmal auch „wahrlich!“.", pair:"Stärker als لَا. Typisch für die mekkanischen Suren.", tip:"Kommt nur in der zweiten Hälfte des Quran vor, das meiste davon im letzten Juz. Nicht verwechseln mit كُلًّا (jeden), die App zeigt nur كَلَّا.", ex:"Keineswegs! Ihr werdet es bald wissen."},
     en:{gram:"Strong rejection: “certainly not! by no means!”. Sometimes also “truly!”.", pair:"Stronger than لَا. Typical of the Meccan surahs.", tip:"It only occurs in the second half of the Quran, most of it in the last Juz. Don't confuse it with كُلًّا (each); the app only shows كَلَّا.", ex:"No! You are going to know."},
     ru:{gram:"Сильное отрицание: «отнюдь! ни в коем случае!». Иногда также «воистину!».", pair:"Сильнее, чем لَا. Типично для мекканских сур.", tip:"Встречается только во второй половине Корана, больше всего в последнем джузе. Не путай с كُلًّا (каждого), приложение показывает только كَلَّا.", ex:"Так нет же! Скоро вы узнаете."} } },
  { id:"illa", ar:"إِلَّا", q:"إلا", v:"إِلَّا", ex:{ref:"47:19", ar:"فَٱعْلَمْ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱللَّهُ"},
    m:{de:"außer, nur", en:"but, except", ru:"кроме, только"},
    info:{
     de:{gram:"Ausnahmepartikel: „außer“. Nach einer Verneinung heißt sie „nur“.", pair:"Mit Verneinung: لَا … إِلَّا, مَا … إِلَّا, إِنْ … إِلَّا = „nichts … außer“ = „nur“.", tip:"Kern der Schahada: لَا إِلَٰهَ إِلَّا ٱللَّهُ. Nicht verwechseln mit أَلَّا (dass nicht), das mit Fatha beginnt.", ex:"So wisse, dass es keinen Gott gibt außer Allah."},
     en:{gram:"Particle of exception: “except”. After a negation it means “only”.", pair:"With a negation: لَا … إِلَّا, مَا … إِلَّا, إِنْ … إِلَّا = “nothing … but” = “only”.", tip:"The heart of the shahada: لَا إِلَٰهَ إِلَّا ٱللَّهُ. Don't confuse it with أَلَّا (that … not), which starts with a fatha.", ex:"So know that there is no god except Allah."},
     ru:{gram:"Частица исключения: «кроме». После отрицания означает «только».", pair:"С отрицанием: لَا … إِلَّا, مَا … إِلَّا, إِنْ … إِلَّا = «нет ничего, кроме» = «только».", tip:"Основа шахады: لَا إِلَٰهَ إِلَّا ٱللَّهُ. Не путай с أَلَّا (чтобы не), которое начинается с фатхи.", ex:"Знай же, что нет божества, кроме Аллаха."} } },
  { id:"in-illa", ar:"إِنْ … إِلَّا", combo:[{q:"إن", v:["إِنْ","إِنِ"]},{q:"إلا", v:"إِلَّا"}], ex:{ref:"53:4", ar:"إِنْ هُوَ إِلَّا وَحْىٌ يُوحَىٰ"},
    m:{de:"nichts … außer, nur", en:"nothing … but", ru:"не … кроме, лишь"},
    info:{
     de:{gram:"إِنْ ist hier keine Bedingung („wenn“), sondern eine Verneinung („nicht“). Zusammen mit إِلَّا: „es ist nichts als …“.", pair:"Gleiche Bedeutung wie مَا … إِلَّا. Nicht verwechseln mit إِنَّ (wahrlich) mit Schadda.", tip:"Faustregel: Kommt später im Satz ein إِلَّا, ist إِنْ meist eine Verneinung. Die App zeigt Ayat, in denen auf إِنْ ein إِلَّا folgt.", ex:"Es ist nichts anderes als eine Offenbarung, die eingegeben wird."},
     en:{gram:"Here إِنْ is not a condition (“if”) but a negation (“not”). Together with إِلَّا: “it is nothing but …”.", pair:"Same meaning as مَا … إِلَّا. Don't confuse it with إِنَّ (indeed), which has a shadda.", tip:"Rule of thumb: if an إِلَّا follows later in the sentence, إِنْ is usually a negation. The app shows ayat where إِنْ is followed by إِلَّا.", ex:"It is nothing but a revelation revealed."},
     ru:{gram:"Здесь إِنْ — не условие («если»), а отрицание («не»). Вместе с إِلَّا: «это не что иное, как …».", pair:"То же значение, что مَا … إِلَّا. Не путай с إِنَّ (воистину) с шаддой.", tip:"Правило: если дальше в предложении стоит إِلَّا, то إِنْ обычно отрицание. Приложение показывает аяты, где за إِنْ следует إِلَّا.", ex:"Это — всего лишь откровение, которое внушается."} } },
  { id:"ma-illa", ar:"مَا … إِلَّا", combo:[{q:"ما", v:"مَا"},{q:"إلا", v:"إِلَّا"}], ex:{ref:"51:56", ar:"وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ"},
    m:{de:"nichts … außer, nur", en:"nothing … but", ru:"не … кроме, лишь"},
    info:{
     de:{gram:"مَا verneint, إِلَّا nimmt aus: „nichts … außer“, also „nur“.", pair:"Gleiche Bedeutung wie إِنْ … إِلَّا.", tip:"Eine sehr häufige Art, im Quran „nur“ auszudrücken. Kommt nach مَا später ein إِلَّا, ist مَا meist die Verneinung und nicht „was“.", ex:"Und Ich habe die Dschinn und die Menschen nur erschaffen, damit sie Mir dienen."},
     en:{gram:"مَا negates, إِلَّا makes the exception: “nothing … but”, i.e. “only”.", pair:"Same meaning as إِنْ … إِلَّا.", tip:"A very common way to say “only” in the Quran. If an إِلَّا follows مَا, then مَا is usually the negation and not “what”.", ex:"And I did not create the jinn and mankind except to worship Me."},
     ru:{gram:"مَا отрицает, إِلَّا делает исключение: «не … кроме», то есть «только».", pair:"То же значение, что إِنْ … إِلَّا.", tip:"Очень частый способ сказать «только» в Коране. Если после مَا дальше стоит إِلَّا, то مَا обычно отрицание, а не «что».", ex:"Я сотворил джиннов и людей только для того, чтобы они поклонялись Мне."} } },
  { id:"alla", ar:"أَلَّا", q:"ألا", v:"أَلَّا", ex:{ref:"11:2", ar:"أَلَّا تَعْبُدُوٓا۟ إِلَّا ٱللَّهَ"},
    m:{de:"dass nicht, damit nicht", en:"that … not, so as not", ru:"чтобы не, что не"},
    info:{
     de:{gram:"Zusammengezogen aus أَنْ + لَا: „dass nicht, damit nicht“.", pair:"Nicht verwechseln mit إِلَّا (außer): أَلَّا beginnt mit Fatha, إِلَّا mit Kasra.", tip:"Danach steht meist ein Verb im Konjunktiv: أَلَّا تَعْبُدُوا (dass ihr nicht dient). Manchmal steht im Quran getrennt أَن لَّا. Diese Stellen zeigt die Suche nicht.", ex:"Dass ihr nur Allah dienen sollt."},
     en:{gram:"Contracted from أَنْ + لَا: “that … not, so as not”.", pair:"Don't confuse it with إِلَّا (except): أَلَّا starts with a fatha, إِلَّا with a kasra.", tip:"Usually followed by a verb in the subjunctive: أَلَّا تَعْبُدُوا (that you do not worship). Sometimes the Quran writes it separately as أَن لَّا; the search doesn't show those.", ex:"That you worship none but Allah."},
     ru:{gram:"Слитная форма из أَنْ + لَا: «чтобы не, что не».", pair:"Не путай с إِلَّا (кроме): أَلَّا начинается с фатхи, إِلَّا — с кясры.", tip:"Обычно за ним глагол в сослагательном наклонении: أَلَّا تَعْبُدُوا (чтобы вы не поклонялись). Иногда в Коране пишется раздельно أَن لَّا, такие места поиск не показывает.", ex:"Чтобы вы не поклонялись никому, кроме Аллаха."} } },
  { id:"la", ar:"لَا", q:"لا", v:"لَا", vexcl:["أَ","أَفَ","أَوَ"], ex:{ref:"2:286", ar:"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا"},
    m:{de:"nicht, kein, nein", en:"do(es) not, no", ru:"не, нет"},
    info:{
     de:{gram:"Allgemeine Verneinung: „nicht“ vor Verben in der Gegenwart, „kein“ vor Nomen, „nein“ als Antwort. Vor dem Jussiv ist es ein Verbot: „tu nicht!“.", pair:"Gegenwart: لَا, Vergangenheit: لَمْ, Zukunft: لَنْ.", tip:"Das häufigste Verneinungswort im Quran. أَلَا (wahrlich!) ist eine andere Partikel und wird hier nicht mitgezählt.", ex:"Allah erlegt keiner Seele mehr auf, als sie zu leisten vermag."},
     en:{gram:"General negation: “not” before present-tense verbs, “no” before nouns and as an answer. Before the jussive it forbids: “do not!”.", pair:"Present: لَا, past: لَمْ, future: لَنْ.", tip:"The most frequent negation word in the Quran. أَلَا (truly!) is a different particle and is not counted here.", ex:"Allah does not burden a soul beyond its capacity."},
     ru:{gram:"Общее отрицание: «не» перед глаголами настоящего времени, «нет» перед именами и в ответе. Перед джазмом — запрет: «не делай!».", pair:"Настоящее: لَا, прошедшее: لَمْ, будущее: لَنْ.", tip:"Самое частое слово отрицания в Коране. أَلَا (воистину!) — другая частица, здесь она не учитывается.", ex:"Аллах не возлагает на душу сверх её возможностей."} } },
  { id:"ma", ar:"مَا", q:"ما", v:"مَا", ex:{ref:"53:2", ar:"مَا ضَلَّ صَاحِبُكُمْ وَمَا غَوَىٰ"},
    m:{de:"nicht (auch: was)", en:"not (also: what)", ru:"не (также: что)"},
    info:{
     de:{gram:"مَا hat mehrere Aufgaben: Verneinung („nicht“, oft vor Verben in der Vergangenheit), aber auch „was“ (Frage oder Relativ).", pair:"Vergangenheit verneinen: مَا + Perfekt oder لَمْ + Jussiv. Beides heißt „hat nicht“.", tip:"Die Suche zeigt alle مَا, also auch die Bedeutung „was“. Welche gemeint ist, entscheidet nur der Zusammenhang.", ex:"Euer Gefährte ist weder irregegangen, noch hat er sich geirrt."},
     en:{gram:"مَا has several jobs: negation (“not”, often before past-tense verbs), but also “what” (question or relative).", pair:"Negating the past: مَا + perfect or لَمْ + jussive. Both mean “did not”.", tip:"The search shows every مَا, including the meaning “what”. Only the context tells you which one it is.", ex:"Your companion has not strayed, nor has he erred."},
     ru:{gram:"У مَا несколько функций: отрицание («не», часто перед глаголом прошедшего времени), а также «что» (вопрос или относительное).", pair:"Отрицание прошлого: مَا + прошедшее время или لَمْ + джазм. Оба значат «не сделал».", tip:"Поиск показывает все مَا, в том числе в значении «что». Какое из них — подскажет только контекст.", ex:"Ваш товарищ не заблудился и не сбился с пути."} } },
  { id:"lan", ar:"لَنْ", q:"لن", v:"لَنْ", ex:{ref:"3:92", ar:"لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ"},
    m:{de:"wird nicht, niemals", en:"will not", ru:"не будет, никогда не"},
    info:{
     de:{gram:"Verneint die Zukunft: „wird nicht, wird niemals“. Danach steht das Verb im Konjunktiv (Endung -a).", pair:"Gegenwart: لَا, Vergangenheit: لَمْ, Zukunft: لَنْ.", tip:"Das Verb danach verliert oft das ن am Ende: تَنَالُونَ → لَن تَنَالُوا.", ex:"Ihr werdet die Güte nicht erlangen, bis ihr von dem ausgebt, was ihr liebt."},
     en:{gram:"Negates the future: “will not, will never”. The verb after it is in the subjunctive (ending -a).", pair:"Present: لَا, past: لَمْ, future: لَنْ.", tip:"The verb after it often loses its final ن: تَنَالُونَ → لَن تَنَالُوا.", ex:"You will never attain righteousness until you spend from what you love."},
     ru:{gram:"Отрицает будущее: «не будет, никогда не». Глагол после него в сослагательном наклонении (окончание -a).", pair:"Настоящее: لَا, прошедшее: لَمْ, будущее: لَنْ.", tip:"Глагол после него часто теряет конечную ن: تَنَالُونَ → لَن تَنَالُوا.", ex:"Вы не достигнете благочестия, пока не станете расходовать из того, что любите."} } },
  { id:"lam", ar:"لَمْ", q:"لم", v:["لَمْ","لَمِ"], ex:{ref:"112:3", ar:"لَمْ يَلِدْ وَلَمْ يُولَدْ"},
    m:{de:"hat nicht (Vergangenheit)", en:"did not", ru:"не (прошедшее)"},
    info:{
     de:{gram:"Verneint die Vergangenheit: „hat nicht“. Danach steht ein Verb in der Gegenwartsform im Jussiv (ohne Vokal am Ende), die Bedeutung ist aber Vergangenheit.", pair:"Gegenwart: لَا, Vergangenheit: لَمْ, Zukunft: لَنْ. Mit Fragepartikel: أَلَمْ (hat … nicht?).", tip:"Nicht verwechseln mit لِمَ (warum?). Die App zeigt nur لَمْ.", ex:"Er hat nicht gezeugt und ist nicht gezeugt worden."},
     en:{gram:"Negates the past: “did not”. It is followed by a present-tense verb in the jussive (no final vowel), but the meaning is past.", pair:"Present: لَا, past: لَمْ, future: لَنْ. With the question particle: أَلَمْ (didn't …?).", tip:"Don't confuse it with لِمَ (why?). The app only shows لَمْ.", ex:"He neither begets nor was He begotten."},
     ru:{gram:"Отрицает прошлое: «не сделал». После него глагол настоящего времени в джазме (без конечной огласовки), но смысл — прошедший.", pair:"Настоящее: لَا, прошедшее: لَمْ, будущее: لَنْ. С вопросительной частицей: أَلَمْ (разве не …?).", tip:"Не путай с لِمَ (почему?). Приложение показывает только لَمْ.", ex:"Он не родил и не был рождён."} } },
  { id:"laysa", ar:"لَيْسَ / لَيْسَتْ", q:"ليس|ليست|ليسوا|لست|لستم|لستن", ex:{ref:"42:11", ar:"لَيْسَ كَمِثْلِهِۦ شَىْءٌ"},
    m:{de:"ist nicht, sind nicht", en:"is / are not", ru:"не является, нет"},
    info:{
     de:{gram:"Verneinendes Verb: „ist nicht, sind nicht“. Es wird wie ein Verb konjugiert: لَيْسَ (er), لَيْسَتْ (sie), لَيْسُوا (sie, Pl.), لَسْتَ (du), لَسْتُ (ich). Alle Formen sind mitgesucht.", pair:"Verneint Nominalsätze, so wie كَانَ (war) sie in die Vergangenheit setzt.", tip:"Das Prädikat danach steht oft mit بِ: أَلَيْسَ ٱللَّهُ بِكَافٍ عَبْدَهُ (Genügt Allah nicht Seinem Diener?).", ex:"Nichts ist Ihm gleich."},
     en:{gram:"Negating verb: “is not, are not”. It is conjugated like a verb: لَيْسَ (he), لَيْسَتْ (she), لَيْسُوا (they), لَسْتَ (you), لَسْتُ (I). All forms are included in the search.", pair:"It negates nominal sentences, just as كَانَ (was) puts them in the past.", tip:"The predicate after it often takes بِ: أَلَيْسَ ٱللَّهُ بِكَافٍ عَبْدَهُ (Is Allah not sufficient for His servant?).", ex:"There is nothing like unto Him."},
     ru:{gram:"Отрицательный глагол: «не является, нет». Спрягается как глагол: لَيْسَ (он), لَيْسَتْ (она), لَيْسُوا (они), لَسْتَ (ты), لَسْتُ (я). Все формы включены в поиск.", pair:"Отрицает именные предложения, так же как كَانَ (был) переносит их в прошлое.", tip:"Сказуемое после него часто с بِ: أَلَيْسَ ٱللَّهُ بِكَافٍ عَبْدَهُ (Разве Аллах не достаточен для Своего раба?).", ex:"Нет ничего подобного Ему."} } },
  { id:"ghayr", ar:"غَيْر", q:"غير|غيره|غيرها|غيرهم|غيركم|غيرنا|غيري|غيرك", ex:{ref:"1:7", ar:"غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ"},
    m:{de:"anders als, nicht", en:"other than, not", ru:"иной, чем; не"},
    info:{
     de:{gram:"Nomen, das verneint oder ausnimmt: „anders als, nicht, außer“. Steht immer vor einem anderen Wort (Genitivverbindung).", pair:"Ähnlich wie إِلَّا (außer), aber غَيْر ist ein Nomen und bekommt Fälle: غَيْرُ, غَيْرَ, غَيْرِ.", tip:"Bekannt aus der Fatiha: غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ. Die Formen mit Endung (غَيْرُهُ, غَيْرِهِمْ …) sind mitgesucht.", ex:"nicht (den Weg) derer, die (Deinen) Zorn erregt haben, und nicht der Irregehenden."},
     en:{gram:"A noun that negates or excepts: “other than, not, except”. It always comes before another word (genitive construction).", pair:"Similar to إِلَّا (except), but غَيْر is a noun and takes cases: غَيْرُ, غَيْرَ, غَيْرِ.", tip:"Familiar from al-Fatiha: غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ. Forms with pronoun endings (غَيْرُهُ, غَيْرِهِمْ …) are included in the search.", ex:"not of those who have earned anger, nor of those who go astray."},
     ru:{gram:"Имя, выражающее отрицание или исключение: «иной, чем; не; кроме». Всегда стоит перед другим словом (идафа).", pair:"Похоже на إِلَّا (кроме), но غَيْر — имя и изменяется по падежам: غَيْرُ, غَيْرَ, غَيْرِ.", tip:"Знакомо по Фатихе: غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ. Формы с местоимениями (غَيْرُهُ, غَيْرِهِمْ …) включены в поиск.", ex:"не тех, на кого пал гнев, и не заблудших."} } },
  { id:"min-duni", ar:"مِنْ دُونِ", q:"من دون|من دونه|من دونها|من دونهم|من دونكم|من دوني|من دونك|من دوننا|من دونهن", ex:{ref:"2:107", ar:"وَمَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِىٍّ وَلَا نَصِيرٍ"},
    m:{de:"außer, anstelle von", en:"without, besides", ru:"помимо, вместо"},
    info:{
     de:{gram:"Feste Verbindung: „außer, anstelle von, ohne“. Oft geht es um das, was Menschen neben Allah anbeten.", pair:"Ohne مِنْ heißt دُونَ allein „unterhalb, weniger als“ (nächstes Wort der Liste).", tip:"Sehr häufig: مِن دُونِ ٱللَّهِ (außer Allah). Die Formen mit Endung (مِن دُونِهِ, مِن دُونِهِمْ …) sind mitgesucht.", ex:"Und ihr habt außer Allah weder Schutzherrn noch Helfer."},
     en:{gram:"Fixed combination: “besides, instead of, without”. It is often about what people worship besides Allah.", pair:"Without مِنْ, دُونَ alone means “below, less than” (next word in the list).", tip:"Very common: مِن دُونِ ٱللَّهِ (besides Allah). Forms with pronoun endings (مِن دُونِهِ, مِن دُونِهِمْ …) are included in the search.", ex:"And you have no protector or helper besides Allah."},
     ru:{gram:"Устойчивое сочетание: «помимо, вместо, без». Часто о том, чему поклоняются помимо Аллаха.", pair:"Без مِنْ слово دُونَ значит «ниже, меньше чем» (следующее слово списка).", tip:"Очень часто: مِن دُونِ ٱللَّهِ (помимо Аллаха). Формы с местоимениями (مِن دُونِهِ, مِن دُونِهِمْ …) включены в поиск.", ex:"Нет у вас помимо Аллаха ни покровителя, ни помощника."} } },
  { id:"duna", ar:"دُونَ", q:"دون|دونه|دونها|دونهم|دونكم|دوني|دونك|دوننا|دونهن", notPrev:"من", ex:{ref:"4:48", ar:"وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَآءُ"},
    m:{de:"unterhalb, weniger als", en:"less than, lower than", ru:"ниже, меньше чем"},
    info:{
     de:{gram:"Ohne مِنْ: „unterhalb, unter, weniger als“.", pair:"Mit مِنْ: مِن دُونِ = „außer, anstelle von“.", tip:"Die Suche zeigt nur دُونَ, vor dem kein مِنْ steht.", ex:"Doch was geringer ist als das, vergibt Er, wem Er will."},
     en:{gram:"Without مِنْ: “below, beneath, less than”.", pair:"With مِنْ: مِن دُونِ = “besides, instead of”.", tip:"The search only shows دُونَ when it is not preceded by مِنْ.", ex:"but He forgives what is less than that for whom He wills."},
     ru:{gram:"Без مِنْ: «ниже, под, меньше чем».", pair:"С مِنْ: مِن دُونِ = «помимо, вместо».", tip:"Поиск показывает только دُونَ, перед которым нет مِنْ.", ex:"но прощает то, что меньше этого, кому пожелает."} } },
 ]},
 { id:3, sub:{de:"Fragewörter", en:"Question words", ru:"Вопросительные слова"}, words:[
  { id:"hal", ar:"أَ / هَلْ", q:"هل", v:["هَلْ","هَلِ"], ex:{ref:"88:1", ar:"هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ"},
    m:{de:"Fragepartikel (Ja/Nein-Frage)", en:"yes/no question", ru:"вопрос «да/нет»"},
    info:{
     de:{gram:"Macht aus einer Aussage eine Ja/Nein-Frage. أَ hängt direkt am nächsten Wort, هَلْ steht als eigenes Wort.", pair:"أَ kann auch vor Verneinungen stehen: أَلَمْ, أَلَيْسَ, أَفَلَا (… denn nicht?). هَلْ nicht.", tip:"Die Suche zeigt nur هَلْ, weil أَ mit dem nächsten Wort verbunden ist. Antwort: نَعَمْ oder لَا, auf verneinte Fragen بَلَىٰ (Liste 2).", ex:"Ist die Kunde von der Überdeckenden zu dir gekommen?"},
     en:{gram:"Turns a statement into a yes/no question. أَ is attached directly to the next word, هَلْ stands as its own word.", pair:"أَ can also come before negations: أَلَمْ, أَلَيْسَ, أَفَلَا (… not?). هَلْ can't.", tip:"The search only shows هَلْ, because أَ is joined to the next word. Answer with نَعَمْ or لَا, and with بَلَىٰ to negative questions (List 2).", ex:"Has the report of the Overwhelming reached you?"},
     ru:{gram:"Делает из утверждения вопрос «да/нет». أَ пишется слитно со следующим словом, هَلْ — отдельное слово.", pair:"أَ может стоять и перед отрицанием: أَلَمْ, أَلَيْسَ, أَفَلَا (разве не …?). هَلْ — нет.", tip:"Поиск показывает только هَلْ, потому что أَ слито со следующим словом. Ответ: نَعَمْ или لَا, на отрицательный вопрос — بَلَىٰ (список 2).", ex:"Дошёл ли до тебя рассказ о Покрывающем?"} } },
  { id:"madha", ar:"مَا / مَاذَا", q:"ما|ماذا", v:["مَا","مَاذَا"], ex:{ref:"2:215", ar:"يَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ"},
    m:{de:"was", en:"what", ru:"что"},
    info:{
     de:{gram:"Fragewort für Dinge: „was?“. مَاذَا ist die verstärkte Form (مَا + ذَا) und steht oft vor Verben.", pair:"Für Personen fragt man مَنْ (wer?).", tip:"مَا kann auch verneinen („nicht“, Liste 2) oder „das, was“ heißen. Die Suche zeigt alle مَا und مَاذَا.", ex:"Sie fragen dich, was sie ausgeben sollen."},
     en:{gram:"Question word for things: “what?”. مَاذَا is the reinforced form (مَا + ذَا) and often comes before verbs.", pair:"For people you ask مَنْ (who?).", tip:"مَا can also negate (“not”, List 2) or mean “that which”. The search shows every مَا and مَاذَا.", ex:"They ask you what they should spend."},
     ru:{gram:"Вопросительное слово о предметах: «что?». مَاذَا — усиленная форма (مَا + ذَا), часто стоит перед глаголом.", pair:"О людях спрашивают مَنْ (кто?).", tip:"مَا может также отрицать («не», список 2) или значить «то, что». Поиск показывает все مَا и مَاذَا.", ex:"Они спрашивают тебя, что им расходовать."} } },
  { id:"lima", ar:"لِمَ", q:"لم", v:"لِمَ", ex:{ref:"61:2", ar:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ"},
    m:{de:"warum", en:"why", ru:"почему"},
    info:{
     de:{gram:"Fragewort „warum?“. Zusammengesetzt aus لِ (für) + مَا (was), das Alif fällt weg: „wofür?“.", pair:"Gleich geschrieben wie لَمْ (hat nicht), aber mit anderen Vokalen: لِمَ mit Kasra, لَمْ mit Fatha.", tip:"Merke: لِمَ = لِ + مَا, wörtlich „wozu?“. Die App zeigt nur لِمَ.", ex:"O die ihr glaubt, warum sagt ihr, was ihr nicht tut?"},
     en:{gram:"Question word “why?”. Made of لِ (for) + مَا (what) with the alif dropped: “what for?”.", pair:"Written like لَمْ (did not), but with different vowels: لِمَ with a kasra, لَمْ with a fatha.", tip:"Remember: لِمَ = لِ + مَا, literally “what for?”. The app only shows لِمَ.", ex:"O you who believe, why do you say what you do not do?"},
     ru:{gram:"Вопросительное слово «почему?». Составлено из لِ (для) + مَا (что), алиф выпадает: «для чего?».", pair:"Пишется как لَمْ (не сделал), но огласовки другие: لِمَ с кясрой, لَمْ с фатхой.", tip:"Запомни: لِمَ = لِ + مَا, буквально «для чего?». Приложение показывает только لِمَ.", ex:"О те, которые уверовали! Почему вы говорите то, чего не делаете?"} } },
  { id:"man", ar:"مَنْ", q:"من", v:["مَنْ","مَنِ"], ex:{ref:"2:255", ar:"مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ"},
    m:{de:"wer", en:"who", ru:"кто"},
    info:{
     de:{gram:"Fragewort für Personen: „wer?“. Oft auch als Relativ: „wer, derjenige, der“.", pair:"Für Dinge: مَا (was?). Nicht verwechseln mit مِنْ (von, aus) mit Kasra.", tip:"Die App zeigt nur مَنْ mit Fatha, nicht مِنْ. Häufige Form: فَمَنْ (wer also …?).", ex:"Wer ist es, der bei Ihm Fürsprache einlegen könnte, außer mit Seiner Erlaubnis?"},
     en:{gram:"Question word for people: “who?”. Often also relative: “whoever, the one who”.", pair:"For things: مَا (what?). Don't confuse it with مِنْ (from), which has a kasra.", tip:"The app only shows مَنْ with a fatha, not مِنْ. A common form: فَمَنْ (so who …?).", ex:"Who is it that can intercede with Him except by His permission?"},
     ru:{gram:"Вопросительное слово о людях: «кто?». Часто также относительное: «кто, тот, кто».", pair:"О предметах: مَا (что?). Не путай с مِنْ (из, от) с кясрой.", tip:"Приложение показывает только مَنْ с фатхой, не مِنْ. Частая форма: فَمَنْ (кто же …?).", ex:"Кто станет заступаться перед Ним без Его дозволения?"} } },
  { id:"mata", ar:"مَتَىٰ", q:"متى", v:"مَتَى", ex:{ref:"2:214", ar:"مَتَىٰ نَصْرُ ٱللَّهِ ۗ أَلَآ إِنَّ نَصْرَ ٱللَّهِ قَرِيبٌ"},
    m:{de:"wann", en:"when", ru:"когда"},
    info:{
     de:{gram:"Fragewort für die Zeit: „wann?“.", pair:"Für den Ort: أَيْنَ (wo?).", tip:"Im Quran fragen oft die Leugner: مَتَىٰ هَٰذَا ٱلْوَعْدُ (Wann tritt diese Androhung ein?).", ex:"Wann kommt Allahs Hilfe? Wahrlich, Allahs Hilfe ist nahe."},
     en:{gram:"Question word for time: “when?”.", pair:"For place: أَيْنَ (where?).", tip:"In the Quran it is often the deniers who ask: مَتَىٰ هَٰذَا ٱلْوَعْدُ (When will this promise be?).", ex:"When is the help of Allah? Indeed, the help of Allah is near."},
     ru:{gram:"Вопросительное слово о времени: «когда?».", pair:"О месте: أَيْنَ (где?).", tip:"В Коране часто спрашивают отрицающие: مَتَىٰ هَٰذَا ٱلْوَعْدُ (Когда же исполнится это обещание?).", ex:"Когда же придёт помощь Аллаха? Воистину, помощь Аллаха близка."} } },
  { id:"ayna", ar:"أَيْنَ", q:"أين", v:"أَيْنَ", ex:{ref:"81:26", ar:"فَأَيْنَ تَذْهَبُونَ"},
    m:{de:"wo, wohin", en:"where", ru:"где, куда"},
    info:{
     de:{gram:"Fragewort für den Ort: „wo? wohin?“.", pair:"Für die Zeit: مَتَىٰ (wann?). Für „woher?“ steht oft أَنَّىٰ.", tip:"Nicht verwechseln mit أَيْنَمَا (wo auch immer). Das ist ein eigenes Wort und wird hier nicht mitgezählt.", ex:"Wohin geht ihr denn?"},
     en:{gram:"Question word for place: “where? where to?”.", pair:"For time: مَتَىٰ (when?). For “from where?” the Quran often uses أَنَّىٰ.", tip:"Don't confuse it with أَيْنَمَا (wherever). That is a separate word and is not counted here.", ex:"So where are you going?"},
     ru:{gram:"Вопросительное слово о месте: «где? куда?».", pair:"О времени: مَتَىٰ (когда?). Для «откуда?» часто используется أَنَّىٰ.", tip:"Не путай с أَيْنَمَا (где бы ни). Это отдельное слово, здесь оно не учитывается.", ex:"Куда же вы идёте?"} } },
  { id:"kayfa", ar:"كَيْفَ", q:"كيف", v:"كَيْفَ", ex:{ref:"2:28", ar:"كَيْفَ تَكْفُرُونَ بِٱللَّهِ وَكُنتُمْ أَمْوَٰتًا فَأَحْيَٰكُمْ"},
    m:{de:"wie", en:"how", ru:"как"},
    info:{
     de:{gram:"Fragewort für die Art und Weise: „wie?“.", pair:"أَنَّىٰ heißt ebenfalls „wie?“, ist aber meist rhetorisch und drückt Erstaunen aus.", tip:"Oft als Aufforderung zum Nachdenken: فَٱنظُرُوا كَيْفَ كَانَ عَاقِبَةُ … (so schaut, wie das Ende … war).", ex:"Wie könnt ihr Allah verleugnen, wo ihr doch tot wart und Er euch lebendig gemacht hat?"},
     en:{gram:"Question word for manner: “how?”.", pair:"أَنَّىٰ also means “how?”, but it is mostly rhetorical and expresses astonishment.", tip:"Often a call to reflect: فَٱنظُرُوا كَيْفَ كَانَ عَاقِبَةُ … (so see how the end of … was).", ex:"How can you disbelieve in Allah when you were lifeless and He gave you life?"},
     ru:{gram:"Вопросительное слово об образе действия: «как?».", pair:"أَنَّىٰ тоже значит «как?», но чаще риторически, с удивлением.", tip:"Часто как призыв задуматься: فَٱنظُرُوا كَيْفَ كَانَ عَاقِبَةُ … (посмотрите, каким был конец …).", ex:"Как вы можете не веровать в Аллаха, если вы были мертвы, и Он оживил вас?"} } },
  { id:"kam", ar:"كَمْ", q:"كم", v:["كَمْ","كَمِ"], ex:{ref:"2:249", ar:"كَم مِّن فِئَةٍ قَلِيلَةٍ غَلَبَتْ فِئَةً كَثِيرَةًۢ بِإِذْنِ ٱللَّهِ"},
    m:{de:"wie viel(e)", en:"how many / much", ru:"сколько"},
    info:{
     de:{gram:"Fragewort für Anzahl und Menge: „wie viel(e)?“. Im Quran oft als Ausruf: „wie viele …!“.", pair:"Die gezählte Sache steht oft mit مِنْ: كَم مِّن قَرْيَةٍ (wie viele Städte!).", tip:"Nicht verwechseln mit der Endung ـكُمْ (euch, euer), die an Wörtern hängt. Die App zählt nur كَمْ als eigenes Wort.", ex:"Wie manche kleine Schar hat schon mit Allahs Erlaubnis eine große Schar besiegt!"},
     en:{gram:"Question word for number and amount: “how many / how much?”. In the Quran often an exclamation: “how many …!”.", pair:"The thing counted often follows with مِنْ: كَم مِّن قَرْيَةٍ (how many towns!).", tip:"Don't confuse it with the ending ـكُمْ (you, your) attached to words. The app only counts كَمْ as a separate word.", ex:"How many a small company has overcome a large company by permission of Allah!"},
     ru:{gram:"Вопросительное слово о количестве: «сколько?». В Коране часто восклицание: «сколько …!».", pair:"Исчисляемое часто идёт с مِنْ: كَم مِّن قَرْيَةٍ (сколько селений!).", tip:"Не путай с окончанием ـكُمْ (вас, ваш), которое пишется слитно. Приложение считает только отдельное слово كَمْ.", ex:"Сколько раз малочисленный отряд побеждал многочисленный с позволения Аллаха!"} } },
  { id:"ayy", ar:"أَيّ", q:"أي|أيكم|أيهم|أيهما|أيا", v:["أَيُّ","أَيِّ","أَيَّ","أَيُّكُمْ","أَيِّكُمْ","أَيَّكُمْ","أَيُّهُمْ","أَيُّهُمَا","أَيًّا"], ex:{ref:"55:13", ar:"فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ"},
    m:{de:"welche(r)", en:"which", ru:"какой, который"},
    info:{
     de:{gram:"Fragewort „welche(r)?“. Es ist ein Nomen und steht vor einem anderen Wort: أَيُّ شَيْءٍ (welche Sache?).", pair:"Auch mit Endung: أَيُّكُمْ (wer von euch?), أَيُّهُمْ (wer von ihnen?).", tip:"Bekannt aus Sura ar-Rahman: فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ. Nicht verwechseln mit يَا أَيُّهَا (o ihr …), das wird hier nicht mitgezählt.", ex:"Welche der Wohltaten eures Herrn wollt ihr beide denn leugnen?"},
     en:{gram:"Question word “which?”. It is a noun and stands before another word: أَيُّ شَيْءٍ (which thing?).", pair:"Also with endings: أَيُّكُمْ (which of you?), أَيُّهُمْ (which of them?).", tip:"Familiar from Surah ar-Rahman: فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ. Don't confuse it with يَا أَيُّهَا (O you …), which is not counted here.", ex:"So which of the favours of your Lord would you both deny?"},
     ru:{gram:"Вопросительное слово «какой? который?». Это имя, оно стоит перед другим словом: أَيُّ شَيْءٍ (какая вещь?).", pair:"Также с окончаниями: أَيُّكُمْ (кто из вас?), أَيُّهُمْ (кто из них?).", tip:"Знакомо по суре ар-Рахман: فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ. Не путай с يَا أَيُّهَا (о вы …), здесь оно не учитывается.", ex:"Какую же из милостей вашего Господа вы оба считаете ложью?"} } },
  { id:"anna", ar:"أَنَّىٰ", q:"أنى", v:"أَنَّى", ex:{ref:"3:37", ar:"يَٰمَرْيَمُ أَنَّىٰ لَكِ هَٰذَا"},
    m:{de:"wie? woher? (meist rhetorisch)", en:"how? (mostly rhetorical)", ru:"как? откуда? (чаще риторически)"},
    info:{
     de:{gram:"Fragewort „wie? woher? wann?“, meist rhetorisch: Es drückt Erstaunen aus, oft im Sinn von „wie ist das nur möglich?“.", pair:"Ähnlich wie كَيْفَ (wie?) und مِنْ أَيْنَ (woher?).", tip:"Typisch: فَأَنَّىٰ تُؤْفَكُونَ (Wie lasst ihr euch nur abwenden?). Nicht verwechseln mit إِنِّي (wahrlich, ich) und أَنِّي (dass ich).", ex:"O Maryam, woher hast du das?"},
     en:{gram:"Question word “how? from where? when?”, mostly rhetorical: it expresses astonishment, often meaning “how could that be?”.", pair:"Similar to كَيْفَ (how?) and مِنْ أَيْنَ (from where?).", tip:"Typical: فَأَنَّىٰ تُؤْفَكُونَ (How then are you deluded?). Don't confuse it with إِنِّي (indeed I) and أَنِّي (that I).", ex:"O Mary, from where is this for you?"},
     ru:{gram:"Вопросительное слово «как? откуда? когда?», чаще риторическое: выражает удивление, «как же это возможно?».", pair:"Похоже на كَيْفَ (как?) и مِنْ أَيْنَ (откуда?).", tip:"Типично: فَأَنَّىٰ تُؤْفَكُونَ (До чего же вы отвращены от истины!). Не путай с إِنِّي (воистину я) и أَنِّي (что я).", ex:"О Марьям! Откуда у тебя это?"} } },
 ]},
 { id:4, sub:{de:"Orts- und Richtungswörter", en:"Place and direction words", ru:"Слова места и направления"}, words:[
  { id:"fawqa", ar:"فَوْقَ", q:"فوق|فوقه|فوقها|فوقهم|فوقكم|فوقنا|فوقهن", ex:{ref:"67:19", ar:"أَوَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ فَوْقَهُمْ صَٰٓفَّٰتٍ"},
    m:{de:"über, oberhalb", en:"above, over", ru:"над, выше"},
    info:{
     de:{gram:"Ortsangabe: „über, oberhalb“. Auch bildlich: „mehr als, über … hinaus“.", pair:"Gegenteil: تَحْتَ (unter).", tip:"Oft mit مِنْ: مِن فَوْقِهِمْ (von oben über ihnen). Die Formen mit Endung (فَوْقَهُمْ …) sind mitgesucht.", ex:"Sehen sie denn nicht die Vögel über sich, wie sie ihre Flügel ausbreiten?"},
     en:{gram:"Place word: “above, over”. Also figurative: “more than, beyond”.", pair:"Opposite: تَحْتَ (under).", tip:"Often with مِنْ: مِن فَوْقِهِمْ (from above them). Forms with pronoun endings (فَوْقَهُمْ …) are included in the search.", ex:"Do they not see the birds above them, spreading their wings?"},
     ru:{gram:"Слово места: «над, выше». Также переносно: «больше, сверх».", pair:"Противоположность: تَحْتَ (под).", tip:"Часто с مِنْ: مِن فَوْقِهِمْ (сверху над ними). Формы с местоимениями (فَوْقَهُمْ …) включены в поиск.", ex:"Разве они не видят над собой птиц, распростёрших крылья?"} } },
  { id:"taht", ar:"تَحْتَ", q:"تحت|تحته|تحتها|تحتهم|تحتي|تحتك|تحتكم|تحتهما", ex:{ref:"2:25", ar:"جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ"},
    m:{de:"unter, unterhalb", en:"under, beneath", ru:"под, ниже"},
    info:{
     de:{gram:"Ortsangabe: „unter, unterhalb“.", pair:"Gegenteil: فَوْقَ (über).", tip:"Sehr häufig bei der Beschreibung des Paradieses: تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَارُ (unter denen Flüsse fließen).", ex:"Gärten, unter denen Flüsse fließen"},
     en:{gram:"Place word: “under, beneath”.", pair:"Opposite: فَوْقَ (above).", tip:"Very common in descriptions of Paradise: تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَارُ (beneath which rivers flow).", ex:"gardens beneath which rivers flow"},
     ru:{gram:"Слово места: «под, ниже».", pair:"Противоположность: فَوْقَ (над).", tip:"Очень часто в описании Рая: تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَارُ (под которыми текут реки).", ex:"сады, под которыми текут реки"} } },
  { id:"yamin", ar:"يَمِين", q:"يمين|يمينه|يمينك|يمينهم|يمينكم", ex:{ref:"56:27", ar:"وَأَصْحَٰبُ ٱلْيَمِينِ مَآ أَصْحَٰبُ ٱلْيَمِينِ"},
    m:{de:"rechts, rechte Hand", en:"right (hand)", ru:"правая сторона, правая рука"},
    info:{
     de:{gram:"Nomen: „rechte Seite, rechte Hand“.", pair:"Gegenteil: شِمَال (links).", tip:"أَصْحَابُ ٱلْيَمِينِ sind die Leute der Rechten, also die Erfolgreichen. Achtung: Der Plural أَيْمَان heißt meist „Eide“ und wird hier nicht mitgezählt.", ex:"Und die Gefährten der Rechten, was sind die Gefährten der Rechten?"},
     en:{gram:"Noun: “right side, right hand”.", pair:"Opposite: شِمَال (left).", tip:"أَصْحَابُ ٱلْيَمِينِ are the people of the right, the successful ones. Note: the plural أَيْمَان usually means “oaths” and is not counted here.", ex:"And the companions of the right, what are the companions of the right?"},
     ru:{gram:"Имя: «правая сторона, правая рука».", pair:"Противоположность: شِمَال (левая).", tip:"أَصْحَابُ ٱلْيَمِينِ — люди правой стороны, то есть преуспевшие. Внимание: мн. ч. أَيْمَان обычно значит «клятвы» и здесь не учитывается.", ex:"А люди правой стороны — кто они, люди правой стороны?"} } },
  { id:"shimal", ar:"شِمَال", q:"شمال|شماله|شمائل|شمائلهم", ex:{ref:"56:41", ar:"وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"},
    m:{de:"links, linke Hand", en:"left (hand)", ru:"левая сторона, левая рука"},
    info:{
     de:{gram:"Nomen: „linke Seite, linke Hand“. Plural: شَمَائِل.", pair:"Gegenteil: يَمِين (rechts).", tip:"أَصْحَابُ ٱلشِّمَالِ sind die Leute der Linken, die Verlierer am Jüngsten Tag. Nicht verwechseln mit شَمَال (Norden) mit Fatha.", ex:"Und die Gefährten der Linken, was sind die Gefährten der Linken?"},
     en:{gram:"Noun: “left side, left hand”. Plural: شَمَائِل.", pair:"Opposite: يَمِين (right).", tip:"أَصْحَابُ ٱلشِّمَالِ are the people of the left, the losers on the Day of Judgement. Don't confuse it with شَمَال (north), which has a fatha.", ex:"And the companions of the left, what are the companions of the left?"},
     ru:{gram:"Имя: «левая сторона, левая рука». Мн. ч.: شَمَائِل.", pair:"Противоположность: يَمِين (правая).", tip:"أَصْحَابُ ٱلشِّمَالِ — люди левой стороны, потерпевшие убыток в Судный день. Не путай с شَمَال (север) с фатхой.", ex:"А люди левой стороны — кто они, люди левой стороны?"} } },
  { id:"bayna", ar:"بَيْنَ", q:"بين|بينه|بينها|بينهم|بينكم|بيننا|بيني|بينك|بينهما|بينهن", vstart:"بَيْن", ex:{ref:"25:67", ar:"وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا"},
    m:{de:"zwischen", en:"between", ru:"между"},
    info:{
     de:{gram:"Ortsangabe: „zwischen“. Steht oft zweimal: بَيْنَ … وَبَيْنَ … (zwischen … und …).", pair:"Feste Verbindungen: بَيْنَ أَيْدِي und بَيْنَ يَدَيْ (vor), siehe die nächsten Wörter.", tip:"Die Suche zeigt alle بَيْنَ, auch die in بَيْنَ يَدَيْ. Nicht verwechseln mit بَيِّنَة (klarer Beweis), die App zeigt nur بَيْنَ.", ex:"sondern dazwischen den rechten Mittelweg halten"},
     en:{gram:"Place word: “between”. Often repeated: بَيْنَ … وَبَيْنَ … (between … and …).", pair:"Fixed phrases: بَيْنَ أَيْدِي and بَيْنَ يَدَيْ (in front of), see the next words.", tip:"The search shows every بَيْنَ, including those in بَيْنَ يَدَيْ. Don't confuse it with بَيِّنَة (clear proof); the app only shows بَيْنَ.", ex:"but keep to a moderate way between those"},
     ru:{gram:"Слово места: «между». Часто повторяется: بَيْنَ … وَبَيْنَ … (между … и …).", pair:"Устойчивые сочетания: بَيْنَ أَيْدِي и بَيْنَ يَدَيْ (перед), см. следующие слова.", tip:"Поиск показывает все بَيْنَ, в том числе в بَيْنَ يَدَيْ. Не путай с بَيِّنَة (ясное доказательство), приложение показывает только بَيْنَ.", ex:"а придерживаются середины между этим"} } },
  { id:"bayna-aydi", ar:"بَيْنَ أَيْدِي", q:"بين أيدي|بين أيديهم|بين أيديكم|بين أيديهن|بين أيديهما", ex:{ref:"2:255", ar:"يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ"},
    m:{de:"vor (wörtl.: zwischen den Händen)", en:"in front of (lit. between the hands)", ru:"перед (букв.: между руками)"},
    info:{
     de:{gram:"Wörtlich „zwischen den Händen“ (أَيْدِي ist der Plural von يَد, Hand): „vor, vor ihnen“, räumlich oder zeitlich.", pair:"Gegenstück: خَلْف (hinter). Mit dem Dual: بَيْنَ يَدَيْ.", tip:"Typisch: مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ (was vor ihnen und was hinter ihnen ist).", ex:"Er weiß, was vor ihnen und was hinter ihnen liegt."},
     en:{gram:"Literally “between the hands” (أَيْدِي is the plural of يَد, hand): “in front of, before”, in space or time.", pair:"Counterpart: خَلْف (behind). With the dual: بَيْنَ يَدَيْ.", tip:"Typical: مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ (what is before them and what is behind them).", ex:"He knows what is before them and what is behind them."},
     ru:{gram:"Буквально «между руками» (أَيْدِي — мн. ч. от يَد, рука): «перед», в пространстве или времени.", pair:"Пара: خَلْف (позади). С двойственным числом: بَيْنَ يَدَيْ.", tip:"Типично: مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ (то, что перед ними, и то, что позади них).", ex:"Он знает то, что перед ними, и то, что позади них."} } },
  { id:"bayna-yaday", ar:"بَيْنَ يَدَيْ", q:"بين يدي|بين يديه|بين يديها|بين يديك", ex:{ref:"3:3", ar:"نَزَّلَ عَلَيْكَ ٱلْكِتَٰبَ بِٱلْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ"},
    m:{de:"vor (wörtl.: zwischen beiden Händen)", en:"in front of (lit. between both hands)", ru:"перед (букв.: между двумя руками)"},
    info:{
     de:{gram:"Wörtlich „zwischen den beiden Händen“ (يَدَيْ ist der Dual von يَد): „vor“. Oft zeitlich: „was vorher kam“.", pair:"Plural-Variante: بَيْنَ أَيْدِي.", tip:"Typisch für den Quran: مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ (bestätigend, was vor ihm offenbart wurde).", ex:"Er hat dir das Buch mit der Wahrheit offenbart, als Bestätigung dessen, was vor ihm war."},
     en:{gram:"Literally “between both hands” (يَدَيْ is the dual of يَد): “in front of”. Often about time: “what came before”.", pair:"Plural variant: بَيْنَ أَيْدِي.", tip:"Typical of the Quran: مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ (confirming what was revealed before it).", ex:"He has sent down to you the Book in truth, confirming what came before it."},
     ru:{gram:"Буквально «между двумя руками» (يَدَيْ — двойственное число от يَد): «перед». Часто о времени: «то, что было прежде».", pair:"Вариант с мн. ч.: بَيْنَ أَيْدِي.", tip:"Типично для Корана: مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ (подтверждая то, что было ниспослано до него).", ex:"Он ниспослал тебе Писание с истиной в подтверждение того, что было до него."} } },
  { id:"khalf", ar:"خَلْف", q:"خلف|خلفه|خلفها|خلفهم|خلفكم|خلفك|خلفنا", vstart:"خَلْف", ex:{ref:"41:42", ar:"لَّا يَأْتِيهِ ٱلْبَٰطِلُ مِنۢ بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِۦ"},
    m:{de:"hinter", en:"behind", ru:"позади, за"},
    info:{
     de:{gram:"Ortsangabe: „hinter“, räumlich und zeitlich („nach“).", pair:"Gegenteil: بَيْنَ يَدَيْ / بَيْنَ أَيْدِي (vor). Ähnlich: وَرَاءَ.", tip:"Nicht verwechseln mit خَلَفَ (nachfolgen) oder خَلِيفَة (Nachfolger), die dieselben Buchstaben haben. Die App zeigt nur خَلْف mit Sukun.", ex:"Das Falsche kommt nicht an es heran, weder von vorn noch von hinten."},
     en:{gram:"Place word: “behind”, in space and time (“after”).", pair:"Opposite: بَيْنَ يَدَيْ / بَيْنَ أَيْدِي (in front of). Similar: وَرَاءَ.", tip:"Don't confuse it with خَلَفَ (to succeed) or خَلِيفَة (successor), which share the same letters. The app only shows خَلْف with a sukun.", ex:"Falsehood cannot approach it from before it or from behind it."},
     ru:{gram:"Слово места: «позади», в пространстве и во времени («после»).", pair:"Противоположность: بَيْنَ يَدَيْ / بَيْنَ أَيْدِي (перед). Похоже: وَرَاءَ.", tip:"Не путай с خَلَفَ (сменять) или خَلِيفَة (наместник), у них те же буквы. Приложение показывает только خَلْف с сукуном.", ex:"Ложь не подступится к нему ни спереди, ни сзади."} } },
  { id:"waraa", ar:"وَرَاء", q:"وراء|وراءه|وراءهم|وراءكم|وراءي|ورائهم|ورائه|ورائي|وراءها", ex:{ref:"84:10", ar:"وَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ وَرَآءَ ظَهْرِهِۦ"},
    m:{de:"hinter, jenseits", en:"behind, beyond", ru:"позади, за пределами"},
    info:{
     de:{gram:"Ortsangabe: „hinter, jenseits“. Kann auch „außer, über … hinaus“ bedeuten.", pair:"Ähnlich wie خَلْف. Gegenteil: أَمَام (vor), das im Quran selten ist.", tip:"Bekannt: وَرَاءَ ظَهْرِهِ (hinter seinem Rücken). Die Formen mit Endung (وَرَاءَهُمْ …) sind mitgesucht.", ex:"Und was den angeht, dem sein Buch hinter seinem Rücken gegeben wird"},
     en:{gram:"Place word: “behind, beyond”. Can also mean “besides, apart from”.", pair:"Similar to خَلْف. Opposite: أَمَام (in front), which is rare in the Quran.", tip:"Well known: وَرَاءَ ظَهْرِهِ (behind his back). Forms with pronoun endings (وَرَاءَهُمْ …) are included in the search.", ex:"But as for the one who is given his record behind his back"},
     ru:{gram:"Слово места: «позади, за». Может значить и «кроме, сверх».", pair:"Похоже на خَلْف. Противоположность: أَمَام (впереди), в Коране редко.", tip:"Известно: وَرَاءَ ظَهْرِهِ (за спиной). Формы с местоимениями (وَرَاءَهُمْ …) включены в поиск.", ex:"А тот, чья книга будет вручена ему из-за спины"} } },
  { id:"hawl", ar:"حَوْل", q:"حول|حوله|حولها|حولهم|حولك|حولكم|حولين", vstart:"حَوْل", ex:{ref:"39:75", ar:"وَتَرَى ٱلْمَلَٰٓئِكَةَ حَآفِّينَ مِنْ حَوْلِ ٱلْعَرْشِ"},
    m:{de:"um … herum; Jahr", en:"around; year", ru:"вокруг; год"},
    info:{
     de:{gram:"Als Ortsangabe: „um … herum“. Als Nomen: „Jahr“ (حَوْل, Dual حَوْلَيْنِ).", pair:"Andere Wörter für Jahr: سَنَة und عَام.", tip:"Bekannt: مَنْ حَوْلَهُ (die um ihn herum) und حَوْلَيْنِ كَامِلَيْنِ (zwei volle Jahre).", ex:"Und du siehst die Engel den Thron von allen Seiten umgeben."},
     en:{gram:"As a place word: “around”. As a noun: “year” (حَوْل, dual حَوْلَيْنِ).", pair:"Other words for year: سَنَة and عَام.", tip:"Well known: مَنْ حَوْلَهُ (those around him) and حَوْلَيْنِ كَامِلَيْنِ (two full years).", ex:"And you will see the angels surrounding the Throne on all sides."},
     ru:{gram:"Как слово места: «вокруг». Как имя: «год» (حَوْل, двойств. ч. حَوْلَيْنِ).", pair:"Другие слова для «год»: سَنَة и عَام.", tip:"Известно: مَنْ حَوْلَهُ (те, кто вокруг него) и حَوْلَيْنِ كَامِلَيْنِ (два полных года).", ex:"Ты увидишь ангелов, обступивших Трон со всех сторон."} } },
  { id:"haythu", ar:"حَيْثُ", q:"حيث", ex:{ref:"2:144", ar:"وَحَيْثُ مَا كُنتُمْ فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ"},
    m:{de:"wo, dort wo", en:"where, wherever", ru:"где, там где"},
    info:{
     de:{gram:"Ortsangabe: „wo, dort wo“. Mit مَا: „wo auch immer“.", pair:"Ähnlich wie أَيْنَمَا (wo auch immer).", tip:"Endet immer auf -u (حَيْثُ). Typisch: مِنْ حَيْثُ لَا يَشْعُرُونَ (von wo sie es nicht merken).", ex:"Und wo immer ihr seid, wendet euer Gesicht in ihre Richtung."},
     en:{gram:"Place word: “where, wherever”. With مَا: “wherever”.", pair:"Similar to أَيْنَمَا (wherever).", tip:"It always ends in -u (حَيْثُ). Typical: مِنْ حَيْثُ لَا يَشْعُرُونَ (from where they do not perceive).", ex:"And wherever you are, turn your faces toward it."},
     ru:{gram:"Слово места: «где, там где». С مَا: «где бы ни».", pair:"Похоже на أَيْنَمَا (где бы ни).", tip:"Всегда оканчивается на -u (حَيْثُ). Типично: مِنْ حَيْثُ لَا يَشْعُرُونَ (откуда они не подозревают).", ex:"Где бы вы ни были, обращайте ваши лица в его сторону."} } },
  { id:"aynama", ar:"أَيْنَمَا", q:"أينما", ex:{ref:"2:115", ar:"فَأَيْنَمَا تُوَلُّوا۟ فَثَمَّ وَجْهُ ٱللَّهِ"},
    m:{de:"wo auch immer", en:"wherever", ru:"где бы ни"},
    info:{
     de:{gram:"Bedingungswort: „wo auch immer, wohin auch immer“. Aus أَيْنَ (wo) + مَا.", pair:"Ähnlich wie حَيْثُ مَا. أَيْنَ allein ist eine Frage (Liste 3).", tip:"An einigen Stellen ist es getrennt geschrieben (أَيْنَ مَا). Diese Stellen zeigt die Suche nicht.", ex:"Wohin ihr euch auch wendet, dort ist Allahs Angesicht."},
     en:{gram:"Conditional word: “wherever”. From أَيْنَ (where) + مَا.", pair:"Similar to حَيْثُ مَا. أَيْنَ alone is a question (List 3).", tip:"In a few places it is written separately (أَيْنَ مَا). The search does not show those.", ex:"So wherever you turn, there is the Face of Allah."},
     ru:{gram:"Условное слово: «где бы ни, куда бы ни». Из أَيْنَ (где) + مَا.", pair:"Похоже на حَيْثُ مَا. Само أَيْنَ — вопрос (список 3).", tip:"В некоторых местах пишется раздельно (أَيْنَ مَا), поиск их не показывает.", ex:"Куда бы вы ни повернулись, там будет Лик Аллаха."} } },
 ]},
 { id:5, sub:{de:"Präpositionen", en:"Prepositions", ru:"Предлоги"}, words:[
  { id:"bi", ar:"بِـ", q:"به|بها|بهم|بكم|بنا|بي|بك|بهما|بهن", vstart:"بِ", ex:{ref:"2:121", ar:"أُو۟لَٰٓئِكَ يُؤْمِنُونَ بِهِۦ"},
    m:{de:"mit, in, durch", en:"with, in, by", ru:"с, в, посредством"},
    info:{
     de:{gram:"Vorsilbe: „mit, in, durch, an“. Das Nomen danach steht im Genitiv: بِسْمِ ٱللَّهِ (im Namen Allahs).", pair:"Ähnlich: فِي (in), مَعَ (mit).", tip:"Als Vorsilbe kann die App بِـ nicht allein suchen. Gezählt werden die Formen mit Endung: بِهِ, بِهَا, بِهِمْ, بِكُمْ, بِنَا, بِي.", ex:"Diese glauben daran."},
     en:{gram:"Prefix: “with, in, by, at”. The noun after it is in the genitive: بِسْمِ ٱللَّهِ (in the name of Allah).", pair:"Similar: فِي (in), مَعَ (with).", tip:"As a prefix, the app can't search بِـ on its own. It counts the forms with endings: بِهِ, بِهَا, بِهِمْ, بِكُمْ, بِنَا, بِي.", ex:"They are the ones who believe in it."},
